  Object.assign({"id": "g17", "ph": "g", "year": 2021, "num": 149, "title": "A receita R de uma empresa ao final de um mês é o…", "src": "ENEM 2021 · Questão 149", "rate": null, "body": "<p>A receita R de uma empresa ao final de um mês é o volume de dinheiro captado com a venda de mercadorias ou com a prestação de serviços nesse mês, e a despesa D é todo a dinheiro utilizado para pagamento de salários, contas de água e luz, impostos, entre outros. O lucro mensal obtido ao final do mês é a diferença entre a receita e a despesa registradas no mês. O gráfico apresenta as receitas e despesas, em milhão de real, de uma empresa ao final dos cinco primeiros meses de um dado ano</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-149-2586c4f9.webp\" width=\"327\" height=\"308\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A previsão para os próximos meses é que o lucro mensal não seja inferior ao maior lucro obtido até o mês de Maio.<br>Nessas condições, o lucro mensal para os próximos meses deve ser maior ou igual ao do mês de", "opts": {"A": "Janeiro.", "B": "Fevereiro.", "C": "Março.", "D": "Abril.", "E": "Maio."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g18", "ph": "g", "year": 2021, "num": 156, "title": "Uma mola é solta da posição distendida conforme a…", "src": "ENEM 2021 · Questão 156", "rate": null, "body": "<p>Uma mola é solta da posição distendida conforme a figura. A figura à direita representa o gráfico da posição <i>P</i> (em cm) da massa m em função do tempo <i>t</i> (em segundo) em um sistema de coordenadas cartesianas. Esse movimento periódico é descrito por uma expressão do tipo P(t) = <img class=\"enem-inline\" src=\"img/2021-156-22072ec1.webp\" width=\"106\" height=\"25\" alt=\"\" loading=\"lazy\"> ou P(t) = <img class=\"enem-inline\" src=\"img/2021-156-86b2ce7b.webp\" width=\"105\" height=\"27\" alt=\"\" loading=\"lazy\">, em que A&gt;0 é a amplitude de deslocamento máximo e <img class=\"enem-inline\" src=\"img/2021-156-f1cfe3fa.webp\" width=\"19\" height=\"22\" alt=\"\" loading=\"lazy\"> é a frequência, que se relaciona com o período T pela fórmula <img class=\"enem-inline\" src=\"img/2021-156-38bd8acb.webp\" width=\"79\" height=\"55\" alt=\"\" loading=\"lazy\">.</p>\n<p>Considere a ausência de quaisquer forças dissipativas.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-156-9e69ba46.webp\" width=\"1002\" height=\"475\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A expressão algébrica que representa as posições P(t) da massa m, ao longo do tempo, no gráfico, é", "opts": {"A": "-3 cos (2t)", "B": "-3 sen (2t)", "C": "3 cos (2t)", "D": "-6 cos (2t)", "E": "6 cos (2t)"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g19", "ph": "g", "year": 2021, "num": 161, "title": "O administrador de um teatro percebeu que, com o…", "src": "ENEM 2021 · Questão 161", "rate": null, "body": "<p>O administrador de um teatro percebeu que, com o ingresso do evento a R$20,00, um show conseguia atrair 200 pessoas e que, a cada R$1,00 de redução no preço do ingresso, o número de pessoas aumentava em 40. Ele sabe que os donos do teatro só admitem trabalhar com valores inteiros para os ingressos, pela dificuldade de disponibilizar troco, e pretende convencê-los a diminuir o preço do ingresso. Assim, apresentará um gráfico da arrecadação em função do valor do desconto no preço atual do ingresso.</p>", "ask": "O gráfico que mais se assemelha ao que deve ser elaborado pelo administrador é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2021-161-71c29cd7.webp", 462, 319], "B": ["img/2021-161-a22cdccd.webp", 481, 340], "C": ["img/2021-161-13b92c32.webp", 484, 322], "D": ["img/2021-161-83ffed50.webp", 484, 304], "E": ["img/2021-161-9536b3b7.webp", 471, 295]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g20", "ph": "g", "year": 2021, "num": 162, "title": "O quadro representa a relação entre o preço de um…", "src": "ENEM 2021 · Questão 162", "rate": null, "body": "<p>O quadro representa a relação entre o preço de um produto (R) e seu respectivo imposto devido (l).</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-162-cc601335.webp\" width=\"495\" height=\"127\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "O gráfico que melhor representa essa relação é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2021-162-41839cfc.webp", 179, 185], "B": ["img/2021-162-8e1d0658.webp", 343, 210], "C": ["img/2021-162-070fd147.webp", 345, 213], "D": ["img/2021-162-a69d9997.webp", 337, 340], "E": ["img/2021-162-b9498a83.webp", 340, 214]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g21", "ph": "g", "year": 2020, "num": 143, "title": "No Brasil, o tempo necessário para um estudante…", "src": "ENEM 2020 · Questão 143", "rate": null, "body": "<p>No Brasil, o tempo necessário para um estudante realizar sua formação até a diplomação em um curso superior, considerando os 9 anos de ensino fundamental, os 3 anos do ensino médio e os 4 anos de graduação (tempo médio), é de 16 anos. No entanto, a realidade dos brasileiros mostra que o tempo médio de estudo de pessoas acima de 14 anos é ainda muito pequeno, conforme apresentado na tabela</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-143-044568f1.webp\" width=\"397\" height=\"94\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Considere que o incremento no tempo de estudo, a cada período, para essas pessoas, se mantenha constante até o ano 2050, e que se pretenda chegar ao patamar de 70% do tempo necessário à obtenção do curso superior dado anteriormente.</p>", "ask": "O ano em que o tempo médio de estudo de pessoas acima de 14 anos atingirá o percentual pretendido será", "opts": {"A": "2018.", "B": "2023.", "C": "2031.", "D": "2035.", "E": "2043."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g22", "ph": "g", "year": 2020, "num": 149, "title": "A Lei de Zipf, batizada com o nome do linguista…", "src": "ENEM 2020 · Questão 149", "rate": null, "body": "<p>A Lei de Zipf, batizada com o nome do linguista americano George Zipf, é uma lei empírica que relaciona a frequência (<i>f</i>) de uma palavra em um dado texto com o seu ranking (<i>r</i>). Ela é dada por</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-149-2d8babc0.webp\" width=\"119\" height=\"58\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O ranking da palavra é a sua posição ao ordenar as palavras por ordem de frequência. Ou seja, <i>r</i> = 1 para a palavra mais frequente, <i>r</i> = 2 para a segunda palavra mais frequente e assim sucessivamente. A e B são constantes positivas.</p>\n<p class=\"src-note\">Disponível em: http://klein.sbm.org.br. Acesso em: 12 ago. 2020 (adaptado).</p>", "ask": "Com base nos valores de X = log (r) e Y = log (f), é possível estimar valores para A e B.<br>No caso hipotético em que a lei é verificada exatamente, a relação entre Y e X é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-149-2d21dea0.webp", 250, 54], "B": ["img/2020-149-3da19e5d.webp", 174, 78], "C": ["img/2020-149-967ee169.webp", 232, 73], "D": ["img/2020-149-86c3898b.webp", 164, 80], "E": ["img/2020-149-4f3b7abd.webp", 136, 64]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g23", "ph": "g", "year": 2020, "num": 150, "title": "Enquanto um ser está vivo, a quantidade de carbono…", "src": "ENEM 2020 · Questão 150", "rate": null, "body": "<p>Enquanto um ser está vivo, a quantidade de carbono 14 nele existente não se altera. Quando ele morre, essa quantidade vai diminuindo. Sabe-se que a meia-vida do carbono 14 é de 5 730 anos, ou seja, num fóssil de um organismo que morreu há 5 730 anos haverá metade do carbono 14 que existia quando ele estava vivo. Assim, cientistas e arqueólogos usam a seguinte fórmula para saber a idade de um fóssil encontrado: <img class=\"enem-inline\" src=\"img/2020-150-2b0e7c3b.webp\" width=\"248\" height=\"52\" alt=\"\" loading=\"lazy\"> em que t é o tempo, medido em ano, Q(t) é a quantidade de carbono 14 medida no instante t e Q0 é a quantidade de carbono 14 no ser vivo correspondente.</p>\n<p>Um grupo de arqueólogos, numa de suas expedições, encontrou 5 fósseis de espécies conhecidas e mediram a  <br>quantidade de carbono 14 neles existente. Na tabela temos esses valores juntamente com a quantidade de carbono 14 nas referidas espécies vivas.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-150-ee42e39e.webp\" width=\"540\" height=\"239\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "O fóssil mais antigo encontrado nessa expedição foi", "opts": {"A": "1.", "B": "2.", "C": "3.", "D": "4.", "E": "5."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g24", "ph": "g", "year": 2020, "num": 164, "title": "A exposição a barulhos excessivos, como os que…", "src": "ENEM 2020 · Questão 164", "rate": null, "body": "<p>A exposição a barulhos excessivos, como os que percebemos em geral em trânsitos intensos, casas noturnas e espetáculos musicais, podem provocar insônia, estresse, infarto, perda de audição, entre outras enfermidades. De acordo com a Organização Mundial da Saúde, todo e qualquer som que ultrapasse os 55 decibéis (unidade de intensidade do som) já pode ser considerado nocivo para a saúde. O gráfico foi elaborado a partir da medição do ruído produzido, durante um dia, em um canteiro de obras.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-164-6d3ec2de.webp\" width=\"285\" height=\"156\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nesse dia, durante quantas horas o ruído esteve acima de 55 decibéis?", "opts": {"A": "5", "B": "8", "C": "10", "D": "11", "E": "13"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g25", "ph": "g", "year": 2020, "num": 166, "title": "O consumo de espumantes no Brasil tem aumentado nos…", "src": "ENEM 2020 · Questão 166", "rate": null, "body": "<p>O consumo de espumantes no Brasil tem aumentado nos últimos anos. Uma das etapas do seu processo de produção consiste no envasamento da bebida em garrafas semelhantes às da imagem. Nesse processo, a vazão do líquido no interior da garrafa é constante e cessa quando atinge o nível de envasamento.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-166-1a4fc8c3.webp\" width=\"435\" height=\"468\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual esboço de gráfico melhor representa a variação da altura do líquido em função do tempo, na garrafa indicada na imagem?", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-166-235d67a9.webp", 282, 231], "B": ["img/2020-166-2c4e5792.webp", 287, 228], "C": ["img/2020-166-6f1c120f.webp", 293, 226], "D": ["img/2020-166-008dc49b.webp", 280, 216], "E": ["img/2020-166-e96561ab.webp", 268, 212]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g26", "ph": "g", "year": 2020, "num": 175, "title": "Um administrador resolve estudar o lucro de sua…", "src": "ENEM 2020 · Questão 175", "rate": null, "body": "<p>Um administrador resolve estudar o lucro de sua empresa e, para isso, traça o gráfico da receita e do custo de produção de seus itens, em real, em função da quantidade de itens produzidos.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-175-33aa811b.webp\" width=\"202\" height=\"136\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O lucro é determinado pela diferença: Receita – Custo.</p>", "ask": "O gráfico que representa o lucro dessa empresa, em função da quantidade de itens produzidos, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-175-b3298ba7.webp", 206, 154], "B": ["img/2020-175-fdcc74b5.webp", 212, 167], "C": ["img/2020-175-8d380a8c.webp", 225, 175], "D": ["img/2020-175-5c8b1402.webp", 219, 154], "E": ["img/2020-175-f718a2fc.webp", 224, 173]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g27", "ph": "g", "year": 2019, "num": 139, "title": "Uma empresa presta serviço de abastecimento de água…", "src": "ENEM 2019 · Questão 139", "rate": null, "body": "<p>Uma empresa presta serviço de abastecimento de água em uma cidade. O valor mensal a pagar por esse serviço é determinado pela aplicação de tarifas, por faixas de consumo de água, sendo obtido pela adição dos valores correspondentes a cada faixa.</p>\n<p><b>•</b> Faixa 1: para consumo de até 6 m², valor fixo de R$12,00;</p>\n<p><b>•</b> Faixa 2: para consumo superior a 6 m³ e até 10 m³, tarifa de R$ 3,00 por metro cúbico ao que exceder a 6m³;</p>\n<p><b>•</b> Faixa 3: para consumo superior a 10 m³, tarifa de R$ 6,00 por metro cúbico ao que exceder a 10 m³. Sabe-se que nessa cidade o consumo máximo de água por residência é de 15 m² por mês.</p>", "ask": "O gráfico que melhor descreve o valor P, em real, a ser pago por mês, em função do volume V de água consumido, em metro cúbico, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2019-139-de1f40fe.webp", 200, 262], "B": ["img/2019-139-498952c5.webp", 191, 260], "C": ["img/2019-139-2b93a78d.webp", 213, 261], "D": ["img/2019-139-fd969b0c.webp", 224, 268], "E": ["img/2019-139-8ebb5528.webp", 228, 269]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g28", "ph": "g", "year": 2019, "num": 143, "title": "Os exercícios físicos são recomendados para o bom…", "src": "ENEM 2019 · Questão 143", "rate": null, "body": "<p>Os exercícios físicos são recomendados para o bom funcionamento do organismo, pois aceleram o metabolismo e, em consequência, elevam o consumo de calorias. No gráfico, estão registrados os valores calóricos, em kcal, gastos em cinco diferentes atividades físicas, em função do tempo dedicado às atividades, contado em minuto.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-143-ef507c14.webp\" width=\"527\" height=\"259\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual dessas atividades físicas proporciona o maior consumo de quilocalorias por minuto?", "opts": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g29", "ph": "g", "year": 2019, "num": 154, "title": "Charles Richter e Beno Gutenberg desenvolveram a…", "src": "ENEM 2019 · Questão 154", "rate": null, "body": "<p>Charles Richter e Beno Gutenberg desenvolveram a escala Richter, que mede a magnitude de um terremoto.  <br>Essa escala pode variar de 0 a 10, com possibilidades de valores maiores.</p>\n<p>O quadro mostra a escala de magnitude local (Ms) de um terremoto que é utilizada para descrevê-lo.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-154-1532ad8f.webp\" width=\"455\" height=\"242\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Para se calcular a magnitude local, usa-se a fórmula Ms = 3,30 + log(A.f), em que A representa a amplitude máxima da onda registrada por um sismógrafo em micrômetro (um) e f representa a frequência da onda, em hertz (Hz).</p>\n<p>Ocorreu um terremoto com amplitude máxima de 2 000 μm e frequência de 0,2 Hz.</p>\n<p><b>Disponivel em:</b> http://cejarj.cecierj.edu.br. Acesso em: 1 fev. 2015 (adaptado).</p>", "ask": "Utilize 0,3 como aproximação para log 2. De acordo com os dados fornecidos, o terremoto ocorrido pode ser descrito como", "opts": {"A": "Pequeno.", "B": "Ligeiro.", "C": "Moderado.", "D": "Grande.", "E": "Extremo."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g30", "ph": "g", "year": 2019, "num": 168, "title": "Uma empresa tem diversos funcionários.", "src": "ENEM 2019 · Questão 168", "rate": null, "body": "<p>Uma empresa tem diversos funcionários. Um deles é o gerente, que recebe R$ 1000,00 por semana.  <br>Os outros funcionários são diaristas. Cada um trabalha 2 dias por semana, recebendo R$ 80,00 por dia trabalhado.</p>", "ask": "Chamando de X a quantidade total de funcionários da empresa, a quantia Y, em reais, que esta empresa gasta semanalmente para pagar seus funcionários é expressa por", "opts": {"A": "Y = 80X + 920.", "B": "Y = 80X + 1000.", "C": "Y = 80X + 1080.", "D": "Y = 160X + 840.", "E": "Y = 160X + 1000."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g31", "ph": "g", "year": 2019, "num": 172, "title": "O gráfico a seguir mostra a evolução mensal das…", "src": "ENEM 2019 · Questão 172", "rate": null, "body": "<p>O gráfico a seguir mostra a evolução mensal das vendas de certo produto de julho a novembro de 2011.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-172-4edb5f3b.webp\" width=\"327\" height=\"265\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Sabe-se que o mês de julho foi o pior momento da empresa em 2011 e que o número de unidades vendidas desse produto em dezembro de 2011 foi igual à média aritmética do número de unidades vendidas nos meses de julho a novembro do mesmo ano.</p>\n<p>O gerente de vendas disse, em uma reunião da diretoria, que, se essa redução no número de unidades vendidas de novembro para dezembro de 2011 se mantivesse constante nos meses subsequentes, as vendas só voltariam a ficar piores que julho de 2011 apenas no final de 2012.</p>", "ask": "O diretor financeiro rebateu imediatamente esse argumento mostrando que, mantida a tendência, isso aconteceria já em", "opts": {"A": "Janeiro.", "B": "Fevereiro.", "C": "Março.", "D": "Abril.", "E": "Maio."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g32", "ph": "g", "year": 2019, "num": 177, "title": "Um grupo de engenheiros está projetando um motor…", "src": "ENEM 2019 · Questão 177", "rate": null, "body": "<p>Um grupo de engenheiros está projetando um motor cujo esquema de deslocamento vertical do pistão dentro da câmara de combustão esta representado na figura.</p>\n<p>descreve como varia a altura h, medida em centímetro, da parte superior do pistão dentro da câmara de combustão, em função do tempo t, medido em segundo. Nas figuras estão indicadas as alturas do pistão em dois instantes distintos.</p>\n<p>O valor do parâmetro β, que é dado por um número inteiro positivo, está relacionado com a velocidade de deslocamento do pistão. Para que o motor tenha uma boa potência, é necessário e suficiente que, em menos de 4 segundos após o início do funcionamento (instante t = 0), a altura da base do pistão alcance por três vezes o valor de 6 cm.</p>\n<p>Para os cálculos, utilize 3 como aproximação para π.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-177-000e6ab5.webp\" width=\"344\" height=\"297\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "O menor valor inteiro a ser atribuído ao parâmetro β, de forma que o motor a ser construído tenha boa potência, é", "opts": {"A": "1.", "B": "2.", "C": "4.", "D": "5.", "E": "8."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g33", "ph": "g", "year": 2019, "num": 179, "title": "Nos seis cômodos de uma casa há sensores de…", "src": "ENEM 2019 · Questão 179", "rate": null, "body": "<p>Nos seis cômodos de uma casa há sensores de presença posicionados de forma que a luz de cada cômodo acende assim que uma pessoa nele adentra, e apaga assim que a pessoa se retira desse cômodo. Suponha que o acendimento e o desligamento sejam instantâneos.</p>\n<p>O morador dessa casa visitou alguns desses cômodos, ficando exatamente um minuto em cada um deles. O gráfico descreve o consumo acumulado de energia, em watt x minuto, em função do tempo t, em minuto, das lâmpadas de LED dessa casa, enquanto a figura apresenta a planta baixa da casa, na qual os cômodos estão numerados de 1 a 6, com as potências das respectivas lâmpadas indicadas.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-179-3c23edf9.webp\" width=\"648\" height=\"228\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A sequência de deslocamento pelos cômodos, conforme o consumo de energia apresentado no gráfico, é", "opts": {"A": "1 → 4 → 5 → 4 → 1 → 6 → 1 → 4", "B": "1 → 2 → 3 → 1 → 4 → 1 → 4 → 4", "C": "1 → 4 → 5 → 4 → 1 → 6 → 1 → 2 → 3", "D": "1 → 2 → 3 → 5 → 4 → 1 → 6 → 1 → 4", "E": "1 → 4 → 2 → 3 → 5 → 1 → 6 → 1 → 4"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g34", "ph": "g", "year": 2018, "num": 142, "title": "De acordo com a Lei Universal da Gravitação,…", "src": "ENEM 2018 · Questão 142", "rate": null, "body": "<p>De acordo com a Lei Universal da Gravitação, proposta por Isaac Newton, a intensidade da força gravitacional <i>F</i> que a Terra exerce sobre um satélite em órbita circular é proporcional à massa <i>m</i> do satélite e inversamente proporcional ao quadrado do raio r da órbita, ou seja,</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-142-dc1a457c.webp\" width=\"82\" height=\"44\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>No plano cartesiano, três satélites, A, B e C, estão representados, cada um, por um ponto (m ; r) cujas coordenadas são, respectivamente, a massa do satélite e o raio da sua órbita em torno da Terra.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-142-e0273eee.webp\" width=\"347\" height=\"226\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Com base nas posições relativas dos pontos no gráfico, deseja-se comparar as intensidades <img class=\"enem-inline\" src=\"img/2018-142-d3968814.webp\" width=\"73\" height=\"22\" alt=\"\" loading=\"lazy\"> da força gravitacional que a Terra exerce sobre os satélites A, B e C, respectivamente.</p>", "ask": "As intensidades  expressas no gráfico satisfazem a relação", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-142-993e8313.webp", 83, 23], "B": ["img/2018-142-195a22d0.webp", 77, 19], "C": ["img/2018-142-60ef05e0.webp", 78, 21], "D": ["img/2018-142-afd76d6b.webp", 77, 22], "E": ["img/2018-142-1f581f02.webp", 75, 28]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g35", "ph": "g", "year": 2018, "num": 170, "title": "Em 2014 foi inaugurada a maior roda-gigante do…", "src": "ENEM 2018 · Questão 170", "rate": null, "body": "<p>Em 2014 foi inaugurada a maior roda-gigante do mundo, a <i>High Roller</i>, situada em Las Vegas. A figura representa um esboço dessa roda-gigante, no qual o ponto A representa uma de suas cadeiras:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-170-b84e9f23.webp\" width=\"329\" height=\"249\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A partir da posição indicada, em que o segmento <i>OA</i> se encontra paralelo ao plano do solo, rotaciona-se a <i>High Roller</i> no sentido anti-horário, em torno do ponto <i>O</i>. Sejam <i>t</i> o ângulo determinado pelo segmento <i>OA</i> em relação à sua posição inicial, e <i>f</i> a função que descreve a altura do ponto <i>A</i>, em relação ao solo, em função de <i>t</i>. Após duas voltas completas, <i>f</i> tem o seguinte gráfico:</p>", "ask": "A expressão da função altura é dada por", "opts": {"A": "F(t) = 80sen(t) + 88", "B": "F(t) = 80cos(t) + 8 8", "C": "F(t) = 88cos(t) + 168", "D": "F(t) = 168sen(t) + 88cos(t)", "E": "F(t) = 88sen(t) + 168cos(t)"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g36", "ph": "g", "year": 2018, "num": 173, "title": "Os guindastes são fundamentais em canteiros de…", "src": "ENEM 2018 · Questão 173", "rate": null, "body": "<p>Os guindastes são fundamentais em canteiros de obras, no manejo de materiais pesados como vigas de aço. A figura ilustra uma sequência de estágios em que um  guindaste iça uma viga de aço que se encontra inicialmente no solo.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-173-ace966fb.webp\" width=\"687\" height=\"202\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Na figura, o ponto O representa a projeção ortogonal do cabo de aço sobre o plano do chão e este se mantém na vertical durante todo o movimento de içamento da viga, que se inicia no tempo t = 0 (estágio 1) e finaliza no <img class=\"enem-inline\" src=\"img/2018-173-a57ff676.webp\" width=\"54\" height=\"19\" alt=\"\" loading=\"lazy\"> (estágio 3). Uma das extremidades da viga é içada verticalmente a partir do ponto O, enquanto que a outra extremidade desliza sobre o solo em direção ao ponto O. Considere que o cabo de aço utilizado pelo guindaste para içar a viga fique sempre na posição vertical. Na figura, o ponto M representa o ponto médio do segmento que representa a viga.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-173-a776c7e1.webp\" width=\"57\" height=\"22\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "O gráfico que descreve a distância do ponto M ao ponto O, em função do tempo, entre, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-173-ff2abae2.webp", 247, 157], "B": ["img/2018-173-f1baf187.webp", 251, 166], "C": ["img/2018-173-be3758af.webp", 247, 157], "D": ["img/2018-173-744395ff.webp", 245, 159], "E": ["img/2018-173-a2c79be7.webp", 238, 159]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g37", "ph": "g", "year": 2018, "num": 174, "title": "Com o avanço em ciência da computação, estamos…", "src": "ENEM 2018 · Questão 174", "rate": null, "body": "<p>Com o avanço em ciência da computação, estamos próximos do momento em que o número de transistores no processador de um computador pessoal será da mesma ordem de grandeza que o número de neurônios em um cérebro humano, que é da ordem de 100 bilhões.  <br>Uma das grandezas determinantes para o desempenho de um processador é a densidade de transistores, que é o número de transistores por centímetro quadrado. Em 1986, uma empresa fabricava um processador contendo 100 000 transistores distribuídos em 0,25 cm² de área. Desde então, o número de transistores por centímetro quadrado que se pode colocar em um processador dobra a cada dois anos (Lei de Moore).</p>\n<p class=\"src-note\">Disponível em: www.pocket-lint.com. Acesso em: 1 dez. 2017 (adaptado).</p>", "ask": "Considere 0,30 como aproximação para <br>Em que ano a empresa atingiu ou atingirá a densidade de 100 bilhões de transistores?", "opts": {"A": "1999", "B": "2002", "C": "2022", "D": "2026", "E": "2146"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "h1", "ph": "h", "year": 2023, "num": 145, "title": "Num certo momento de um jogo digital, a tela…", "src": "ENEM 2023 · Questão 145", "rate": null, "body": "<p>Num certo momento de um jogo digital, a tela apresenta a imagem representada na figura. O ponto Q1 representa a posição de um jogador que está com a bola, os pontos Q2, Q3, Q4 , Q5 e Q6  <br>também indicam posições de jogadores da mesma equipe, e os pontos A e B indicam os dois pés da trave mais próxima deles. No momento da partida retratado, o jogador Q1 tem a posse da bola, que será passada para um dos outros jogadores das posições Qn, n ∈ {2, 3, 4, 5, 6}, cujo ângulo AQnB tenha a mesma medida do ângulo AQ1 B.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-145-f338280e.webp\" width=\"423\" height=\"224\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual é o jogador que receberá a bola?", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-145-b794885b.webp", 39, 37], "B": ["img/2023-145-57b5461f.webp", 44, 36], "C": ["img/2023-145-d7e46a12.webp", 41, 41], "D": ["img/2023-145-7a03bf64.webp", 47, 41], "E": ["img/2023-145-5be53460.webp", 51, 41]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "h2", "ph": "h", "year": 2023, "num": 148, "title": "O mastro de uma bandeira foi instalado…", "src": "ENEM 2023 · Questão 148", "rate": null, "body": "<p>O mastro de uma bandeira foi instalado perpendicularmente ao solo em uma região plana. Devido aos fortes ventos, três cabos de aço, de mesmo comprimento, serão instalados para dar sustentação ao mastro. Cada cabo de aço ficará perfeitamente esticado, com uma extremidade num ponto P do mastro, a uma altura h do solo, e a outra extremidade, num ponto no chão, como mostra a figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-148-c6c6b6c4.webp\" width=\"583\" height=\"296\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Os cabos de aço formam um ângulo a com o plano do chão. Por medida de segurança, há apenas três opções de instalação:<br>• opção I: h = 11 m e a = 30°<br>• opção II: h = 12 m e a = 45°<br>• opção III: h = 18 m e a = 60°<br>A opção a ser escolhida é aquela em que a medida dos cabos seja a menor possível.<br>Qual será a medida, em metro, de cada um dos cabos a serem instalados?", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-148-5caf269a.webp", 79, 71], "B": ["img/2023-148-43a6cfb3.webp", 57, 45], "C": ["img/2023-148-16d931ae.webp", 65, 39], "D": ["img/2023-148-5de1f078.webp", 67, 43], "E": ["img/2023-148-a642bb31.webp", 44, 43]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "h3", "ph": "h", "year": 2023, "num": 154, "title": "As figuras pintadas no quadro da sala de estar de…", "src": "ENEM 2023 · Questão 154", "rate": null, "body": "<p>As figuras pintadas no quadro da sala de estar de uma residência representam as silhuetas de parte das torres de um castelo e, ao fundo, a de uma lua cheia. A lua foi pintada na forma de um círculo, e o telhado da torre mais alta, na forma de triângulo equilátero, foi pintado sobrepondo parte da lua. O centro da lua coincide com um dos vértices do telhado da torre mais alta.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-154-d39268bf.webp\" width=\"485\" height=\"451\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nesse quadro, a parte da lua escondida atrás da torre mais alta do castelo pode ser representada por um", "opts": {"A": "Cone.", "B": "Setor circular.", "C": "Segmento circular.", "D": "Triângulo isósceles.", "E": "Arco de circunferência."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h4", "ph": "h", "year": 2023, "num": 155, "title": "Na planta baixa de um clube, a piscina é…", "src": "ENEM 2023 · Questão 155", "rate": null, "body": "<p>Na planta baixa de um clube, a piscina é representada por um quadrado cuja área real mede 400 m². Ao redor dessa piscina, será construída uma calçada, de largura constante igual a 5 m.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-155-05746583.webp\" width=\"738\" height=\"543\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual é a medida da área, em metro quadrado, ocupada pela calçada?", "opts": {"A": "1.000", "B": "900", "C": "600", "D": "500", "E": "400"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h5", "ph": "h", "year": 2023, "num": 165, "title": "A figura representa uma escada com três degraus,…", "src": "ENEM 2023 · Questão 165", "rate": null, "body": "<p>A figura representa uma escada com três degraus, construída em concreto maciço, com suas medidas especificadas.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-165-bf369224.webp\" width=\"846\" height=\"593\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Nessa escada, pisos e espelhos têm formato retangular, e as paredes laterais têm formato de um polígono cujos lados adjacentes são perpendiculares. Pisos, espelhos e paredes laterais serão revestidos em cerâmica.</p>", "ask": "A área a ser revestida em cerâmica, em metro quadrado, mede", "opts": {"A": "1,20.", "B": "1,35.", "C": "1,65.", "D": "1,80.", "E": "1,95."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h6", "ph": "h", "year": 2023, "num": 172, "title": "Sejam a, b e c as medidas dos lados de um triângulo…", "src": "ENEM 2023 · Questão 172", "rate": null, "body": "<p>Sejam <i>a</i>, <i>b</i> e <i>c</i> as medidas dos lados de um triângulo retângulo, tendo a como medida da hipotenusa. Esses valores <i>a</i>, <i>b</i> e <i>c</i> são, respectivamente, os diâmetros dos círculos <i>C1</i> , <i>C2</i> e <i>C3</i>, como apresentados na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-172-dcdd2743.webp\" width=\"339\" height=\"340\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Observe que essa construção assegura, pelo teorema de Pitágoras, que área (C1) = área (C2) + área (C3).</p>\n<p>Um professor de matemática era conhecedor dessa construção e, confraternizando com dois amigos em uma pizzaria onde são vendidas pizzas somente em formato de círculo, lançou um desafio: mesmo sem usar um instrumento de medição, poderia afirmar com certeza se a área do círculo correspondente à pizza que ele pedisse era maior, igual ou menor do que a soma das áreas das pizzas dos dois amigos. Assim, foram pedidas três pizzas. O professor as dividiu ao meio e formou um triângulo com os diâmetros das pizzas, conforme indicado na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-172-8bd02f79.webp\" width=\"383\" height=\"222\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A partir da medida do ângulo a, o professor afirmou que a área de sua pizza é maior do que a soma das áreas das outras duas pizzas.</p>", "ask": "A área da pizza do professor de matemática é maior do que a soma das áreas das outras duas pizzas, pois", "opts": {"A": "0° &lt; a &lt; 90°", "B": "A = 90°", "C": "90° &lt; a &lt; 180°", "D": "A = 180°", "E": "180° &lt; a &lt; 360°"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h7", "ph": "h", "year": 2022, "num": 156, "title": "O professor de artes orientou seus estudantes a…", "src": "ENEM 2022 · Questão 156", "rate": null, "body": "<p>O professor de artes orientou seus estudantes a realizarem a seguinte sequência de atividades:  <br>• Dobrar uma folha de papel em formato quadrado duas vezes, em sequência, ao longo das linhas tracejadas, conforme ilustrado nas figuras 1 e 2, para obter o papel dobrado, conforme Figura 3.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-156-2b1f4d30.webp\" width=\"677\" height=\"186\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>• Em seguida, no papel dobrado da Figura 3, considerar o ponto <i>R</i>, sobre o segmento <i>OM</i>, sendo  o ponto médio do lado do quadrado original, de modo que <img class=\"enem-inline\" src=\"img/2022-156-2a89a0e4.webp\" width=\"93\" height=\"44\" alt=\"\" loading=\"lazy\">, traçar um arco de circunferência de raio medindo <img class=\"enem-inline\" src=\"img/2022-156-1665e780.webp\" width=\"45\" height=\"38\" alt=\"\" loading=\"lazy\"> com centro no ponto <i>R</i>, obtendo a Figura 4. Por último, recortar o papel ao longo do arco de circunferência e excluir a parte que contém o setor circular, obtendo o papel dobrado, conforme Figura 5.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-156-bf9a172b.webp\" width=\"391\" height=\"185\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Após desdobrado o papel que restou na Figura 5, a figura plana que os estudantes obterão será", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-156-538392d5.webp", 168, 169], "B": ["img/2022-156-78436952.webp", 167, 170], "C": ["img/2022-156-ddf97279.webp", 164, 166], "D": ["img/2022-156-b09ad37a.webp", 167, 167], "E": ["img/2022-156-c3221442.webp", 168, 169]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "h8", "ph": "h", "year": 2022, "num": 168, "title": "Uma pessoa precisa se deslocar de automóvel do…", "src": "ENEM 2022 · Questão 168", "rate": null, "body": "<p>Uma pessoa precisa se deslocar de automóvel do ponto P para o ponto Q, indicados na figura, na qual as linhas verticais e horizontais simbolizam ruas</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-168-5c7c6e9a.webp\" width=\"261\" height=\"260\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Por causa do sentido de tráfego nessas ruas, o caminho poligonal destacado é a possibilidade mais curta de efetuar esse deslocamento. Para descrevê-lo, deve-se especificar qual o sentido a ser tomado em cada cruzamento de ruas, em relação à direção de deslocamento do automóvel, que se movimentará continuamente. Para isso, empregam-se as letras E, F e D para indicar  <br>“vire à esquerda”, “siga em frente” e “vire à direita”, respectivamente.</p>", "ask": "A sequência de letras que descreve o caminho poligonal destacado é", "opts": {"A": "DDEFDDEEFFD.", "B": "DFEFDDDEFFD.", "C": "DFEFDDEEFFD.", "D": "EFDFEEDDFFE.", "E": "EFDFEEEDFFE."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h9", "ph": "h", "year": 2022, "num": 176, "title": "Questão 176", "src": "ENEM 2022 · Questão 176", "rate": null, "body": "<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-176-eebeabf5.webp\" width=\"454\" height=\"244\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Pretende-se que a distância percorrida entre as duas cidades, pelas Rodovias 001 e 002, passando pelo ponto de conexão, seja a menor possível.<br>Dadas as exigências do projeto, qual das localizações sugeridas deve ser a escolhida para o ponto de conexão?", "opts": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h10", "ph": "h", "year": 2021, "num": 169, "title": "O instrumento da percussão conhecido como triângulo…", "src": "ENEM 2021 · Questão 169", "rate": null, "body": "<p>O instrumento da percussão conhecido como triângulo é composto por uma barra fina de aço, dobrada em um formato que se assemelha a um triângulo, com uma abertura e uma haste, conforme ilustra a Figura 1.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-169-d9c2223e.webp\" width=\"520\" height=\"250\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Uma empresa de brindes promocionais contrata uma fundição para a produção de miniaturas de instrumentos desse tipo. A fundição produz, inicialmente, peças com o formato de uma triângulo equilátero de altura h, conforme ilustra a Figura 2. Após esse processo, cada peça é aquecida, deformando os cantos, e cortada em um dos vértices, dando origem à miniatura. Assuma que não ocorram perdas de material no processo de produção, de forma que o comprimento da barra utilizada seja igual ao perímetro do triângulo equilátero representado na Figura 2.</p>\n<p>Considere 1,7 como valor aproximado para √3.</p>\n<p>Nessas condições, o valor que mais se aproxima da medida do comprimento da barra, em centímetro, é</p>", "ask": "Nessas condições, o valor que mais se aproxima da medida do comprimento da barra, em centímetro, é:", "opts": {"A": "9,07.", "B": "13,60.", "C": "20,40.", "D": "27,18.", "E": "36,24."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h11", "ph": "h", "year": 2021, "num": 171, "title": "O dono de uma loja pretende usar cartões imantados…", "src": "ENEM 2021 · Questão 171", "rate": null, "body": "<p>O dono de uma loja pretende usar cartões imantados para a sua divulgação de sua loja. A empresa que fornecerá o serviço lhe informa que o custo de fabricação do cartão é de R$0,01 por centímetro quadrado e que disponibiliza modelos tendo como faces úteis para impressão:</p>\n<p>*   um triângulo equilátero de lado 12 cm;<br>*   um quadrado de lado 8 cm;<br>*   um retângulo de lados 11 cm e 8 cm;<br>*   um hexágono regular de lado 6cm;<br>*   um círculo de diâmetro 10 cm.</p>\n<p>O dono da loja está disposto a pagar, no máximo, R$0,80 por cartão. Ele escolherá, dentro desse limite de preço, o modelo que tiver maior área de impressão.</p>\n<p>Use 3 como aproximação para π e use 1,7 como aproximação para √3.</p>", "ask": "Nessas condições, o modelo que deverá ser escolhido tem como face útil para impressão um", "opts": {"A": "Triângulo", "B": "Quadrado", "C": "Retângulo", "D": "Hexágono", "E": "Círculo"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h12", "ph": "h", "year": 2020, "num": 136, "title": "A fabricação da Bandeira Nacional deve obedecer ao…", "src": "ENEM 2020 · Questão 136", "rate": null, "body": "<p>A fabricação da Bandeira Nacional deve obedecer ao descrito na Lei n. 5.700, de 1º de setembro de 1971, que trata dos Símbolos Nacionais. No artigo que se refere às dimensões da Bandeira, observa-se:</p>\n<p>“Para cálculos das dimensões, será tomada por base a largura, dividindo-a em 14 (quatorze) partes iguais, sendo que cada uma das partes será considerada uma medida ou um módulo (M). Os demais requisitos dimensionais seguem o critério abaixo:</p>\n<p>1.  Comprimento será de vinte módulos (20 M);<br>2.  A distância dos vértices do losango amarelo ao quadro externo será de um módulo e sete décimos (1,7 M);<br>3.  O raio do círculo azul no meio do losango amarelo será de três módulos e meio (3,5 M).”</p>\n<p>BRASIL, Lei n. 5.700, de 1° de setembro de 1971. Disponível em: www.planalto.gov.br. Acesso em: 15 set. 2015.</p>\n<p>A figura indica as cores da bandeira do Brasil e localiza o quadro externo a que se refere a Lei n. 5.700.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-136-d4125f5f.webp\" width=\"401\" height=\"270\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Um torcedor, preparando-se para a Copa do Mundo e dispondo de cortes de tecidos verde (180 cm x 150 cm) e  <br>amarelo (o quanto baste), deseja confeccionar a maior Bandeira Nacional possível a partir das medidas do tecido verde.</p>", "ask": "Qual a medida, em centímetro, do lado do menor quadrado de tecido azul que deverá ser comprado para confecção do círculo da bandeira desejada?", "opts": {"A": "27", "B": "32", "C": "53", "D": "63", "E": "90"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h13", "ph": "h", "year": 2020, "num": 140, "title": "O proprietário de um apartamento decidiu instalar…", "src": "ENEM 2020 · Questão 140", "rate": null, "body": "<p>O proprietário de um apartamento decidiu instalar porcelanato no piso da sala. Essa sala tem formato retangular com 3,2 m de largura e 3,6 m de comprimento. As peças do porcelanato têm formato de um quadrado com lado medindo 80 cm. Esse porcelanato é vendido em dois tipos de caixas, com os preços indicados a seguir.</p>\n<p>*   Caixas do tipo A: 4 unidades de piso, R$ 35,00;<br>*   Caixas do tipo B: 3 unidades de piso, R$ 27,00.</p>\n<p>Na instalação do porcelanato, as peças podem ser recortadas e devem ser assentadas sem espaçamento entre elas, aproveitando-se ao máximo os recortes feitos.</p>", "ask": "A compra que atende às necessidades do proprietário, proporciona a menor sobra de pisos e resulta no menor preço é", "opts": {"A": "5 caixas do tipo A.", "B": "1 caixa do tipo A e 4 caixas do tipo B.", "C": "3 caixas do tipo A e 1 caixa do tipo B.", "D": "5 caixas do tipo A e 1 caixa do tipo B.", "E": "6 caixas do tipo B."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h14", "ph": "h", "year": 2020, "num": 162, "title": "A lei municipal para a edificação de casas em lotes…", "src": "ENEM 2020 · Questão 162", "rate": null, "body": "<p>A lei municipal para a edificação de casas em lotes de uma cidade determina que sejam obedecidos os seguintes critérios:</p>\n<p>*   afastamento mínimo de 4 m da rua;<br>*   afastamento mínimo de 1 m da divisa com outro lote;<br>*   área total construída da casa entre 40% e 50% da área total do lote.</p>\n<p>Um construtor submeteu para aprovação na prefeitura dessa cidade uma planta com propostas para a construção de casas em seus 5 lotes. Cada lote tem área medindo 200 m2.</p>\n<p>A imagem apresenta um esquema, sem escala, no qual estão representados os lotes, as ruas e os afastamentos considerados nos projetos entre as casas e as divisas dos lotes. As medidas indicadas no esquema estão expressas em metro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-162-cd18aaa1.webp\" width=\"497\" height=\"447\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A prefeitura aprovará apenas a planta da casa", "opts": {"A": "1.", "B": "2.", "C": "3.", "D": "4.", "E": "5."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h15", "ph": "h", "year": 2020, "num": 171, "title": "Azulejo designa peça de cerâmica vitrificada e/ou…", "src": "ENEM 2020 · Questão 171", "rate": null, "body": "<p>Azulejo designa peça de cerâmica vitrificada e/ou esmaltada usada, sobretudo, no revestimento de paredes. A origem das técnicas de fabricação de azulejos é oriental, mas sua expansão pela Europa traz consigo uma diversificação de estilos, padrões e usos, que podem ser decorativos, utilitários e arquitetônicos.</p>\n<p class=\"src-note\">Disponível em: www.itaucultural.org.br. Acesso em: 31 jul. 2012.</p>\n<p>Azulejos no formato de octógonos regulares serão utilizados para cobrir um painel retangular conforme ilustrado na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-171-ef4071b9.webp\" width=\"311\" height=\"147\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Entre os octógonos e na borda lateral dessa área, será necessária a colocação de 15 azulejos de outros formatos para preencher os 15 espaços em branco do painel. Uma loja oferece azulejos nos seguintes formatos:</p>\n<p>1 — Triângulo retângulo isósceles;</p>\n<p>2 — Triângulo equilátero;</p>\n<p>3 — Quadrado.</p>", "ask": "Os azulejos necessários para o devido preenchimento das áreas em branco desse painel são os de formato", "opts": {"A": "1.", "B": "3.", "C": "1 e 2.", "D": "1 e 3.", "E": "2 e 3."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h16", "ph": "h", "year": 2020, "num": 177, "title": "A Figura 1 apresenta uma casa e a planta do seu…", "src": "ENEM 2020 · Questão 177", "rate": null, "body": "<p>A Figura 1 apresenta uma casa e a planta do seu telhado, em que as setas indicam o sentido do escoamento da água de chuva. Um pedreiro precisa fazer a planta do escoamento da água de chuva de um telhado que tem três caídas de água, como apresentado na Figura 2.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-177-08467fa4.webp\" width=\"255\" height=\"76\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A figura que representa a planta do telhado da Figura 2 com o escoamento da água de chuva que o pedreiro precisa fazer é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-177-2a3a5b2b.webp", 90, 73], "B": ["img/2020-177-2936adf7.webp", 93, 69], "C": ["img/2020-177-e7ee9d94.webp", 94, 67], "D": ["img/2020-177-c14a7589.webp", 94, 71], "E": ["img/2020-177-9d34c268.webp", 90, 63]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "h17", "ph": "h", "year": 2019, "num": 142, "title": "Em um condomínio, uma área pavimentada, que tem a…", "src": "ENEM 2019 · Questão 142", "rate": null, "body": "<p>Em um condomínio, uma área pavimentada, que tem a forma de um círculo com diâmetro medindo 6m, é cercado por grama. A administração do condomínio deseja ampliar essa área, mantendo seu formato circular, e aumentando, em 8m, o diâmetro dessa região, mantendo o revestimento da parte já existente. O condomínio dispõe, em estoque, de material suficiente para pavimentar mais 100 m² de área.</p>\n<p>O síndico do condomínio irá avaliar se esse material disponível será suficiente para pavimentar a região a ser ampliada.</p>\n<p>Utilize 3 como aproximação para π.</p>", "ask": "A conclusão correta a que o síndico deverá chegar, considerando a nova área a ser pavimentada, é a de que o material disponível em estoque:", "opts": {"A": "Será suficiente, pois a área da nova região a ser pavimentada mede 21 m².", "B": "Será suficiente, pois a área da nova região a ser pavimentada mede 24 m².", "C": "Será suficiente, pois a área da nova região a ser pavimentada mede 48 m².", "D": "Não será suficiente, pois a área da nova região a ser pavimentada mede 108 m².", "E": "Não será suficiente, pois a área da nova região a ser pavimentada mede 120 m²."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h18", "ph": "h", "year": 2019, "num": 166, "title": "Construir figuras de diversos tipos, apenas…", "src": "ENEM 2019 · Questão 166", "rate": null, "body": "<p>Construir figuras de diversos tipos, apenas dobrando e cortando papel, sem cola e sem tesoura, é a arte do <i>origami</i> (<i>ori</i> = dobrar; <i>kami</i> = papel), que tem um significado altamente simbólico no Japão.</p>\n<p>A base do <i>origami</i> é o conhecimento do mundo por base do tato. Uma jovem resolveu construir um cisne usando técnica do <i>origami</i>, utilizando uma folha de papel de 18 cm por 12 cm.</p>\n<p>Assim, começou por dobrar a folha conforme a figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-166-3133b67a.webp\" width=\"290\" height=\"152\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Após essa primeira dobradura, a medida do segmento AE é", "opts": {"A": "2√22 cm", "B": "6√3 cm", "C": "12cm.", "D": "6√5 cm", "E": "12√2 cm"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h19", "ph": "h", "year": 2018, "num": 138, "title": "Um jogo pedagógico utiliza-se de uma interface…", "src": "ENEM 2018 · Questão 138", "rate": null, "body": "<p>Um jogo pedagógico utiliza-se de uma interface algébrico-geométrica do seguinte modo: os alunos devem eliminar os pontos do plano cartesiano dando “tiros”, seguindo trajetórias que devem passar pelos pontos escolhidos. Para dar os tiros, o aluno deve escrever em uma janela do programa a equação cartesiana de uma reta ou de uma circunferência que passa pelos pontos e pela origem do sistema de coordenadas. Se o tiro for dado por meio da equação da circunferência, cada ponto diferente da origem que for atingido vale 2 pontos. Se o tiro for dado por meio da equação de uma reta, cada ponto diferente da origem que for atingido vale 1 ponto. Em uma situação de jogo, ainda restam os  seguintes pontos para serem eliminados: A(0 ; 4), 6(4 ; 4), C(4 ; 0), D(2 ; 2) e E(0; 2).</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-138-da8a254c.webp\" width=\"332\" height=\"280\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Passando pelo ponto A, qual equação forneceria a maior pontuação?", "opts": {"A": "X = 0", "B": "Y = 0", "C": "X² + y² =16", "D": "X² + (y-2)² = 4", "E": "(x -2 )² + ( y - 2 )² = 8"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h20", "ph": "h", "year": 2018, "num": 139, "title": "Sobre um sistema cartesiano considera-se uma malha…", "src": "ENEM 2018 · Questão 139", "rate": null, "body": "<p>Sobre um sistema cartesiano considera-se uma malha formada por circunferências de raios com medidas dadas por números naturais e por 12 semirretas com extremidades na origem, separadas por ângulos de <img class=\"enem-inline\" src=\"img/2018-139-d84b3e68.webp\" width=\"33\" height=\"30\" alt=\"\" loading=\"lazy\"> conforme a figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-139-156b89f8.webp\" width=\"348\" height=\"350\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Suponha que os objetos se desloquem apenas pelas semirretas e pelas circunferências dessa malha, não podendo passar pela origem (0;0).  <br>Considere o valor de <i>π</i> com aproximação de, pelo menos, uma casa decimal.</p>", "ask": "Para realizar o percurso mais curto possível ao longo da malha, do ponto B até o ponto A, um objeto deve percorrer uma distância igual a:", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-139-1d1d2cb9.webp", 73, 41], "B": ["img/2018-139-3d56d354.webp", 71, 37], "C": ["img/2018-139-6adf9c16.webp", 71, 37], "D": ["img/2018-139-8161d961.webp", 73, 41], "E": ["img/2018-139-aa89cb88.webp", 71, 42]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "h21", "ph": "h", "year": 2018, "num": 146, "title": "Numa atividade de treinamento realizada no Exército…", "src": "ENEM 2018 · Questão 146", "rate": null, "body": "<p>Numa atividade de treinamento realizada no Exército de um determinado país, três equipes – Alpha, Beta e Gama – foram designadas a percorrer diferentes caminhos, todos com os mesmos pontos de partida e de chegada.  <br>• A equipe Alpha realizou seu percurso em 90 minutos com uma velocidade média de 6,0 km/h.  <br>• A equipe Beta também percorreu sua trajetória em 90 minutos, mas sua velocidade média foi de 5,0 km/h.  <br>• Com uma velocidade média de 6,5 km/h, a equipe Gama concluiu seu caminho em 60 minutos.  <br>Com base nesses dados, foram comparadas as distâncias <img class=\"enem-inline\" src=\"img/2018-146-fb3e90c2.webp\" width=\"99\" height=\"24\" alt=\"\" loading=\"lazy\"> percorridas pelas três equipes.</p>", "ask": "A ordem das distâncias percorridas pelas equipes Alpha, Beta e Gama é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-146-1fb8607c.webp", 131, 30], "B": ["img/2018-146-9652da77.webp", 124, 27], "C": ["img/2018-146-94830fa5.webp", 127, 26], "D": ["img/2018-146-03f32730.webp", 124, 26], "E": ["img/2018-146-f9dece31.webp", 130, 28]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "h22", "ph": "h", "year": 2018, "num": 152, "title": "Para criar um logotipo, um profissional da área de…", "src": "ENEM 2018 · Questão 152", "rate": null, "body": "<p>Para criar um logotipo, um profissional da área de <i>design</i> gráfico deseja construí-lo utilizando o conjunto de pontos do plano na forma de um triângulo,  exatamente como mostra a imagem.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-152-30a16007.webp\" width=\"323\" height=\"325\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Para construir tal imagem utilizando uma ferramenta gráfica, será necessário escrever algebricamente o conjunto que representa os pontos desse gráfico.</p>", "ask": "Esse conjunto é dado pelos pares ordenados tais que", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-152-ba7275fc.webp", 99, 25], "B": ["img/2018-152-fea69a4e.webp", 88, 21], "C": ["img/2018-152-a3a18021.webp", 131, 20], "D": ["img/2018-152-37ae63c0.webp", 84, 19], "E": ["img/2018-152-e9743309.webp", 88, 25]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "h23", "ph": "h", "year": 2018, "num": 153, "title": "A figura mostra uma praça circular que contém um…", "src": "ENEM 2018 · Questão 153", "rate": null, "body": "<p>A figura mostra uma praça circular que contém um chafariz em seu centro e, em seu entorno, um passeio. Os círculos que definem a praça e o chafariz são concêntricos.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-153-222ea15d.webp\" width=\"273\" height=\"256\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O passeio terá seu piso revestido com ladrilhos. Sem condições de calcular os raios, pois o chafariz está cheio, um engenheiro fez a seguinte medição: esticou uma trena tangente ao chafariz, medindo a distância entre dois pontos <i>A</i> e <i>B</i>, conforme a figura. Com isso, obteve a medida do segmento de reta <i>AB</i>: 16 m.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-153-1d6e5ac1.webp\" width=\"274\" height=\"248\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Dispondo apenas dessa medida, o engenheiro calculou corretamente a medida da área do passeio, em metro quadrado.</p>", "ask": "A medida encontrada pelo engenheiro foi", "opts": {"A": "4π.", "B": "8π.", "C": "48π.", "D": "64π.", "E": "192π."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h24", "ph": "h", "year": 2018, "num": 155, "title": "O remo de assento deslizante é um esporte que faz…", "src": "ENEM 2018 · Questão 155", "rate": null, "body": "<p>O remo de assento deslizante é um esporte que faz uso de um barco e dois remos do mesmo tamanho. A figura mostra uma das posições de uma técnica chamada afastamento.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-155-f37e4605.webp\" width=\"322\" height=\"208\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Nessa posição, os dois remos se encontram no ponto A e suas outras extremidades estão indicadas pelos pontos B e C. Esses três pontos formam um triângulo ABC cujo ângulo <img class=\"enem-inline\" src=\"img/2018-155-8504e1af.webp\" width=\"29\" height=\"17\" alt=\"\" loading=\"lazy\">  tem medida de 170°.</p>", "ask": "O  tipo de triângulo com vértices nos pontos A, B e C, no momento em que o remador está nessa posição, é", "opts": {"A": "Retângulo escaleno.", "B": "Acutângulo escaleno.", "C": "Acutângulo isósceles.", "D": "Obtusângulo escaleno.", "E": "Obtusângulo isósceles."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h25", "ph": "h", "year": 2018, "num": 161, "title": "Para apagar os focos A e B de um incêndio, que…", "src": "ENEM 2018 · Questão 161", "rate": null, "body": "<p>Para apagar os focos A e B de um incêndio, que estavam a uma distância de 30m um do outro, os bombeiros de um quartel decidiram se posicionar de modo que a distância de um bombeiro ao foco A, de temperatura mais elevada, fosse sempre o dobro da distância desse bombeiro ao foco B, de temperatura menos elevada.</p>", "ask": "Nestas condições, a maior distância, em metro, que dois bombeiros poderiam ter entre eles é", "opts": {"A": "30.", "B": "40.", "C": "45.", "D": "60.", "E": "68."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h26", "ph": "h", "year": 2018, "num": 171, "title": "A rosa dos ventos é uma figura que representa oito…", "src": "ENEM 2018 · Questão 171", "rate": null, "body": "<p>A rosa dos ventos é uma figura que representa oito sentidos, que dividem o círculo em partes iguais.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-171-17c9e8b1.webp\" width=\"248\" height=\"226\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Uma câmera de vigilância está fixada no teto de um shopping e sua lente pode ser direcionada remotamente, através de um controlador, para qualquer sentido. A lente da câmera está apontada inicialmente no sentido Oeste e o seu controlador efetua três mudanças consecutivas, a saber:  <br>• 1ª mudança: 135° no sentido anti-horário;  <br>• 2ª mudança: 60° no sentido horário;  <br>• 3ª mudança: 45° no sentido anti-horário.  <br>Após a 3ª mudança, ele é orientado a reposicionar a câmera, com a menor amplitude possível, no sentido Noroeste (<i>NO</i>) devido a um movimento suspeito de um cliente.</p>", "ask": "Qual mudança de sentido o controlador deve efetuar para reposicionar a câmera?", "opts": {"A": "75° no sentido horário.", "B": "105° no sentido anti-horário.", "C": "120° no sentido anti-horário.", "D": "135° no sentido anti-horário.", "E": "165° no sentido horário."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.h }),
  Object.assign({"id": "h27", "ph": "h", "year": 2018, "num": 179, "title": "Um quebra-cabeça consiste em recobrir um quadrado…", "src": "ENEM 2018 · Questão 179", "rate": null, "body": "<p>Um quebra-cabeça consiste em recobrir um quadrado com triângulos retângulos isósceles, como ilustra a figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-179-f90ac045.webp\" width=\"171\" height=\"172\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Uma artesã confecciona um quebra-cabeça como o descrito, de tal modo que a menor das peças é um triângulo retângulo isósceles cujos catetos medem 2 cm.</p>\n<p><img class=\"enem-inline\" src=\"img/2018-179-3fc75c6b.webp\" width=\"39\" height=\"18\" alt=\"\" loading=\"lazy\"> <img class=\"enem-inline\" src=\"img/2018-179-5eabdb02.webp\" width=\"56\" height=\"27\" alt=\"\" loading=\"lazy\"> <img class=\"enem-inline\" src=\"img/2018-179-6cbaacc0.webp\" width=\"63\" height=\"26\" alt=\"\" loading=\"lazy\"></p>", "ask": "O quebra-cabeça, quando montado, resultará em um quadrado cuja medida do lado, em centímetro, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-179-cffd9e29.webp", 24, 22], "B": ["img/2018-179-80266f09.webp", 23, 22], "C": ["img/2018-179-8d325c60.webp", 39, 18], "D": ["img/2018-179-2e70100e.webp", 56, 27], "E": ["img/2018-179-4903bfee.webp", 63, 26]}}, { hint: PH_HINT.h }),
  Object.assign({"id": "i1", "ph": "i", "year": 2023, "num": 136, "title": "Um artista plástico esculpe uma escultura a partir…", "src": "ENEM 2023 · Questão 136", "rate": null, "body": "<p>Um artista plástico esculpe uma escultura a partir de um bloco de madeira de lei, em etapas. Inicialmente, esculpe um cone reto com 36 cm de altura e diâmetro da base medindo 18 cm. Em seguida, remove desse cone um cone menor, cujo diâmetro da base mede 6 cm, obtendo, assim, um tronco de cone, conforme ilustrado na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-136-565c2d5a.webp\" width=\"620\" height=\"485\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Em seguida, perfura esse tronco de cone, removendo um cilindro reto, de diâmetro 6 cm, cujo eixo de simetria é o mesmo do cone original. Dessa forma, ao final, a escultura tem a forma de um tronco de cone com uma perfuração cilíndrica de base a base.  <br>O tipo de madeira utilizada para produzir essa escultura tem massa igual a 0,6 g por centímetro cúbico de volume. Utilize 3 como aproximação para π.</p>", "ask": "Qual é a massa, em grama, dessa escultura?", "opts": {"A": "1.198,8", "B": "1.296,0", "C": "1.360,8", "D": "4.665,6", "E": "4.860,0"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i2", "ph": "i", "year": 2023, "num": 144, "title": "A foto mostra a construção de uma cisterna…", "src": "ENEM 2023 · Questão 144", "rate": null, "body": "<p>A foto mostra a construção de uma cisterna destinada ao armazenamento de água. Uma cisterna como essa, na forma de cilindro circular reto com 3 m² de área da base, foi abastecida por um curso-d’água com vazão constante. O seu proprietário registrou a altura do nível da água no interior da cisterna durante o abastecimento em diferentes momentos de um mesmo dia, conforme o quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-144-c606403f.webp\" width=\"332\" height=\"157\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-144-2107cabc.webp\" width=\"423\" height=\"290\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p class=\"src-note\">Disponível em: www.paraibamix.com. Acesso em: 3 dez. 2012.</p>", "ask": "Qual foi a vazão, em metro cúbico por hora, do curso-d’água que abasteceu a cisterna?", "opts": {"A": "0,3", "B": "0,5", "C": "0,9", "D": "1,8", "E": "2,7"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i3", "ph": "i", "year": 2022, "num": 143, "title": "Dentre as diversas planificações possíveis para o…", "src": "ENEM 2022 · Questão 143", "rate": null, "body": "<p>Dentre as diversas planificações possíveis para o cubo, uma delas é a que se encontra apresentada na Figura 1.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-143-4da64c40.webp\" width=\"379\" height=\"318\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Em um cubo, foram pintados, em três de suas faces, quadrados de cor cinza escura, que ocupam um quarto dessas faces, tendo esses três quadrados um vértice em comum, conforme ilustrado na Figura 2.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-143-a05cd294.webp\" width=\"376\" height=\"360\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A planificação do cubo da Figura 2, conforme o tipo de planificação apresentada na Figura 1, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-143-37b0d8a0.webp", 266, 163], "B": ["img/2022-143-c2a2bae5.webp", 237, 165], "C": ["img/2022-143-bfd0a9ed.webp", 243, 164], "D": ["img/2022-143-b76f04c7.webp", 231, 166], "E": ["img/2022-143-2e478466.webp", 229, 160]}}, { hint: PH_HINT.i }),
  Object.assign({"id": "i4", "ph": "i", "year": 2022, "num": 153, "title": "Uma empresa produz e vende um tipo de chocolate,…", "src": "ENEM 2022 · Questão 153", "rate": null, "body": "<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-153-f85bbaf3.webp\" width=\"391\" height=\"360\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Uma empresa produz e vende um tipo de chocolate, maciço, em formato de cone circular reto com as medidas do diâmetro da base e da altura iguais a 8 cm e 10 cm, respectivamente, como apresenta a figura.</p>\n<p>Devido a um aumento de preço dos ingredientes utilizados na produção desse chocolate, a empresa  <br>decide produzir esse mesmo tipo de chocolate com um volume 19% menor, no mesmo formato de cone circular reto com altura de 10 cm.</p>", "ask": "Para isso, a empresa produzirá esses novos chocolates com medida do raio da base, em centímetro, igual a", "opts": {"A": "1,52.", "B": "3,24.", "C": "3,60.", "D": "6,48.", "E": "7,20."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i5", "ph": "i", "year": 2022, "num": 160, "title": "Um robô, que tem um ímã em sua base, se desloca…", "src": "ENEM 2022 · Questão 160", "rate": null, "body": "<p>Um robô, que tem um ímã em sua base, se desloca sobre a superfície externa de um cubo metálico, ao longo de segmentos de reta cujas extremidades são pontos médios de arestas e centros de faces. Ele inicia seu deslocamento no ponto <b>P</b>, centro da face superior do cubo, segue para o centro da próxima face, converte à esquerda e segue para o centro da face seguinte, converte à direita e continua sua movimentação, sempre alternando entre conversões à esquerda e à direita quando alcança o centro de uma face. O robô só termina sua movimentação quando retorna ao ponto <b>P</b>. A figura apresenta os deslocamentos iniciais desse robô.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-160-c9e8168c.webp\" width=\"255\" height=\"215\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A projeção ortogonal do trajeto descrito por esse robô sobre o plano da base, após terminada sua movimentação, visualizada da posição em que se está enxergando esse cubo, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-160-5d7821fa.webp", 208, 80], "B": ["img/2022-160-6a4daa1c.webp", 210, 84], "C": ["img/2022-160-41ab922d.webp", 210, 69], "D": ["img/2022-160-79a7fd8e.webp", 223, 68], "E": ["img/2022-160-2dacf59f.webp", 219, 71]}}, { hint: PH_HINT.i }),
  Object.assign({"id": "i6", "ph": "i", "year": 2022, "num": 169, "title": "Uma loja comercializa cinco modelos de…", "src": "ENEM 2022 · Questão 169", "rate": null, "body": "<p>Uma loja comercializa cinco modelos de caixas-d’água (I, II, III, IV e V), todos em formato de cilindro reto de base circular. Os modelos II, III, IV e V têm as especificações de suas dimensões dadas em relação às dimensões do modelo I, cuja profundidade é P e área da base é Ab, como segue:</p>\n<p>• modelo II: o dobro da profundidade e a metade da  <br>área da base do modelo I;  <br>• modelo III: o dobro da profundidade e a metade do  <br>raio da base do modelo I;  <br>• modelo IV: a metade da profundidade e o dobro da  <br>área da base do modelo I;  <br>• modelo V: a metade da profundidade e o dobro do  <br>raio da base do modelo I.</p>\n<p>Uma pessoa pretende comprar nessa loja o modelo  <br>de caixa-d’água que ofereça a maior capacidade  <br>volumétrica</p>", "ask": "O modelo escolhido deve ser o", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i7", "ph": "i", "year": 2022, "num": 172, "title": "Um casal planeja construir em sua chácara uma…", "src": "ENEM 2022 · Questão 172", "rate": null, "body": "<p>Um casal planeja construir em sua chácara uma piscina com o formato de um paralelepípedo reto retângulo com capacidade para 90 000 L de água. O casal contratou uma empresa de construções que apresentou cinco projetos com diferentes combinações nas dimensões internas de profundidade, largura e comprimento. A piscina a ser construída terá revestimento interno em suas paredes e fundo com uma mesma cerâmica, e o casal irá escolher o projeto que exija a menor área de revestimento.</p>\n<p>As dimensões internas de profundidade, largura e comprimento, respectivamente, para cada um dos projetos, são:</p>\n<p>• projeto I: 1,8 m, 2,0 m e 25,0 m;  <br>• projeto II: 2,0 m, 5,0 m e 9,0 m;  <br>• projeto III: 1,0 m, 6,0 m e 15,0 m;  <br>• projeto IV: 1,5 m, 15,0 m e 4,0 m;  <br>• projeto V: 2,5 m, 3,0 m e 12,0 m.</p>", "ask": "O projeto que o casal deverá escolher será o", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
