  Object.assign({"id": "i8", "ph": "i", "year": 2022, "num": 174, "title": "Peças metálicas de aeronaves abandonadas em…", "src": "ENEM 2022 · Questão 174", "rate": null, "body": "<p>Peças metálicas de aeronaves abandonadas em aeroportos serão recicladas. Uma dessas peças é maciça e tem o formato cilíndrico, com a medida do raio da base igual a 4 cm e a da altura igual a 50 cm. Ela será derretida, e o volume de metal resultante será utilizado para a fabricação de esferas maciças com diâmetro de 1 cm, a serem usadas para confeccionar rolamentos. Para estimar a quantidade de esferas que poderão ser produzidas a partir de cada uma das peças cilíndricas, admite-se que não ocorre perda de material durante o processo de derretimento.</p>", "ask": "Quantas dessas esferas poderão ser obtidas a partir de cada peça cilíndrica?", "opts": {"A": "800", "B": "1200", "C": "2400", "D": "4800", "E": "6400"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i9", "ph": "i", "year": 2022, "num": 178, "title": "Uma cozinheira produz docinhos especiais por…", "src": "ENEM 2022 · Questão 178", "rate": null, "body": "<p>Uma cozinheira produz docinhos especiais por encomenda. Usando uma receita-base de massa, ela prepara uma porção, com a qual produz 50 docinhos maciços de formato esférico, com 2 cm de diâmetro. Um cliente encomenda 150 desses docinhos, mas pede que cada um tenha formato esférico com 4 cm de diâmetro.  <br>A cozinheira pretende preparar o número exato de porções da receita-base de massa necessário para produzir os docinhos dessa encomenda</p>", "ask": "Quantas porções da receita-base de massa ela deve preparar para atender esse cliente?", "opts": {"A": "2", "B": "3", "C": "6", "D": "12", "E": "24"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i10", "ph": "i", "year": 2022, "num": 180, "title": "Na figura estão destacadas duas trajetórias sobre a…", "src": "ENEM 2022 · Questão 180", "rate": null, "body": "<p>Na figura estão destacadas duas trajetórias sobre a superfície do globo terrestre, descritas ao se percorrer parte dos meridianos 1, 2 e da Linha do Equador, sendo que os meridianos 1 e 2 estão contidos em planos perpendiculares entre si. O plano α é paralelo ao que contém a Linha do Equador.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-180-f3e0feaa.webp\" width=\"417\" height=\"309\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A vista superior da projeção ortogonal sobre o plano α dessas duas trajetórias é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-180-05cb2bb8.webp", 114, 115], "B": ["img/2022-180-23fc7b65.webp", 113, 111], "C": ["img/2022-180-5be81d3b.webp", 114, 114], "D": ["img/2022-180-c29e4144.webp", 108, 117], "E": ["img/2022-180-5e135009.webp", 109, 117]}}, { hint: PH_HINT.i }),
  Object.assign({"id": "i11", "ph": "i", "year": 2021, "num": 137, "title": "O Atomiuim, representado na imagem é um dos…", "src": "ENEM 2021 · Questão 137", "rate": null, "body": "<p>O Atomiuim, representado na imagem é um  <br>dos principais pontos turísticos de Bruxelas. Ele foi  <br>construído em 1958 para a primeira grande exposição  <br>mundial depois da Segunda Guerra Mundial, a Feira  <br>Mundial de Bruxelas.  <br>Trata-se de uma estrutura metálica construída no  <br>formato de um cubo. Essa estrutura está apoiada por um  <br>dos vértices sobre uma base paralela ao plano do solo,  <br>e a diagonal do cubo, contendo esse vértice, é ortogonal  <br>ao plano da base. Centradas nos vértices desse cubo,  <br>foram construídas oito esferas metálicas, e uma outra  <br>esfera foi construída centrada no ponto de interseção das  <br>diagonais do cubo. As oito esferas sobre os vértices são  <br>interligadas segundo suas arestas, e a esfera central se  <br>conecta a elas pelas diagonais do cubo.  <br>Todas essas interligações são feitas por tubos  <br>cilíndricos que possuem escadas em seu interior,  <br>permitindo o deslocamento de pessoas pela parte  <br>interna da estrutura. Na diagonal ortogonal à base, o  <br>deslocamento é feito por um elevador, que permite o  <br>deslocamento entre as esferas da base e a esfera do  <br>ponto mais alto, passando pela esfera central.</p>\n<p>Considere um visitante que se deslocou pelo interior  <br>do Atomium sempre em linha reta e seguindo o menor trajeto entre dois vértices, passand0 por todas as arestas e todas as diagonais do cubo.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-137-adb90310.webp\" width=\"505\" height=\"471\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A projeção ortogonal sobre o plano do solo do trajeto percorrido por esse visitante é representada por", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2021-137-79821b1f.webp", 177, 196], "B": ["img/2021-137-a5e4c57e.webp", 126, 132], "C": ["img/2021-137-035954ad.webp", 125, 104], "D": ["img/2021-137-2110fe80.webp", 126, 93], "E": ["img/2021-137-92f0272e.webp", 138, 130]}}, { hint: PH_HINT.i }),
  Object.assign({"id": "i12", "ph": "i", "year": 2021, "num": 166, "title": "O projeto de um contêiner, em forma de…", "src": "ENEM 2021 · Questão 166", "rate": null, "body": "<p>O projeto de um contêiner, em forma de paralelepípedo reto retangular, previa a pintura dos dois lados (interno e externo) de cada uma das quatro paredes com tinta acrílica e a pintura do piso interno com tinta epóxi. O construtor havia pedido, a cinco fornecedores diferentes, orçamentos das tintas necessárias, mas, antes de iniciar a obra, resolveu mudar o projeto original, alterando o comprimento e a largura para o dobro do originalmente previsto, mantendo inalterada a altura. Ao pedir novos orçamentos aos fornecedores, para as novas dimensões, cada um deu uma resposta diferente sobre as novas quantidades de tinta necessárias.</p>\n<p>Em relação ao previsto para o projeto original, as novas quantidades de tinta necessárias informadas pelos fornecedores foram as seguintes:</p>\n<p>–  Fornecedor I: “O dobro, tanto para as paredes quanto para o piso”.</p>\n<p>– Fornecedor II: “O dobro para as paredes e quatro vezes para o piso”.</p>\n<p>– Fornecedor III: “Quatro vezes, tanto para as paredes quanto para o piso.”</p>\n<p>– Fornecedor IV: “Quatro vezes para as paredes e o dobro para o piso.”</p>\n<p>– Fornecedor V: “Oito vezes para as paredes e quatro vezes para o piso.”</p>\n<p>Analisando as informações dos fornecedores, o construtor providenciará a quantidade adequada de material. Considere a porta de acesso do contêiner como parte de uma das paredes.</p>", "ask": "Qual dos fornecedores prestou as informações adequadas, devendo ser o escolhido pelo construtor para aquisição do material?", "opts": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i13", "ph": "i", "year": 2021, "num": 167, "title": "Um povoado com 100 habitantes está passando por uma…", "src": "ENEM 2021 · Questão 167", "rate": null, "body": "<p>Um povoado com 100 habitantes está passando por uma situação de seca prolongada e os responsáveis pela administração pública local decidem contratar a construção de um reservatório. Ele deverá ter a forma de um cilindro circular reto, cuja base tenha 5 metros de diâmetro interno, e atender à demanda de água da população por um período de exatamente sete dias consecutivos. No oitavo dia, o reservatório vazio é completamente reabastecido por carros-pipa.</p>\n<p>Considere que o consumo médio diário por habitante é de 120 litros de água. Use 3 como aproximação para</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-167-42cbdc11.webp\" width=\"67\" height=\"72\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nas condições apresentadas, o reservatório deverá ser construído com uma altura interna mínima, em metro, igual a", "opts": {"A": "1,12", "B": "3,10", "C": "4,35", "D": "4,48", "E": "5,60"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i14", "ph": "i", "year": 2021, "num": 168, "title": "Num octaedro regular, duas faces são consideradas…", "src": "ENEM 2021 · Questão 168", "rate": null, "body": "<p>Num octaedro regular, duas faces são consideradas opostas quando não têm nem arestas, nem vértices em comum. Na figura, observa-se um octaedro regular e uma de suas planificações, na qual há uma face colorida na cor cinza escuro e outras quatro faces numeradas.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-168-71fccb41.webp\" width=\"403\" height=\"171\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual(is) face(s) ficará(ão) oposta(s) à face de cor cinza escuro, quando o octaedro for reconstruído a partir da planificação dada?", "opts": {"A": "1, 2, 3 e 4", "B": "1 e 3", "C": "1", "D": "2", "E": "4"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i15", "ph": "i", "year": 2021, "num": 170, "title": "Uma pessoa comprou uma caneca para tomar sopa,…", "src": "ENEM 2021 · Questão 170", "rate": null, "body": "<p>Uma pessoa comprou uma caneca para tomar sopa, conforme ilustração.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-170-4b81cbbc.webp\" width=\"337\" height=\"222\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Sabe-se que 1 cm³ = 1 mL e que o topo da caneca é uma circunferência de diâmetro (D) medindo 10 cm, e a base é um círculo de diâmetro (d) medindo 8 cm. Além disso, sabe-se que a altura (h) dessa caneca mede 12 cm (distância entre o centro das circunferências do topo e da base).</p>\n<p>Utilize 3 como aproximação para π.</p>", "ask": "Qual é a capacidade volumétrica, em milimitro, dessa caneca?", "opts": {"A": "216", "B": "408", "C": "732", "D": "2196", "E": "2928"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i16", "ph": "i", "year": 2021, "num": 175, "title": "Muitos brinquedos que frequentemente são…", "src": "ENEM 2021 · Questão 175", "rate": null, "body": "<p>Muitos brinquedos que frequentemente são encontrados em praças e parques públicos apresentam formatos de figuras geométricas bidimensionais e tridimensionais. Uma empresa foi contratada para desenvolver uma nova forma de brinquedo. A proposta apresentada pela empresa foi de uma estrutura formada apenas por hastes metálicas, conectadas umas às outras, como apresentado na figura. As hastes de mesma tonalidade e espessura são congruentes.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-175-604fdc09.webp\" width=\"396\" height=\"310\" alt=\"Figura da questão\" loading=\"lazy\"></figure><p class=\"src-note\">A alternativa E desta questão não está disponível nesta versão da prova.</p>", "ask": "Com base na proposta apresentada, quantas figuras geométricas planas de cada tipo são formadas pela união das hastes?", "opts": {"A": "12 trapézios isósceles e 12 quadrados.", "B": "24 trapézios isósceles e 12 quadrados.", "C": "12 paralelogramos e 12 quadrados.", "D": "8 trapézios isósceles"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i17", "ph": "i", "year": 2020, "num": 145, "title": "Um clube deseja produzir miniaturas em escala do…", "src": "ENEM 2020 · Questão 145", "rate": null, "body": "<p>Um clube deseja produzir miniaturas em escala do troféu que ganhou no último campeonato. O troféu está representado na Figura 1 e é composto por uma base em formato de um paralelepípedo reto-retângulo de madeira, sobre a qual estão fixadas três hastes verticais que sustentam uma esfera de 30 cm de diâmetro, que fica centralizada sobre a base de madeira. O troféu tem 100 cm de altura, incluída sua base.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-145-e67a686b.webp\" width=\"433\" height=\"271\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A miniatura desse troféu deverá ser instalada no interior de uma caixa de vidro, em formato de paralelepípedo reto-retângulo, cujas dimensões internas de sua base estão indicadas na Figura 2, de modo que a base do troféu seja colada na base da caixa e distante das paredes laterais da caixa de vidro em pelo menos 1 cm. Deve ainda haver uma distância de exatos 2 cm entre o topo da esfera e a tampa dessa caixa de vidro. Nessas condições deseja-se fazer a maior miniatura possível.</p>", "ask": "A medida da altura, em centímetro, dessa caixa de vidro deverá ser igual a", "opts": {"A": "12.", "B": "14.", "C": "16.", "D": "18.", "E": "20."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i18", "ph": "i", "year": 2020, "num": 151, "title": "Uma das Sete Maravilhas do Mundo Moderno é o Templo…", "src": "ENEM 2020 · Questão 151", "rate": null, "body": "<p>Uma das Sete Maravilhas do Mundo Moderno é o Templo de Kukulkán, localizado na cidade de Chichén Itzá, no México. Geometricamente, esse templo pode ser representado por um tronco reto de pirâmide de base quadrada.</p>", "ask": "As quantidades de cada tipo de figura plana que formam esse tronco de pirâmide são", "opts": {"A": "2 quadrados e 4 retângulos.", "B": "1 retângulo e 4 triângulos isósceles.", "C": "2 quadrados e 4 trapézios isósceles.", "D": "1 quadrado, 3 retângulos e 2 trapézios retângulos.", "E": "2 retângulos, 2 quadrados e 2 trapézios retângulos."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i19", "ph": "i", "year": 2020, "num": 161, "title": "Uma loja de materiais de construção vende dois…", "src": "ENEM 2020 · Questão 161", "rate": null, "body": "<p>Uma loja de materiais de construção vende dois tipos de caixas-d’água: tipo A e tipo B. Ambas têm formato cilíndrico e possuem o mesmo volume, e a altura da caixa-d’água do tipo B é igual a 25% da altura da caixa-d’água do tipo A.</p>", "ask": "Se R denota o raio da caixa-d’água do tipo A, então o raio da caixa-d’água do tipo B é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-161-b1c014ca.webp", 57, 49], "B": ["img/2020-161-82d66f6a.webp", 85, 78], "C": ["img/2020-161-44c4f327.webp", 105, 66], "D": ["img/2020-161-88450c4c.webp", 104, 78], "E": ["img/2020-161-f2ebf7bd.webp", 124, 81]}}, { hint: PH_HINT.i }),
  Object.assign({"id": "i20", "ph": "i", "year": 2020, "num": 172, "title": "No período de fim de ano, o síndico de um…", "src": "ENEM 2020 · Questão 172", "rate": null, "body": "<p>No período de fim de ano, o síndico de um condomínio resolveu colocar, em um poste, uma iluminação natalina em formato de cone, lembrando uma árvore de Natal, conforme as figuras 1 e 2.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-172-fa2897a7.webp\" width=\"342\" height=\"151\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A árvore deverá ser feita colocando-se mangueiras de iluminação, consideradas segmentos de reta de mesmo comprimento, a partir de um ponto situado a 3 m de altura no poste até um ponto de uma circunferência de fixação, no chão, de tal forma que esta fique dividida em 20 arcos iguais. O poste está fixado no ponto C (centro da circunferência) perpendicularmente ao plano do chão.</p>\n<p>Para economizar, ele utilizará mangueiras de iluminação aproveitadas de anos anteriores, que juntas totalizaram pouco mais de 100 m de comprimento, dos quais ele decide usar exatamente 100 m e deixar o restante como reserva.</p>", "ask": "Para que ele atinja seu objetivo, o raio, em metro, da circunferência deverá ser de", "opts": {"A": "4,00.", "B": "4,87.", "C": "5,00.", "D": "5,83.", "E": "6,26."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i21", "ph": "i", "year": 2020, "num": 176, "title": "Em um jogo desenvolvido para uso no computador,…", "src": "ENEM 2020 · Questão 176", "rate": null, "body": "<p>Em um jogo desenvolvido para uso no computador, objetos tridimensionais vão descendo do alto da tela até alcançarem o plano da base. O usuário pode mover ou girar cada objeto durante sua descida para posicioná-lo convenientemente no plano horizontal. Um desses objetos é formado pela justaposição de quatro cubos idênticos, formando assim um sólido rígido, como ilustrado na figura</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-176-a2a0721b.webp\" width=\"179\" height=\"176\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Para facilitar a movimentação do objeto pelo usuário, o programa projeta ortogonalmente esse sólido em três planos quadriculados perpendiculares entre si, durante sua descida.</p>", "ask": "A figura que apresenta uma possível posição desse sólido, com suas respectivas projeções ortogonais sobre os três planos citados, durante sua descida é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-176-12650113.webp", 132, 131], "B": ["img/2020-176-0d5af792.webp", 134, 143], "C": ["img/2020-176-32d4ff53.webp", 131, 150], "D": ["img/2020-176-80664cc4.webp", 119, 126], "E": ["img/2020-176-4a0cbbd6.webp", 122, 135]}}, { hint: PH_HINT.i }),
  Object.assign({"id": "i22", "ph": "i", "year": 2019, "num": 136, "title": "Um grupo de países criou uma instituição…", "src": "ENEM 2019 · Questão 136", "rate": null, "body": "<p>Um grupo de países criou uma instituição responsável por organizar o Programa Internacional de Nivelamento de Estudos (PINE) com o objetivo de melhorar os índices mundiais de educação. Em sua sede foi construída uma escultura suspensa, com a logomarca oficial do programa, em três dimensões, que é formada por suas iniciais, conforme mostrada na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-136-9375a019.webp\" width=\"325\" height=\"158\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Essa escultura está suspensa por cabos de aço, de maneira que o espaçamento entre letras adjacentes é o mesmo, todas têm igual espessura e ficam dispostas em posição ortogonal ao solo, como ilustrado a seguir.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-136-42ff3b17.webp\" width=\"325\" height=\"182\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Ao meio-dia, com o sol a pino, as letras que formam essa escultura projetam ortogonalmente suas sombras sobre o solo.</p>", "ask": "A sombra projetada no solo é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2019-136-71677fa0.webp", 280, 117], "B": ["img/2019-136-e19c648c.webp", 277, 101], "C": ["img/2019-136-1611bf86.webp", 270, 102], "D": ["img/2019-136-3547286b.webp", 267, 108], "E": ["img/2019-136-f977a763.webp", 273, 126]}}, { hint: PH_HINT.i }),
  Object.assign({"id": "i23", "ph": "i", "year": 2019, "num": 157, "title": "As luminárias para um laboratório de matemática…", "src": "ENEM 2019 · Questão 157", "rate": null, "body": "<p>As luminárias para um laboratório de matemática serão fabricadas em forma de sólidos geométricos.  <br>Uma delas terá a forma de um tetraedro truncado. Esse sólido é gerado a partir de secções paralelas a cada uma das faces de um tetraedro regular. Para essa luminária, as secções serão feitas de maneira que, em cada corte, um terço das arestas seccionadas serão removidas. Uma dessas secções está indicada na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-157-e0eaf50b.webp\" width=\"472\" height=\"231\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Essa luminária terá por faces", "opts": {"A": "4 hexágonos regulares e 4 triângulos equiláteros.", "B": "2 hexágonos regulares e 4 triângulos equiláteros.", "C": "4 quadriláteros e 4 triângulos isósceles.", "D": "3 quadriláteros e 4 triângulos isósceles.", "E": "3 hexágonos regulares e 4 triângulos equiláteros."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i24", "ph": "i", "year": 2019, "num": 164, "title": "Um mestre de obras deseja fazer uma laje com…", "src": "ENEM 2019 · Questão 164", "rate": null, "body": "<p>Um mestre de obras deseja fazer uma laje com espessura de 5 cm utilizando concreto usinado, conforme as dimensões do projeto dadas na figura. O concreto para fazer a laje será fornecido por uma usina que utiliza caminhões com capacidades máximas de 2m³, 5m³ e 10m³ de concreto.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-164-ed128607.webp\" width=\"531\" height=\"347\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual a menor quantidade de caminhões, utilizando suas capacidades máximas, que o mestre de obras deverá pedir à usina de concreto para fazer a laje?", "opts": {"A": "Dez caminhões com capacidade máxima de 10 m³.", "B": "Cinco caminhões com capacidade máxima de 10 m³.", "C": "Um caminhão com capacidade máxima de 5 m³.", "D": "Dez caminhões com capacidade máxima de 2 m³.", "E": "Um caminhão com capacidade máxima de 2 m³."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i25", "ph": "i", "year": 2019, "num": 175, "title": "Uma construtora pretende conectar um reservatório…", "src": "ENEM 2019 · Questão 175", "rate": null, "body": "<p>Uma construtora pretende conectar um reservatório central (Rc) em formato de um cilindro, com raio interno igual a 2 m e altura interna igual a 3,30 m, a quatro reservatórios cilíndricos auxiliares (R1, R2, R3 e R4), os quais possuem raios internos e alturas internas medindo 1,5 m.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-175-6eeec785.webp\" width=\"309\" height=\"125\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>As ligações entre o reservatório central e os auxiliares são feitas por canos cilíndricos com 0,10 m de diâmetro interno e 20 m de comprimento, conectados próximos às bases de cada reservatório.  <br>Na conexão de cada um desses canos com o reservatório central ha registros que liberam ou interrompem o fluxo de água.</p>\n<p>No momento em que o reservatório central está cheio e os auxiliares estão vazios, abrem-se os quatro registros e, após algum tempo, as alturas das colunas de água nos reservatórios se igualam, assim que cessa o fluxo de água entre eles, pelo princípio dos vasos comunicantes.</p>", "ask": "A medida, em metro, das alturas das colunas de água nos reservatórios auxiliares, após cessar o fluxo de água entre eles, é", "opts": {"A": "1,44.", "B": "1,16", "C": "1,10.", "D": "1,00.", "E": "0,95."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),
  Object.assign({"id": "i26", "ph": "i", "year": 2018, "num": 140, "title": "Um artesão possui potes cilíndricos de tinta cujas…", "src": "ENEM 2018 · Questão 140", "rate": null, "body": "<p>Um artesão possui potes cilíndricos de tinta cujas medidas externas são 4 cm de diâmetro e 6 cm de altura. Ele pretende adquirir caixas organizadoras para armazenar seus potes de tinta, empilhados verticalmente com tampas voltadas para cima, de forma que as caixas possam ser fechadas. No mercado,  existem cinco opções de caixas organizadoras, com tampa, em formato de  paralelepípedo reto retângulo, vendidas pelo mesmo preço, possuindo as seguintes dimensões internas:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-140-14af8ae1.webp\" width=\"329\" height=\"162\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual desses modelos o artesão deve adquirir para conseguir armazenar o maior número de potes por caixa?", "opts": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.i }),

        <form class="card start-card" id="start-form" novalidate>
          <h2 class="h2">Quem vai jogar?</h2>
          <div class="field"><label for="f-name">Nome e sobrenome</label><input class="input" id="f-name" name="name" autocomplete="name" maxlength="40" placeholder="Ex.: Ana Souza"></div>
          <fieldset class="field"><legend>Sua turma</legend><div class="seg">
            ${COURSE.turmas.map((t) => `<input type="radio" id="f-${t.toLowerCase()}" name="turma" value="${t}"><label for="f-${t.toLowerCase()}">${t}</label>`).join('')}
          </div></fieldset>
          <p class="form-error" id="f-err" role="alert" hidden></p>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Começar a missão ${ic('arrowRight')}</button>
          <p class="fine">${syncOn() ? 'Sem login. Seu progresso fica salvo neste aparelho e é enviado ao Prof. Mateus para o ranking da turma.' : canStore ? 'Sem login: seu progresso fica salvo neste aparelho, neste navegador.' : 'Atenção: este navegador não está salvando o progresso (janela anônima?). Se fechar a página, você recomeça.'}</p>
        </form>
        <div class="welcome-side">
          ${profs.length ? `<div class="card"><h3 class="h3">Continuar neste aparelho</h3><ul class="prof-list">${profs.map((p) => `<li><button type="button" class="prof-btn" data-act="use-profile" data-id="${esc(p.id)}">${avatar(p)}<span class="pb-main"><b>${esc(p.name)}</b><span>${esc(p.turma)} · ${fmt(p.xp)} XP · ${doneCount(p)}/${TOTAL} questões</span></span>${ic('chevronRight')}</button></li>`).join('')}</ul></div>` : ''}
          <div class="card">
            <h3 class="h3">Como funciona</h3>
            <ol class="how">
              <li class="ph-a"><span class="how-n">1</span><div><b>Responda</b><p>Questões do ENEM com gráficos, tabelas e figuras, do jeito que caem na prova.</p></div></li>
              <li class="ph-d"><span class="how-n">2</span><div><b>Duas chances por questão</b><p>Errou? Aparece uma dica e você tem mais uma tentativa, valendo metade do XP. Errou de novo? A questão fecha sem XP, mostra a resolução e a trilha segue.</p></div></li>
              <li class="ph-f"><span class="how-n">3</span><div><b>Escolha seu caminho</b><p>Todas as fases estão abertas. Ganhe estrelas e medalhas e suba de nível até Lenda do ENEM.</p></div></li>
            </ol>
          </div>
          <div class="teacher-link-row"><button type="button" class="link-btn" data-act="teacher">${ic('gradCap')} Área do professor</button></div>
        </div>
      </section>
    </div>`;
  }

  /* ---------------- Tela: trilha ---------------- */
  function phaseCard(ph) {
    const qs = phaseQs(ph.id);
    const d = qs.filter((q) => isDone(q.id)).length;
    const n = qs.length;
    const unlocked = phaseUnlocked(ph.id);
    const complete = d === n;
    const state = complete ? 'done' : !unlocked ? 'locked' : d ? 'active' : 'open';
    const prev = PHASES[ph.n - 2];
    const left = prev ? phaseQs(prev.id).filter((q) => !isDone(q.id)).length : 0;
    const stars = (P.ph[ph.id] && P.ph[ph.id].stars) || 0;
    const sheet = qs.map((q, i) => { const s = P.q[q.id]; return `<span class="mini-b${s && s.done ? (s.miss ? ' miss' : ' done') : s && s.w && s.w.length ? ' tried' : ''}">${i + 1}</span>`; }).join('');
    const foot = state === 'locked'
      ? (prev && !seqUnlocked(ph.id)
        ? `<p class="ph-lock">${ic('lock')} Conclua ${prev.name} para liberar: ${plural(left, 'falta', 'faltam')} ${left} ${plural(left, 'questão', 'questões')}</p>`
        : `<p class="ph-lock">${ic('lock')} Aguardando o professor liberar esta fase na aula.</p>`)
      : `${complete ? starsHTML(stars) : `<span class="ph-status">${d ? `${d} de ${n} concluídas` : `${n} questões`}</span>`}<button type="button" class="btn btn-ph btn-sm" data-act="phase" data-id="${ph.id}">${complete ? 'Revisar' : d ? 'Continuar' : 'Começar'} ${ic('arrowRight')}</button>`;
    return `<li class="phase ph-${ph.id} is-${state}">
      <div class="ph-node" aria-hidden="true">${state === 'locked' ? ic('lock') : state === 'done' ? ic('check') : ph.n}</div>
      <article class="ph-card" aria-label="Fase ${ph.n}: ${ph.name}${state === 'locked' ? ' (bloqueada)' : ''}">
        <div class="ph-top"><span class="ph-icon">${ic(ph.icon)}</span><div><span class="eyebrow">Fase ${ph.n} · ${ph.aula}</span><h3 class="ph-name">${ph.name}</h3></div>${ring(d, n)}</div>
        <p class="ph-topics">${ph.topics.join(' · ')}</p>
        <div class="ph-sheet" role="img" aria-label="${d} de ${n} questões concluídas">${sheet}</div>
        <div class="ph-foot">${foot}</div>
      </article>
    </li>`;
  }
  function viewMap() {
    const done = doneCount();
    const lv = levelOf(P.xp);
    const span = lv.next ? lv.next.min - lv.min : 1;
    const pct = lv.next ? Math.max(0, Math.min(100, ((P.xp - lv.min) / span) * 100)) : 100;
    const nextPh = PHASES.find((ph) => !phaseDone(ph.id));
    const nextOk = nextPh && phaseUnlocked(nextPh.id);
    return `${topbar()}
    <main class="wrap map">
      <aside class="card player" aria-label="Seu perfil">
        <div class="pl-head">${avatar(P, 'lg')}<div><h1 class="pl-name">${esc(P.name)}</h1><span class="pl-turma">${sandbox ? 'Projeção em sala' : `Turma ${esc(P.turma)}`}</span></div></div>
        <div>
          <div class="level-top"><span class="level-badge">${ic(lv.icon)} Nível ${lv.idx + 1}</span><b class="level-name">${lv.name}</b></div>
          <div class="xpbar" role="progressbar" aria-label="Progresso de nível" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><span style="width:${pct.toFixed(1)}%"></span></div>
          <p class="level-note">${lv.next ? `<b>${fmt(P.xp)} XP</b> · faltam ${fmt(lv.next.min - P.xp)} para <b>${lv.next.name}</b>` : `<b>${fmt(P.xp)} XP</b> · nível máximo alcançado`}</p>
        </div>
        <dl class="pl-stats">
          <div><dt>Questões</dt><dd>${done}<small>/${TOTAL}</small></dd></div>
          <div><dt>De primeira</dt><dd>${ftCount()}</dd></div>
          <div><dt>Estrelas</dt><dd>${totalStars()}<small>/${MAXSTARS}</small></dd></div>
          <div><dt>Melhor sequência</dt><dd>${P.best}</dd></div>
        </dl>
        ${nextPh
          ? (nextOk
            ? `<button type="button" class="btn btn-primary btn-lg btn-block" data-act="phase" data-id="${nextPh.id}">${done ? 'Continuar' : 'Começar'}: ${nextPh.name} ${ic('arrowRight')}</button>`
            : `<p class="wait-note">${ic('lock')}<span><b>Fase ${nextPh.n} · ${nextPh.name}</b> será liberada pelo professor na aula.</span></p>`)
          : `<button type="button" class="btn btn-lime btn-lg btn-block" data-act="cert">${ic('award')} Ver meu certificado</button>`}
        <div class="pl-links">
          <button type="button" class="pill-btn" data-act="badges">${ic('award')} Medalhas <b>${badgeCount()}/${BADGES.length}</b></button>
          <button type="button" class="pill-btn" data-act="cert"${P.done ? '' : ' aria-disabled="true"'}>${ic(P.done ? 'trophy' : 'lock')} Certificado</button>
        </div>
        ${syncNoteHTML()}
      </aside>
      <section aria-labelledby="trail-h">
        <div class="trail-head"><h2 id="trail-h" class="h2">Sua trilha</h2><span class="trail-count">${done}/${TOTAL} questões</span></div>
        <ol class="phases">${PHASES.map(phaseCard).join('')}</ol>
      </section>
    </main>`;
  }

  /* ---------------- Tela: fase ---------------- */
  function phaseDoneBanner(pid) {
    const ph = PH[pid];
    const rec = P.ph[pid] || { stars: 1, ft: 0 };
    const n = phaseQs(pid).length;
    const nx = nextOpenPhase();
    return `<section class="ph-done ph-${pid}"><span class="ph-done-trophy">${ic('trophy')}</span><div><h2>Fase concluída</h2><p>${starsHTML(rec.stars)} ${rec.ft} de ${n} acertos de primeira</p></div>${nx ? `<button type="button" class="btn btn-primary" data-act="phase" data-id="${nx.id}">Ir para a Fase ${nx.n} ${ic('arrowRight')}</button>` : `<button type="button" class="btn btn-lime" data-act="cert">${ic('award')} Ver certificado</button>`}</section>`;
  }
  function qRow(q, i) {
    const s = P.q[q.id];
    const t = tierOf(q);
    const state = s && s.done ? 'done' : s && s.w && s.w.length ? 'tried' : 'new';
    const right = state === 'done'
      ? (s.miss ? `<span class="qr-xp miss">${ic('x')} 0 XP</span>` : `<span class="qr-xp done">${ic('check')} +${s.xp} XP</span>`)
      : `<span class="tier tier-${t.cls}">${t.label}</span><span class="qr-xp">${ic('zap')} ${stakeOf(q, (s && s.w && s.w.length) || 0)} XP</span>`;
    return `<li><button type="button" class="qrow is-${state}${s && s.miss ? ' is-miss' : ''}" data-act="q" data-id="${q.id}">
      <span class="qr-b" aria-hidden="true">${state === 'done' ? q.ans : String(i + 1).padStart(2, '0')}</span>
      <span class="qr-main"><span class="qr-title">${q.title}</span><span class="qr-meta">${q.src}${q.rate != null ? ` · ${q.rate}% acertaram` : ''}${state === 'tried' ? ` · 1 erro, resta 1 tentativa` : s && s.miss ? ' · encerrada com 2 erros' : ''}</span></span>
      <span class="qr-right">${right}</span>
    </button></li>`;
  }
  function viewPhase(pid) {
    const ph = PH[pid];
    const qs = phaseQs(pid);
    const d = qs.filter((q) => isDone(q.id)).length;
    const n = qs.length;
    const xpPh = qs.reduce((s, q) => s + ((P.q[q.id] && P.q[q.id].xp) || 0), 0) + (P.ph[pid] && P.ph[pid].done ? PHASE_BONUS : 0);
    const next = qs.find((q) => !isDone(q.id));
    return `${topbar({ back: { act: 'map', label: 'Voltar à trilha' }, title: ph.name, sub: `Fase ${ph.n} de ${PHASES.length}`, ph: pid })}
    <section class="ph-hero ph-${pid}">
      <div class="wrap ph-hero-in">
        <div class="ph-hero-icon">${ic(ph.icon)}</div>
        <div><span class="eyebrow on-dark">Fase ${ph.n} · ${ph.aula}</span><h1 class="ph-hero-title">${ph.name}</h1><ul class="ph-hero-topics">${ph.topics.map((t) => `<li>${t}</li>`).join('')}</ul></div>
        <div class="ph-hero-side">
          <div class="ph-progress"><div class="ph-progress-bar" role="progressbar" aria-label="Questões concluídas na fase" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${d}"><span style="width:${((d / n) * 100).toFixed(1)}%"></span></div><span>${d}/${n} concluídas · ${fmt(xpPh)} XP nesta fase</span></div>
          <div class="ph-hero-actions">
            <button type="button" class="btn btn-onhero" data-act="theory" data-id="${pid}">${ic('book')} Revisão relâmpago</button>
            ${next ? `<button type="button" class="btn btn-lime" data-act="q" data-id="${next.id}">${d ? 'Continuar' : 'Começar'} ${ic('arrowRight')}</button>` : ''}
          </div>
        </div>
      </div>
    </section>
    <main class="wrap ph-body ph-${pid}">
      ${d === n ? phaseDoneBanner(pid) : ''}
      <div class="year-bar" role="group" aria-label="Filtrar por ano"><span>Ano:</span>${['todos'].concat([...new Set(qs.map((q) => q.year))]).map((y) => `<button type="button" class="seg-btn${yearFilter === String(y) ? ' on' : ''}" data-act="year" data-id="${y}" aria-pressed="${yearFilter === String(y)}">${y === 'todos' ? 'Todos' : y}</button>`).join('')}</div>
      <ol class="qlist" aria-label="Questões da fase">${qs.map((q, i) => (yearFilter !== 'todos' && String(q.year) !== yearFilter ? '' : ((i === 0 || qs[i - 1].year !== q.year) ? `<li class="ql-year"><span>ENEM ${q.year}</span><small>${qs.filter((x) => x.year === q.year && isDone(x.id)).length}/${qs.filter((x) => x.year === q.year).length}</small></li>` : '') + qRow(q, i))).join('')}</ol>
    </main>`;
  }

  /* ---------------- Tela: questão ---------------- */
  function optHTML(q, L, s, finished) {
    const wrong = s.w.indexOf(L) !== -1;
    const right = finished && L === q.ans;
    const sel = !finished && !wrong && ui.sel === L;
    const dis = finished || wrong;
    const cls = `opt${wrong ? ' is-wrong' : ''}${right ? ' is-right' : ''}${sel ? ' is-sel' : ''}`;
    const mark = wrong ? `<span class="opt-mark">${ic('x')}</span>` : right ? `<span class="opt-mark">${ic('check')}</span>` : '';
    const label = `Alternativa ${L}${wrong ? ', descartada' : ''}${right ? ', correta' : ''}`;
    const attrs = `type="button" class="${cls}" data-act="pick" data-l="${L}" aria-pressed="${sel}"${dis ? ' aria-disabled="true"' : ''}`;
    if (q.imgOpts) {
      const im = q.imgOpts[L];
      if (!im) return `<button ${attrs}><span class="bubble" aria-hidden="true">${L}</span><span class="opt-text"><span class="sr-only">${label}: </span>${q.opts[L]}</span>${mark}</button>`;
      return `<button ${attrs} aria-label="${label}"><span class="opt-head"><span class="bubble">${L}</span>${mark}</span><span class="opt-fig paper"><img src="${im[0]}" width="${im[1]}" height="${im[2]}" alt="" loading="lazy"></span></button>`;
    }
    return `<button ${attrs}><span class="bubble" aria-hidden="true">${L}</span><span class="opt-text"><span class="sr-only">${label}: </span>${q.opts[L]}</span>${mark}</button>`;
  }
  function solutionHTML(q) {
    return `<section class="solution" aria-label="Resolução comentada">
      <h2 class="sol-title">${ic('book')} Resolução comentada</h2>
      <div class="sol-body">${q.sol}</div>
      ${q.trap ? `<p class="trap">${ic('alert')}<span><b>Pegadinha:</b> ${q.trap}</span></p>` : ''}
      <p class="sol-answer">Resposta: <span class="ans-b">${q.ans}</span>${q.imgOpts ? `<span>Figura ${q.ans}</span>` : `<span>${q.opts[q.ans]}</span>`}</p>
    </section>`;
  }
  function feedbackHTML(q, s) {
    const r = ui.res;
    if (s.done && s.miss) {
      const extra = r && r.closed && r.phaseJust ? `<span class="gain">${ic('trophy')} Bônus da fase: +${PHASE_BONUS} XP</span>` : '';
      return `<div class="fb fb-bad fb-miss" role="status"><div class="fb-head"><span class="fb-ic">${ic('x')}</span><div><b>Não foi desta vez: questão encerrada.</b><span>Você marcou ${s.w.join(' e ')}. A resposta é a ${q.ans}. Esta questão fica com 0 XP, mas a trilha continua.</span></div></div>${extra ? `<div class="fb-gains">${extra}</div>` : ''}</div>${solutionHTML(q)}`;
    }
    if (s.done) {
      const fresh = r && r.ok;
      const tries = s.w.length + 1;
      const head = `<div class="fb-head"><span class="fb-ic">${ic('check')}</span><div><b>${fresh ? pickOne(PRAISE) : 'Questão concluída'}</b><span>Alternativa ${q.ans} · ${s.ft ? 'de primeira' : `na ${tries}ª tentativa`}</span></div></div>`;
      const gains = fresh
        ? `<span class="gain">${ic('zap', 'ic-fill')} +${r.gained} XP</span>${r.combo ? `<span class="gain combo">${ic('flame')} ${P.streak} seguidas: +${r.combo} XP</span>` : ''}${r.phaseJust ? `<span class="gain">${ic('trophy')} Bônus da fase: +${PHASE_BONUS} XP</span>` : ''}`
        : `<span class="gain">${ic('zap', 'ic-fill')} +${s.xp} XP</span>`;
      return `<div class="fb fb-ok" role="status">${head}<div class="fb-gains">${gains}</div></div>${solutionHTML(q)}`;
    }
    if (sandbox && ui.reveal) return solutionHTML(q);
    if (!s.w.length) return '';
    const fresh = r && !r.ok;
    const last = s.w[s.w.length - 1];
    const msg = fresh
      ? `<b>Ainda não: a ${last} não é a resposta.</b><span>Última tentativa, valendo ${stakeOf(q, s.w.length)} XP. Se errar de novo, a questão fecha sem XP.</span>`
      : `<b>Você já descartou a ${s.w.join(', ')}.</b><span>Resta uma tentativa, valendo ${stakeOf(q, s.w.length)} XP. Se errar de novo, a questão fecha sem XP.</span>`;
    let h = `<div class="fb fb-bad" role="status"><div class="fb-head"><span class="fb-ic">${ic('x')}</span><div>${msg}</div></div></div>`;
    if (s.w.length >= 1) {
      h += `<div class="hint${ui.hint ? ' open' : ''}"><button type="button" class="hint-toggle" data-act="hint" aria-expanded="${ui.hint}">${ic('lightbulb')}<b>Dica liberada</b><span>${ui.hint ? 'Esconder' : 'Ver dica'}</span></button>${ui.hint ? `<div class="hint-body">${q.hint}</div>` : ''}</div>`;
    } else {
      h += `<p class="fb-note">${ic('lightbulb')} Depois do 2º erro, uma dica é liberada.</p>`;
    }
    return h;
  }
  function nextQuestion(q) {
    if (sandbox) {
      const i = QUESTIONS.indexOf(q);
      return QUESTIONS[i + 1] || null;
    }
    const qs = phaseQs(q.ph);
    const i = qs.indexOf(q);
    for (let k = 1; k <= qs.length; k++) { const c = qs[(i + k) % qs.length]; if (!isDone(c.id)) return c; }
    return null;
  }
  function actionsHTML(q, s) {
    const finished = s.done || (sandbox && ui.reveal);
    if (finished) {
      if (P.pending === q.ph) return `<button type="button" class="btn btn-lime btn-lg btn-block" data-act="celebrate" data-id="${q.ph}">${ic('trophy')} Concluir fase</button>`;
      const nx = nextQuestion(q);
      return nx
        ? `<button type="button" class="btn btn-ghost btn-lg" data-act="phase" data-id="${q.ph}">Fase</button><button type="button" class="btn btn-primary btn-lg grow" data-act="q" data-id="${nx.id}">Próxima questão ${ic('arrowRight')}</button>`
        : `<button type="button" class="btn btn-primary btn-lg btn-block" data-act="phase" data-id="${q.ph}">Voltar para a fase ${ic('arrowRight')}</button>`;
    }
    const reveal = sandbox ? `<button type="button" class="btn btn-ghost btn-lg" data-act="reveal">${ic('eye')} Resposta</button>` : '';
    return `${reveal}<button type="button" class="btn btn-primary btn-lg grow" data-act="submit"${ui.sel ? '' : ' disabled'}>${ui.sel ? `Responder ${ui.sel}` : sandbox ? 'Responder' : 'Escolha uma alternativa'}</button>`;
  }
  function viewQuestion(qid) {
    const q = Q[qid];
    const ph = PH[q.ph];
    const qs = phaseQs(q.ph);
    const idx = qs.indexOf(q);
    const s = P.q[qid] || { w: [], done: false, ft: false, xp: 0 };
    const t = tierOf(q);
    const finished = s.done || (sandbox && ui.reveal);
    return `${topbar({ back: { act: 'phase', id: q.ph, label: 'Voltar para a fase' }, title: `Questão ${idx + 1} de ${qs.length}`, sub: ph.name, ph: q.ph })}
    <main class="wrap q-wrap ph-${q.ph}">
      <h1 class="sr-only">${ph.name}, questão ${idx + 1}: ${q.title}</h1>
      <div class="q-meta">
        <span class="chip chip-src">${q.src}</span>
        ${q.rate != null ? `<span class="chip">${ic('users')} ${q.rate}% acertaram no ENEM</span>` : ''}
        <span class="tier tier-${t.cls}">${t.label}</span>
        <span class="chip chip-xp">${ic('zap', 'ic-fill')} ${s.done ? (s.miss ? '0 XP · questão encerrada' : `+${s.xp} XP ganhos`) : `Vale ${stakeOf(q, s.w.length)} XP`}</span>
      </div>
      <article class="q-card" data-qid="${q.id}">
        <div class="q-body">${q.body}</div>
        <p class="q-ask">${q.ask}</p>
      </article>
      <div class="opts${q.imgOpts ? ' opts-img' : ''}${finished ? ' is-finished' : ''}" role="group" aria-label="Alternativas">${lettersOf(q).map((L) => optHTML(q, L, s, finished)).join('')}</div>
      <div class="q-feedback" id="feedback" aria-live="polite">${feedbackHTML(q, s)}</div>
    </main>
    <div class="actionbar"><div class="wrap"><p class="kbd-hint">Atalhos: teclas A a ${lettersOf(q).slice(-1)[0]} para escolher · Enter para responder</p><div class="actionbar-in">${actionsHTML(q, s)}</div></div></div>`;
  }

  /* ---------------- Tela: medalhas ---------------- */
  function viewBadges() {
    const n = badgeCount();
    return `${topbar({ back: { act: 'map', label: 'Voltar à trilha' }, title: 'Medalhas', sub: `${n} de ${BADGES.length}` })}
    <main class="wrap page">
      <div class="page-head"><span class="eyebrow">Conquistas</span><h1>Suas medalhas</h1><p>${n} de ${BADGES.length} desbloqueadas.</p></div>
      <ul class="badges">${BADGES.map((b) => {
        const t = P.badges[b.id];
        return `<li class="badge-card${t ? '' : ' locked'}"><span class="medal${t && b.color === 'lime' ? ' lime' : ''}" style="--m:${MEDAL[b.color]}">${ic(t ? b.icon : 'lock')}</span><span class="badge-name">${b.name}</span><span class="badge-desc">${b.desc}</span>${t ? `<span class="badge-date">Conquistada em ${new Date(t).toLocaleDateString('pt-BR')}</span>` : ''}</li>`;
      }).join('')}</ul>
    </main>`;
  }

  /* ---------------- Tela: certificado ---------------- */
  function certCode(name, turma, xp, ft, stars) {
    const base = `${norm(name)}|${String(turma).toUpperCase()}|${xp}|${ft}|${stars}|${COURSE.certSalt}`;
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let x = fnv(base);
    let y = fnv(base.split('').reverse().join('') + '#');
    let out = '';
    for (let i = 0; i < 4; i++) { out += A[x % 32]; x = Math.floor(x / 32); }
    for (let i = 0; i < 4; i++) { out += A[y % 32]; y = Math.floor(y / 32); }
    return out.slice(0, 4) + '-' + out.slice(4);
  }
  function viewCert() {
    const top = topbar({ back: { act: 'map', label: 'Voltar à trilha' }, title: 'Certificado', sub: `Missão ENEM · ${COURSE.serie}` });
    if (!P.done) {

  /* ---------------- Toasts e XP flutuante ---------------- */
  function toast(html, o) {
    const opt = o || {};
    const el = document.createElement('div');
    el.className = `toast ${opt.kind || ''}`;
    el.innerHTML = `${opt.icon ? ic(opt.icon) : ''}<div>${html}</div>`;
    $('#toast-root').appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 320); }, opt.ms || 3400);
  }
  function floatXP(n) {
    if (!n) return;
    const chip = $('.stat-chip.xp');
    if (!chip) return;
    const r = chip.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'xp-float';
    el.textContent = `+${n} XP`;
    el.style.left = `${r.left + r.width / 2}px`;
    el.style.top = `${r.bottom + 8}px`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }
  function countUp(el, from, to) {
    if (reduced() || from === to) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const dur = 900;
    el.textContent = fmt(from);
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(Math.round(from + (to - from) * e));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---------------- Confete ---------------- */
  const fxCanvas = document.getElementById('fx');
  const fx = fxCanvas.getContext('2d');
  let parts = [];
  let raf = 0;
  const CONF = ['#FF6347', '#F59E0B', '#E84B8A', '#7A5AF8', '#2D8CEB', '#0FAE95', '#3FA34D', '#FFC23D'];
  function sizeFx() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fxCanvas.width = Math.round(window.innerWidth * dpr);
    fxCanvas.height = Math.round(window.innerHeight * dpr);
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function confetti(x, y, n, power) {
    if (reduced()) return;
    if (!parts.length) sizeFx();
    const pw = power || 1;
    for (let i = 0; i < (n || 70); i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
      const sp = (5 + Math.random() * 9) * pw;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35, c: CONF[i % CONF.length], t: 0, ttl: 75 + Math.random() * 60, circ: Math.random() < 0.25 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    fx.clearRect(0, 0, W, H);
    parts = parts.filter((p) => p.t < p.ttl && p.y < H + 40);
    for (const p of parts) {
      p.t += 1; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      fx.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.t) / 22));
      fx.fillStyle = p.c;
      fx.save(); fx.translate(p.x, p.y); fx.rotate(p.r);
      if (p.circ) { fx.beginPath(); fx.arc(0, 0, p.w / 2, 0, 6.283); fx.fill(); }
      else fx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.t * 0.12 + p.r)));
      fx.restore();
    }
    fx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = 0; fx.clearRect(0, 0, W, H); }
  }
  function bigConfetti() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    confetti(W * 0.22, H * 0.5, 60, 1.25);
    confetti(W * 0.78, H * 0.5, 60, 1.25);
    setTimeout(() => confetti(W / 2, H * 0.4, 80, 1.35), 230);
  }
  window.addEventListener('resize', () => { if (parts.length) sizeFx(); });

  /* ---------------- Sons (gerados, sem arquivos) ---------------- */
  let actx = null;
  const SEQ = {
    tick: [[660, 0.05, 0, 'sine', 0.03]],
    right: [[784, 0.12, 0, 'triangle', 0.15], [1175, 0.24, 0.09, 'triangle', 0.13]],
    wrong: [[196, 0.16, 0, 'square', 0.045], [147, 0.24, 0.1, 'square', 0.04]],
    unlock: [[523, 0.12, 0, 'triangle', 0.13], [659, 0.12, 0.1, 'triangle', 0.13], [784, 0.12, 0.2, 'triangle', 0.13], [1047, 0.42, 0.3, 'triangle', 0.15]],
    level: [[587, 0.1, 0, 'triangle', 0.12], [880, 0.1, 0.09, 'triangle', 0.12], [1175, 0.32, 0.18, 'triangle', 0.13]],
  };
  function sfx(kind) {
    if (!store.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime + 0.01;
      (SEQ[kind] || []).forEach(([f, d, dl, type, vol]) => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t0 + dl);
        g.gain.setValueAtTime(0.0001, t0 + dl);
        g.gain.exponentialRampToValueAtTime(vol, t0 + dl + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dl + d);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + dl); o.stop(t0 + dl + d + 0.03);
      });
    } catch (e) { /* sem áudio */ }
  }

  /* ---------------- Ações ---------------- */
  function pickOpt(L) {
    const q = Q[route.id];
    if (!q) return;
    const s = P.q[q.id] || { w: [], done: false };
    if (s.done || s.w.indexOf(L) !== -1 || (sandbox && ui.reveal)) return;
    ui.sel = L;
    sfx('tick');
    $$('.opt').forEach((b) => { const on = b.getAttribute('data-l') === L; b.classList.toggle('is-sel', on); b.setAttribute('aria-pressed', String(on)); });
    const bar = $('.actionbar-in');
    if (bar) bar.innerHTML = actionsHTML(q, s);
  }
  function submit() {
    const q = Q[route.id];
    if (!q || !ui.sel) return;
    const L = ui.sel;
    const from = P.xp;
    const res = answer(q.id, L);
    if (!res) return;
    ui.sel = null;
    ui.res = res;
    ui.hint = false;
    ui.xpFrom = res.ok ? from : null;
    {
      const ph = PH[q.ph];
      const tag = `${ph.n}.${phaseQs(q.ph).indexOf(q) + 1} · ${q.title}`;
      const now = Date.now();
      const evs = [res.ok
        ? { t: now, q: tag, fase: ph.name, res: 'Acertou', tent: res.wrongs + 1, xp: res.gained + res.combo }
        : { t: now, q: tag, fase: ph.name, res: 'Errou', tent: res.wrongs, xp: 0 }];
      if (res.phaseJust) {
        evs.push({ t: now, q: `Fase ${ph.n} · ${ph.name} (${P.ph[q.ph].stars} ★)`, fase: ph.name, res: 'Concluiu a fase', tent: 0, xp: PHASE_BONUS });
        if (P.done) evs.push({ t: now, q: 'Missão concluída', fase: ph.name, res: 'Concluiu a missão', tent: 0, xp: 0 });
      }
      syncEvents(evs);
    }
    render();
    const optEl = $(`.opt[data-l="${L}"]`);
    if (res.ok) {
      sfx('right');
      if (optEl) { const r = optEl.getBoundingClientRect(); confetti(r.left + 34, r.top + r.height / 2, 70, 1); optEl.classList.add('bounce'); }
      floatXP(res.gained + res.combo + (res.phaseJust ? PHASE_BONUS : 0));
      setTimeout(() => { const fb = $('#feedback'); if (fb) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }, 420);
      let delay = 1000;
      if (res.levelUp) { const lv = res.levelUp; setTimeout(() => { toast(`<b>Novo nível: ${lv.name}!</b>Continue assim.`, { kind: 'level', icon: lv.icon }); sfx('level'); }, delay); delay += 800; }
      if (!sandbox) res.badges.forEach((b) => { setTimeout(() => toast(`<b>Medalha: ${b.name}</b>${b.desc}`, { kind: 'badge', icon: b.icon }), delay); delay += 900; });
    } else {
      sfx('wrong');
      if (optEl) { optEl.classList.remove('shake'); void optEl.offsetWidth; optEl.classList.add('shake'); }
      try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* ok */ }
      if (res.closed) {
        let delay = 700;
        if (res.phaseJust) floatXP(PHASE_BONUS);
        if (res.levelUp) { const lv = res.levelUp; setTimeout(() => { toast(`<b>Novo nível: ${lv.name}!</b>Continue assim.`, { kind: 'level', icon: lv.icon }); sfx('level'); }, delay); delay += 800; }
        if (!sandbox) res.badges.forEach((b) => { setTimeout(() => toast(`<b>Medalha: ${b.name}</b>${b.desc}`, { kind: 'badge', icon: b.icon }), delay); delay += 900; });
        setTimeout(() => { const fb2 = $('#feedback'); if (fb2) fb2.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }, 300);
      } else if (res.wrongs === 1) { const h = $('.hint'); if (h) h.classList.add('pop'); }
      const fb = $('#feedback');
      if (fb) { const r = fb.getBoundingClientRect(); if (r.bottom > window.innerHeight - 90) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); }
    }
  }
  function startGame(form) {
    const name = ($('#f-name').value || '').trim().replace(/\s+/g, ' ');
    const t = form.querySelector('input[name="turma"]:checked');
    const err = $('#f-err');
    const fail = (m) => { err.textContent = m; err.hidden = false; };
    if (name.length < 2) { fail('Digite seu nome para começar.'); $('#f-name').focus(); return; }
    if (name.split(' ').length < 2) { fail('Digite seu nome e sobrenome, para o professor saber quem é você.'); $('#f-name').focus(); return; }
    if (!t) { fail(`Escolha a sua turma: ${COURSE.turmasTxt.replace(' e ', ' ou ')}.`); return; }
    const id = slug(name) + '-' + t.value.toLowerCase();
    const existing = store.profiles[id];
    P = existing || newProfile(name, t.value);
    store.profiles[id] = P;
    store.cur = id;
    save();
    sfx('unlock');
    go('map');
    syncEvents(existing ? [] : [{ t: Date.now(), q: 'Entrou na missão', fase: '', res: 'Entrou na missão', tent: 0, xp: 0 }]);
    toast(existing ? `<b>Que bom te ver de novo, ${esc(firstName(P.name))}!</b>Seu progresso foi recuperado.` : `<b>Missão iniciada, ${esc(firstName(P.name))}!</b>Comece pela Fase 1: ${PHASES[0].name}.`, { icon: existing ? 'rotate' : 'flag', kind: 'info' });
  }
  function copyResult() {
    const lv = levelOf(P.xp);
    const text = `Missão ENEM · ${COURSE.materia} (${COURSE.serie})\nAluno(a): ${P.name} (${P.turma})\nQuestões concluídas: ${doneCount()}/${TOTAL}\nXP: ${fmt(P.xp)} · Nível: ${lv.name}\nEstrelas: ${totalStars()}/${MAXSTARS} · De primeira: ${ftCount()}/${TOTAL}\nCódigo de verificação: ${certCode(P.name, P.turma, P.xp, ftCount(), totalStars())}`;
    const ok = () => toast('<b>Resultado copiado</b>Agora é só colar e enviar para o professor.', { icon: 'copy', kind: 'info' });
    const fallback = () => {
      const box = $('#copy-box');
      if (!box) return;
      box.hidden = false; box.value = text; box.focus(); box.select();
      toast('<b>Copie o texto abaixo do certificado</b>Ele já está selecionado.', { icon: 'copy', kind: 'info' });
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      const z = e.target.closest('[data-zoom]');
      if (z && !z.closest('#modal-root')) openZoom(z);
      return;
    }
    if (el.getAttribute('aria-disabled') === 'true') {
      if (el.getAttribute('data-act') === 'cert') toast(`<b>Certificado bloqueado</b>Conclua as ${PHASES.length} fases para liberar.`, { icon: 'lock', kind: 'info' });
      return;
    }
    const act = el.getAttribute('data-act');
    const id = el.getAttribute('data-id');
    switch (act) {
      case 'map': go('map'); break;
      case 'phase':
        if (route.id !== id) yearFilter = 'todos';
        if (phaseUnlocked(id)) go('phase', id);
        else toast('<b>Fase bloqueada</b>Conclua a fase anterior para liberar.', { icon: 'lock', kind: 'info' });
        break;
      case 'q': go('question', id); break;
      case 'year': yearFilter = id; render(); break;
      case 'pick': pickOpt(el.getAttribute('data-l')); break;
      case 'submit': submit(); break;
      case 'hint': {
        ui.hint = !ui.hint;
        const q = Q[route.id];
        const fb = $('#feedback');
        if (q && fb) fb.innerHTML = feedbackHTML(q, P.q[q.id] || { w: [], done: false });
        const tg = $('.hint-toggle');
        if (tg) tg.focus({ preventScroll: true });
        break;
      }
      case 'reveal':
        ui.reveal = true; ui.sel = null; render();
        setTimeout(() => { const fb = $('#feedback'); if (fb) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }, 80);
        break;
      case 'celebrate': celebrate(id); break;
      case 'theory': openTheory(id); break;
      case 'badges': go('badges'); break;
      case 'cert': go('cert'); break;
      case 'menu': openMenu(); break;
      case 'close-modal': closeModal(); break;
      case 'toggle-sound': store.sound = !store.sound; save(); openMenu(); if (store.sound) sfx('right'); break;
      case 'switch': store.cur = null; P = null; save(); go('welcome'); break;
      case 'use-profile': if (store.profiles[id]) { P = store.profiles[id]; store.cur = id; save(); go('map'); } break;
      case 'ask-reset':
        confirmBox('Recomeçar do zero?', `Todo o progresso de <b>${esc(P.name)}</b> neste aparelho (XP, estrelas e medalhas) será apagado. Isso não pode ser desfeito.`, 'do-reset', null, `${ic('rotate')} Recomeçar`);
        break;
      case 'do-reset': {
        const fresh = newProfile(P.name, P.turma);
        fresh.created = P.created;
        store.profiles[P.id] = fresh;
        P = fresh;
        save();
        go('map');
        syncEvents([{ t: Date.now(), q: 'Recomeçou do zero', fase: '', res: 'Recomeçou', tent: 0, xp: 0 }]);
        toast('<b>Progresso zerado</b>Boa missão!', { icon: 'rotate', kind: 'info' });
        break;
      }
      case 'teacher': openPin(); break;
      case 'teacher-back': go(P ? 'map' : 'welcome'); break;
      case 'teacher-lock': teacherOK = false; teacherKey = ''; stopRankTimer(); go(P ? 'map' : 'welcome'); break;
      case 'gate-toggle': {
        if (!teacherKey || !PH[id]) break;
        const fases = Object.assign(Object.fromEntries(PHASES.map((x) => [x.id, true])), store.gates || {});
        fases[id] = !gateOpen(id);
        store.gates = fases;
        rank.gatePending = true;
        save();
        renderGateBox();
        const ph = PH[id];
        fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'fases', p: COURSE.projeto, chave: teacherKey, fases }) })
          .then(() => { toast(`<b>Fase ${ph.n} ${fases[id] ? 'liberada' : 'bloqueada'}</b>${fases[id] ? 'Os alunos já podem entrar nela.' : 'Os alunos não conseguem entrar até você liberar.'}`, { icon: fases[id] ? 'unlock' : 'lock', kind: 'info' }); },
            () => toast('<b>Não consegui salvar</b>Confira a internet e tente de novo.', { icon: 'alert', kind: 'info' }))
          .finally(() => setTimeout(() => { rank.gatePending = false; loadGates(); }, 1500));
        break;
      }
      case 'rank-filter': rank.filtro = id || 'todas'; renderRankBox(); break;
      case 'rank-refresh': loadRanking(); renderRankBox(); break;
      case 'rank-del': {
        const a = rank.data && rank.data.alunos.find((x) => String(x.id) === id);
        if (a) confirmBox('Remover do ranking?', `<b>${esc(a.nome)}</b> (${esc(a.turma)}) sai do ranking e da planilha. Se o aluno continuar jogando, ele volta a aparecer.`, 'do-rank-del', id, `${ic('trash')} Remover`);
        break;
      }
      case 'do-rank-del':
        closeModal(true);
        try { fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'remover', p: COURSE.projeto, chave: teacherKey, id }) }).then(() => setTimeout(loadRanking, 1500), () => toast('<b>Não consegui remover</b>Confira a internet e tente de novo.', { icon: 'alert', kind: 'info' })); } catch (e) { /* ok */ }
        if (rank.data) rank.data.alunos = rank.data.alunos.filter((x) => String(x.id) !== id);
        renderRankBox();
        toast('<b>Aluno removido do ranking</b>', { icon: 'trash', kind: 'info' });
        break;
      case 'start-sandbox':
        sandbox = true;
        P = newProfile('Modo aula', 'Prof');
        P.id = 'modo-aula';
        go('map');
        toast('<b>Modo aula aberto</b>Todas as fases estão liberadas.', { icon: 'play', kind: 'info' });
        break;
      case 'exit-sandbox':
        sandbox = false;
        P = store.cur && store.profiles[store.cur] ? store.profiles[store.cur] : null;
        go(teacherOK ? 'teacher' : P ? 'map' : 'welcome');
        break;
      case 'ask-del': {
        const pr = store.profiles[id];
        if (pr) confirmBox('Apagar este perfil?', `O progresso de <b>${esc(pr.name)}</b> (${esc(pr.turma)}) neste aparelho será apagado. Isso não pode ser desfeito.`, 'do-del', id, `${ic('trash')} Apagar`);
        break;
      }
      case 'do-del':
        delete store.profiles[id];
        if (store.cur === id) { store.cur = null; if (!sandbox) P = null; }
        save();
        go('teacher', null, { keepScroll: true });
        toast('<b>Perfil apagado</b>', { icon: 'trash', kind: 'info' });
        break;
      case 'copy-result': copyResult(); break;
      default: break;
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'start-form') startGame(f);
    else if (f.id === 'pin-form') {
      const v = ($('#pin-in').value || '');
      if (fnv('missao:' + norm(v)) === PIN_HASH) { teacherOK = true; teacherKey = norm(v); closeModal(true); go('teacher'); }
      else { const er = $('#pin-err'); er.hidden = false; $('#pin-in').select(); }
    } else if (f.id === 'verify-form') {
      const num = (s) => parseInt(String(s || '').replace(/\D/g, ''), 10) || 0;
      const name = $('#v-name').value;
      const out = $('#verify-out');
      if (!name.trim()) { out.hidden = false; out.innerHTML = '<span>Digite o nome do aluno.</span>'; return; }
      const code = certCode(name, $('#v-turma').value, num($('#v-xp').value), num($('#v-ft').value), num($('#v-stars').value));
      out.hidden = false;
      out.innerHTML = `<span>Código esperado</span>${code}`;
    }
  });

  document.addEventListener('keydown', (e) => {
    const root = $('#modal-root');
    if (!root.hidden) {
      if (e.key === 'Escape') { closeModal(); return; }
      if (e.key === 'Tab') {
        const f = $$('button, input, select, textarea, [href]', root).filter((x) => !x.disabled && !x.hidden && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0];
        const last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (route.view !== 'question' || e.metaKey || e.ctrlKey || e.altKey) return;
    const tg = e.target;
    if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
    const k = (e.key || '').toUpperCase();
    if (LETTERS.indexOf(k) !== -1 && Q[route.id] && Q[route.id].opts[k] != null) { pickOpt(k); e.preventDefault(); return; }
    if (e.key === 'Enter') {
      const a = document.activeElement;
      if (a && a.matches && a.matches('button:not(.opt)')) return;
      const b = $('.actionbar-in .btn-primary:not([disabled]), .actionbar-in .btn-lime');
      if (b) { e.preventDefault(); b.click(); }
    }
  });

  /* ---------------- Início ---------------- */
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ route: route.view === 'teacher' || sandbox ? { view: 'map', id: null } : route }));
  } catch (e) { /* ok */ }
  function start(data) {
    if (store.cur && store.profiles[store.cur]) P = store.profiles[store.cur];
    const r = data && data.route;
    route = P && r && r.view ? { view: r.view, id: r.id || null } : { view: P ? 'map' : 'welcome', id: null };
    render();
    loadGates();
    if (P && syncOn() && !(store.outbox[P.id] && store.outbox[P.id].last)) syncEvents([]);
    else setTimeout(flush, 2500);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>

</body>
</html>
