  Object.assign({"id": "e4", "ph": "e", "year": 2022, "num": 137, "title": "A World Series é a decisão do campeonato…", "src": "ENEM 2022 · Questão 137", "rate": null, "body": "<p>A World Series é a decisão do campeonato norte-americano de beisebol. Os dois times que chegam  <br>a essa fase jogam, entre si, até sete partidas. O primeiro desses times que completar quatro vitórias é declarado campeão.</p>\n<p>Considere que, em todas as partidas, a probabilidade de qualquer um dos dois times vencer é sempre <img class=\"enem-inline\" src=\"img/2022-137-091aafba.webp\" width=\"39\" height=\"57\" alt=\"\" loading=\"lazy\"></p>", "ask": "Qual é a probabilidade de o time campeão ser aquele que venceu a primeira partida da World Series?", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-137-a62b92ab.webp", 46, 60], "B": ["img/2022-137-bcc4e92c.webp", 44, 59], "C": ["img/2022-137-b783250d.webp", 37, 59], "D": ["img/2022-137-ccd84f4e.webp", 40, 61], "E": ["img/2022-137-1cb4062d.webp", 41, 65]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e5", "ph": "e", "year": 2022, "num": 141, "title": "Em um jogo de bingo, as cartelas contêm 16…", "src": "ENEM 2022 · Questão 141", "rate": null, "body": "<p>Em um jogo de bingo, as cartelas contêm 16 quadrículas dispostas em linhas e colunas. Cada quadrícula tem impresso um número, dentre os inteiros de 1 a 50, sem repetição de número. Na primeira rodada, um número é sorteado, aleatoriamente, dentre os 50 possíveis. Em todas as rodadas, o número sorteado é descartado e não participa dos sorteios das rodadas seguintes. Caso o jogador tenha em sua cartela o número sorteado, ele o assinala na cartela. Ganha o jogador que primeiro conseguir preencher quatro quadrículas que formam uma linha, uma coluna ou uma diagonal, conforme os tipos de situações ilustradas na Figura 1.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-141-e8e788ea.webp\" width=\"471\" height=\"201\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O jogo inicia e, nas quatro primeiras rodadas, foram sorteados os seguintes números: 03, 27, 07 e 48. Ao final da quarta rodada, somente Pedro possuía uma cartela que continha esses quatro números sorteados, sendo que todos os demais jogadores conseguiram assinalar, no máximo, um desses números em suas cartelas. Observe na Figura 2 o cartão de Pedro após as quatro primeiras rodadas.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-141-1e77b1bf.webp\" width=\"178\" height=\"196\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A probabilidade de Pedro ganhar o jogo em uma das duas próximas rodadas é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-141-cd5a2722.webp", 94, 70], "B": ["img/2022-141-3098c816.webp", 130, 68], "C": ["img/2022-141-f1b1ddb0.webp", 133, 66], "D": ["img/2022-141-182be64f.webp", 132, 68], "E": ["img/2022-141-3d293613.webp", 132, 66]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e6", "ph": "e", "year": 2022, "num": 142, "title": "Uma montadora de automóveis divulgou que oferta a…", "src": "ENEM 2022 · Questão 142", "rate": null, "body": "<p>Uma montadora de automóveis divulgou que oferta a seus clientes mais de 1 000 configurações diferentes de carro, variando o modelo, a motorização, os opcionais e a cor do veículo. Atualmente, ela oferece 7 modelos de carros com 2 tipos de motores: 1.0 e 1.6. Já em relação aos opcionais, existem 3 escolhas possíveis: central multimídia, rodas de liga leve e bancos de couro, podendo o cliente optar por incluir um, dois, três ou nenhum dos opcionais disponíveis.</p>", "ask": "Para ser fiel à divulgação feita, a quantidade mínima de cores que a montadora deverá disponibilizar a seus clientes é", "opts": {"A": "8.", "B": "9.", "C": "11.", "D": "18.", "E": "24."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e7", "ph": "e", "year": 2022, "num": 155, "title": "Um prédio, com 9 andares e 8 apartamentos de 2…", "src": "ENEM 2022 · Questão 155", "rate": null, "body": "<p>Um prédio, com 9 andares e 8 apartamentos de 2 quartos por andar, está com todos os seus apartamentos à venda. Os apartamentos são identificados por números formados por dois algarismos, sendo que a dezena indica o andar onde se encontra o apartamento, e a unidade, um algarismo de 1 a 8, que diferencia os apartamentos de um mesmo andar. Quanto à incidência de sol nos quartos desses apartamentos, constatam-se as seguintes características, em função de seus números de identificação:  <br>• naqueles que finalizam em 1 ou 2, ambos os quartos recebem sol apenas na parte da manhã;  <br>• naqueles que finalizam em 3, 4, 5 ou 6, apenas um dos quartos recebe sol na parte da manhã;  <br>• naqueles que finalizam em 7 ou 8, ambos os quartos recebem sol apenas na parte da tarde.</p>\n<p>Uma pessoa pretende comprar 2 desses apartamentos em um mesmo andar, mas quer que, em ambos, pelo menos um dos quartos receba sol na parte da manhã.</p>", "ask": "De quantas maneiras diferentes essa pessoa poderá escolher 2 desses apartamentos para compra nas condições desejadas?", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-155-4e4d5692.webp", 110, 69], "B": ["img/2022-155-2b0fcee8.webp", 142, 61], "C": ["img/2022-155-e2dfe176.webp", 141, 66], "D": ["img/2022-155-0681d716.webp", 144, 69], "E": ["img/2022-155-027b58bd.webp", 191, 83]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e8", "ph": "e", "year": 2021, "num": 138, "title": "A Copa do Brasil teve, até a edição de 2018, 15…", "src": "ENEM 2021 · Questão 138", "rate": null, "body": "<p>A Copa do Brasil teve, até a edição de 2018, 15 times diferentes como campeões da competição, conforme  <br>apresentado na imagem. Suponha que, como homenagem aos times campeões, a Confederação Brasileira de Futebol  <br>(CBF) pretenda colocar um painel na sua sede. Esse painel teria 6 linhas e, em cada uma delas, 5 placas, referentes  <br>a cada edição da competição, com o nome do time vencedor, o brasão e o ano do título. © painel deve ser fabricado  <br>de modo que a primeira linha só tenha clubes gaúchos (Internacional, Grêmio e Juventude); a segunda, apenas times  <br>cariocas (Flamengo, Vasco e Fluminense); a terceira, somente times mineiros (Cruzeiro e Atlético Mineiro);, a quarta,  <br>exclusivamente clubes paulistas (Corinthians, Palmeiras, Santos, Paulista FC, Santo André), e as duas últimas sem  <br>nenhuma restrição.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-138-d0a6a844.webp\" width=\"630\" height=\"439\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual a expressão determina a quantidade de painéis diferentes que a CBF poderá montar", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2021-138-280b031c.webp", 162, 50], "B": ["img/2021-138-bc565433.webp", 123, 27], "C": ["img/2021-138-3425a80a.webp", 45, 38], "D": ["img/2021-138-1df14680.webp", 144, 52], "E": ["img/2021-138-7ab4be57.webp", 136, 51]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e9", "ph": "e", "year": 2021, "num": 142, "title": "O organizador de uma competição de lançamento de…", "src": "ENEM 2021 · Questão 142", "rate": null, "body": "<p>O organizador de uma competição de lançamento de  <br>dados pretende tornar o campeonato mais competitivo.  <br>Pelas regras atuais da competição, numa rodada, o  <br>jogador lança 3 dardos e pontua caso acerte pelo menos um deles no alvo. O organizador considera que, em média, os jogadores tem, em cada lançamento, 1/2 de probabilidade de acertar um dardo no alvo.  <br>A fim de tornar o jogo mais atrativo, planeja modificar  <br>as regras de modo que a probabilidade de um jogador  <br>pontuar em uma rodada seja igual ou superior a 9/10. Para  <br>isso, decide aumentar a quantidade de dardos a serem  <br>lançados em cada rodada.</p>", "ask": "Com base nos valores considerados pelo organizador da competição, a quantidade mínima de dardos que devem ser disponibilizados em uma rodada para tornar o jogo mais atrativo é", "opts": {"A": "2", "B": "4", "C": "6", "D": "9", "E": "10"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e10", "ph": "e", "year": 2021, "num": 179, "title": "Uma pessoa produzirá uma fantasia utilizando como…", "src": "ENEM 2021 · Questão 179", "rate": null, "body": "<p>Uma pessoa produzirá uma fantasia utilizando como materiais: 2 tipos de tecidos diferentes e 5 tipos distintos de pedras ornamentais. Essa pessoa tem à sua disposição 6 tecidos diferentes e 15 pedras ornamentais distintas.</p>", "ask": "A quantidade de fantasias com materiais diferentes que podem ser produzidas é representada pela expressão", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2021-179-7551285a.webp", 82, 48], "B": ["img/2021-179-ec6aed66.webp", 98, 46], "C": ["img/2021-179-e7db8ec1.webp", 66, 46], "D": ["img/2021-179-7e9a8152.webp", 62, 45], "E": ["img/2021-179-0e4dc469.webp", 43, 47]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e11", "ph": "e", "year": 2020, "num": 142, "title": "O Estatuto do Idoso, no Brasil, prevê certos…", "src": "ENEM 2020 · Questão 142", "rate": null, "body": "<p>O Estatuto do Idoso, no Brasil, prevê certos direitos às pessoas com idade avançada, concedendo a estas, entre outros benefícios, a restituição de imposto de renda antes dos demais contribuintes. A tabela informa os nomes e as idades de 12 idosos que aguardam suas restituições de imposto de renda. Considere que, entre os idosos, a restituição seja concedida em ordem decrescente de idade e que, em subgrupos de pessoas com a mesma idade, a ordem seja decidida por sorteio.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-142-b2b35329.webp\" width=\"423\" height=\"521\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nessas condições, a probabilidade de João ser a sétima pessoa do grupo a receber sua restituição é igual a", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-142-5815f253.webp", 42, 59], "B": ["img/2020-142-28e9c57b.webp", 44, 50], "C": ["img/2020-142-168da0c8.webp", 33, 55], "D": ["img/2020-142-a70cee23.webp", 28, 54], "E": ["img/2020-142-c1567e92.webp", 28, 54]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e12", "ph": "e", "year": 2020, "num": 157, "title": "Amigo secreto é uma brincadeira tradicional nas…", "src": "ENEM 2020 · Questão 157", "rate": null, "body": "<p>Amigo secreto é uma brincadeira tradicional nas festas de fim de ano. Um grupo de amigos se reúne e cada um deles sorteia o nome da pessoa que irá presentear. No dia da troca de presentes, uma primeira pessoa presenteia seu amigo secreto. Em seguida, o presenteado revela seu amigo secreto e o presenteia. A brincadeira continua até que todos sejam presenteados, mesmo no caso em que o ciclo se fecha. Dez funcionários de uma empresa, entre eles um casal, participarão de um amigo secreto. A primeira pessoa a revelar será definida por sorteio.</p>", "ask": "Qual é a probabilidade de que a primeira pessoa a revelar o seu amigo secreto e a última presenteada sejam as duas pessoas do casal?", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-157-11963c8b.webp", 33, 68], "B": ["img/2020-157-a3ce0158.webp", 42, 68], "C": ["img/2020-157-c97483d0.webp", 43, 66], "D": ["img/2020-157-4e85053e.webp", 40, 66], "E": ["img/2020-157-fab55269.webp", 50, 65]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e13", "ph": "e", "year": 2020, "num": 158, "title": "Três amigos, André, Bernardo e Carlos, moram em um…", "src": "ENEM 2020 · Questão 158", "rate": null, "body": "<p>Três amigos, André, Bernardo e Carlos, moram em um condomínio fechado de uma cidade. O quadriculado representa a localização das ruas paralelas e perpendiculares, delimitando quadras de mesmo tamanho nesse condomínio, em que nos pontos A, B e C estão localizadas as casas de André, Bernardo e Carlos, respectivamente.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-158-2acb1f87.webp\" width=\"222\" height=\"187\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>André deseja deslocar-se da sua casa até a casa de Bernardo, sem passar pela casa de Carlos, seguindo ao longo das ruas do condomínio, fazendo sempre deslocamentos para a direita (→) ou para cima (↑), segundo o esquema da figura.</p>", "ask": "O número de diferentes caminhos que André poderá utilizar para realizar o deslocamento nas condições propostas é", "opts": {"A": "4", "B": "14", "C": "17", "D": "35", "E": "48"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e14", "ph": "e", "year": 2020, "num": 163, "title": "Nos livros Harry Potter, um anagrama do nome do…", "src": "ENEM 2020 · Questão 163", "rate": null, "body": "<p>Nos livros <i>Harry Potter</i>, um anagrama do nome do personagem “TOM MARVOLO RIDDLE” gerou a frase “I AM LORD VOLDEMORT”.</p>\n<p>Suponha que Harry quisesse formar todos os anagramas da frase “I AM POTTER”, de tal forma que as vogais e consoantes aparecessem sempre intercaladas, e sem considerar o espaçamento entre as letras.</p>", "ask": "Nessas condições, o número de anagramas formados é dado por", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-163-75af1ea2.webp", 79, 60], "B": ["img/2020-163-2b88f67f.webp", 121, 68], "C": ["img/2020-163-0f57a362.webp", 174, 91], "D": ["img/2020-163-d6537744.webp", 39, 55], "E": ["img/2020-163-a18fbd88.webp", 72, 59]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e15", "ph": "e", "year": 2019, "num": 156, "title": "Durante suas férias, oito amigos, dos quais dois…", "src": "ENEM 2019 · Questão 156", "rate": null, "body": "<p>Durante suas férias, oito amigos, dos quais dois são canhotos, decidem realizar um torneio de vôlei de praia.</p>\n<p>Eles precisam formar quatro duplas para a realização do torneio. Nenhuma dupla pode ser formada por dois jogadores canhotos.</p>", "ask": "De quantas maneiras diferentes podem ser formadas essas quatro duplas?", "opts": {"A": "69", "B": "70", "C": "90", "D": "104", "E": "105"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e16", "ph": "e", "year": 2019, "num": 171, "title": "Uma empresa confecciona e comercializa um brinquedo…", "src": "ENEM 2019 · Questão 171", "rate": null, "body": "<p>Uma empresa confecciona e comercializa um brinquedo formado por uma locomotiva, pintada na cor preta, mais 12 vagões de iguais formato e tamanho, numerados de 1 a 12. Dos 12 vagões, 4 são pintados na cor vermelha, 3 na cor azul, 3 na cor verde e 2 na cor amarela. O trem é montado utilizando-se uma locomotiva e 12 vagões, ordenados crescentemente segundo suas  numerações, conforme ilustrado na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-171-c821eb9f.webp\" width=\"405\" height=\"94\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "De acordo com as possíveis variações nas colorações dos vagões, a quantidade de trens que podem ser montados, expressa por meio de combinações, é dada por", "opts": {"A": "C412 x C312 x C312 x C212", "B": "C412 + C38 + C35 + C22", "C": "C412 x 2 x C38 x C25", "D": "C412 + 2 + C312 + C312", "E": "C412 x C38 x C35 x C22"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e17", "ph": "e", "year": 2019, "num": 173, "title": "Em um determinado ano, os computadores da receita…", "src": "ENEM 2019 · Questão 173", "rate": null, "body": "<p>Em um determinado ano, os computadores da receita federal de um país identificaram como inconsistentes 20% das declarações de imposto de renda que lhe foram encaminhadas.  <br>Uma declaração é classificada como inconsistente quando apresenta algum tipo de erro ou conflito nas informações prestadas. Essas declarações consideradas inconsistentes foram analisadas pelos auditores, que constataram que 25% delas eram fraudulentas.</p>\n<p>Constatou-se, ainda, que, dentre as declarações que não apresentaram inconsistências, 6,25% eram fraudulentas.</p>", "ask": "Qual é a probabilidade de, nesse ano, a declaração de um contribuinte ser considerada inconsistente, dado que ela era fraudulenta?", "opts": {"A": "0,0500", "B": "0,1000", "C": "0,1125", "D": "0,3125", "E": "0,5000"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e18", "ph": "e", "year": 2018, "num": 150, "title": "Para ganhar um prêmio, uma pessoa deverá retirar,…", "src": "ENEM 2018 · Questão 150", "rate": null, "body": "<p>Para ganhar um prêmio, uma pessoa deverá retirar, sucessivamente e sem reposição, duas bolas pretas de uma mesma urna.  <br>Inicialmente, as quantidades e cores das bolas são como descritas a seguir:  <br>• Urna A – Possui três bolas brancas, duas bolas pretas e uma bola verde;  <br>• Urna B – Possui seis bolas brancas, três bolas pretas e uma bola verde;  <br>• Urna C – Possui duas bolas pretas e duas bolas verdes;  <br>• Urna D – Possui três bolas brancas e três bolas pretas.  <br>A pessoa deve escolher uma entre as cinco opções apresentadas:  <br>• Opção 1 – Retirar, aleatoriamente, duas bolas da urna A;  <br>• Opção 2 – Retirar, aleatoriamente, duas bolas da urna B;  <br>• Opção 3 – Passar, aleatoriamente, uma bola da urna C para a urna A; após isso, retirar, aleatoriamente, duas bolas da urna A;  <br>• Opção 4 – Passar, aleatoriamente, uma bola da urna D para a urna C; após isso, retirar, aleatoriamente, duas bolas da urna C;  <br>• Opção 5 – Passar, aleatoriamente, uma bola da urna C para a urna D; após isso, retirar, aleatoriamente, duas bolas da urna D.</p>", "ask": "Com o objetivo de obter a maior probabilidade possível de ganhar o prêmio, a pessoa deve escolher a opção", "opts": {"A": "1.", "B": "2.", "C": "3.", "D": "4.", "E": "5."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e19", "ph": "e", "year": 2018, "num": 156, "title": "Um rapaz estuda em uma escola que fica longe de sua…", "src": "ENEM 2018 · Questão 156", "rate": null, "body": "<p>Um rapaz estuda em uma escola que fica longe de sua casa, e por isso precisa utilizar o transporte público. Como é muito observador, todos os dias ele anota a hora exata (sem considerar os segundos) em que o ônibus passa pelo ponto de espera. Também notou que nunca consegue chegar ao ponto de ônibus antes de 6h 15 min da manhã. Analisando os dados coletados durante o mês de fevereiro, o  qual teve 21 dias letivos, ele concluiu que 6 h 21 min foi o que mais se repetiu, e que a mediana do conjunto de dados é 6 h 22 min.</p>", "ask": "A probabilidade de que, em algum dos dias letivos de fevereiro, esse rapaz tenha apanhado o ônibus antes de 6 h 21 min da manhã é, no máximo,", "opts": {"A": "4/21", "B": "5/21", "C": "6/21", "D": "7/21", "E": "8/21"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e20", "ph": "e", "year": 2018, "num": 165, "title": "O Salão do Automóvel de São Paulo é um evento no…", "src": "ENEM 2018 · Questão 165", "rate": null, "body": "<p>O Salão do Automóvel de São Paulo é um evento no qual vários fabricantes expõem seus modelos mais recentes de veículos, mostrando, principalmente, suas inovações em design e tecnologia.  <br>Disponível em: http://g1.globo.com. Acesso em: 4 fev. 2015 (adaptado).</p>\n<p>Uma montadora pretende participar desse evento com dois estandes, um na entrada e outro na região central do salão, expondo, em cada um deles, um carro compacto e uma caminhonete. Para compor os estandes, foram disponibilizados pela montadora quatro carros compactos, de modelos distintos, e seis caminhonetes de diferentes cores para serem escolhidos aqueles que serão expostos. A posição dos carros dentro de cada estande é irrelevante.</p>", "ask": "Uma expressão que fornece a quantidade de maneiras diferentes que os estandes podem ser compostos é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-165-8a4d9acc.webp", 37, 33], "B": ["img/2018-165-2ebeb5be.webp", 31, 25], "C": ["img/2018-165-e6a7bd56.webp", 90, 28], "D": ["img/2018-165-a309bdb0.webp", 85, 26], "E": ["img/2018-165-af3980ac.webp", 52, 26]}}, { hint: PH_HINT.e }),
  Object.assign({"id": "e21", "ph": "e", "year": 2018, "num": 167, "title": "O gerente do setor de recursos humanos de uma…", "src": "ENEM 2018 · Questão 167", "rate": null, "body": "<p>O gerente do setor de recursos humanos de uma empresa está organizando uma avaliação em que uma das etapas é um jogo de perguntas e respostas. Para essa etapa, ele classificou as perguntas, pelo nível de dificuldade, em fácil, médio e difícil, e escreveu cada pergunta em cartões para colocação em uma urna.</p>\n<p>Contudo, após depositar vinte perguntas de diferentes níveis na urna, ele observou que 25% delas eram de nível fácil. Querendo que as perguntas de nível fácil sejam a maioria, o gerente decidiu acrescentar mais perguntas de nível fácil à urna, de modo que a probabilidade de o primeiro participante retirar, aleatoriamente, uma pergunta de nível fácil seja de 75%.</p>", "ask": "Com essas informações, a quantidade de perguntas de nível fácil que o gerente deve acrescentar à urna é igual a", "opts": {"A": "10.", "B": "15.", "C": "35.", "D": "40.", "E": "45."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e22", "ph": "e", "year": 2018, "num": 176, "title": "O salto ornamental é um esporte em que cada…", "src": "ENEM 2018 · Questão 176", "rate": null, "body": "<p>O salto ornamental é um esporte em que cada competidor realiza seis saltos. A nota em cada salto é calculada pela soma das notas dos juízes, multiplicada pela nota de partida (o grau de dificuldade de cada salto). Fica em primeiro lugar o atleta que obtiver a maior soma das seis notas recebidas.  <br>O atleta 10 irá realizar o último salto da final. Ele observa no Quadro 1, antes de executar o salto, o recorte do quadro parcial de notas com a sua classificação e a dos três primeiros lugares atê aquele momento.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-176-858eaa5e.webp\" width=\"337\" height=\"132\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Ele precisa decidir com seu treinador qual salto deverá realizar. Os dados dos possíveis tipos de salto estão no Quadro 2.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-176-404191f9.webp\" width=\"340\" height=\"185\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O atleta optará pelo salto com a maior probabilidade de obter a nota estimada, de maneira que lhe permita alcançar o primeiro lugar.</p>", "ask": "Considerando essas condições, o salto que o atleta deverá escolher é o de tipo", "opts": {"A": "T1.", "B": "T2.", "C": "T3.", "D": "T4.", "E": "T5."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "f1", "ph": "f", "year": 2023, "num": 146, "title": "Questão 146", "src": "ENEM 2023 · Questão 146", "rate": null, "body": "<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-146-74e0c851.webp\" width=\"164\" height=\"154\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Considere que os números colocados nos vértices do triângulo estejam em progressão aritmética de razão igual a 2.<br>Nas condições propostas, quais as possíveis soluções para as somas dos números que formam os lados do triângulo?", "opts": {"A": "Há somente uma solução possível, e as somas em cada lado do triângulo são iguais a 7.", "B": "Há somente uma solução possível, e as somas em cada lado do triângulo são iguais a 9.", "C": "Há somente duas soluções possíveis, uma em que as somas em cada lado do triângulo são iguais a 7 e outra em que as somas são iguais a 9.", "D": "Há somente duas soluções possíveis, uma em que as somas em cada lado do triângulo são iguais a 9 e outra em que as somas são iguais a 12.", "E": "Há somente duas soluções possíveis, uma em que as somas em cada lado do triângulo são iguais a 10 e outra em que as somas são iguais a 11."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f2", "ph": "f", "year": 2023, "num": 158, "title": "Um pescador tem um custo fixo diário de R$ 900,00…", "src": "ENEM 2023 · Questão 158", "rate": null, "body": "<p>Um pescador tem um custo fixo diário de R$ 900,00 com combustível, iscas, manutenção de seu barco e outras pequenas despesas. Ele vende cada quilograma de peixe por R$ 5,00. Sua meta é obter um lucro mínimo de R$ 800,00 por dia. Sozinho, ele consegue, ao final de um dia de trabalho, pescar 180 kg de peixe, o que é suficiente apenas para cobrir o custo fixo diário. Portanto, precisa contratar ajudantes, pagando para cada um R$ 250,00 por dia de trabalho. Além desse valor, 4%dareceita obtida pela venda de peixe é repartida igualmente entre os ajudantes. Considerando o tamanho de seu barco, ele pode contratar até 5 ajudantes. Ele sabe que com um ajudante a pesca diária é de 300 kg e que, a partir do segundo ajudante contratado, aumenta-se em 100 kg a quantidade de peixe pescada por ajudante em um dia de trabalho.</p>", "ask": "A quantidade mínima de ajudantes que esse pescador precisa contratar para conseguir o lucro diário pretendido é", "opts": {"A": "1", "B": "2", "C": "3", "D": "4", "E": "5"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f3", "ph": "f", "year": 2023, "num": 175, "title": "O metrô de um município oferece dois tipos de…", "src": "ENEM 2023 · Questão 175", "rate": null, "body": "<p>O metrô de um município oferece dois tipos de tíquetes com colorações diferentes, azul e vermelha, sendo vendidos em cartelas, cada qual com nove tíquetes da mesma cor e mesmo valor unitário. Duas cartelas de tíquetes azuis e uma cartela de tíquetes vermelhos são vendidas por R$ 32,40. Sabe-se que o preço de um tíquete azul menos o preço de um tíquete vermelho é igual ao preço de um tíquete vermelho mais cinco centavos.</p>", "ask": "Qual o preço, em real, de uma cartela de tíquetes vermelhos?", "opts": {"A": "4,68", "B": "6,30", "C": "9,30", "D": "10,50", "E": "10,65"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f4", "ph": "f", "year": 2023, "num": 176, "title": "Os números figurados pentagonais provavelmente…", "src": "ENEM 2023 · Questão 176", "rate": null, "body": "<p>Os números figurados pentagonais provavelmente foram introduzidos pelos pitagóricos por volta do século V a.C. As figuras ilustram como obter os seis primeiros deles, sendo os demais obtidos seguindo o mesmo padrão geométrico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-176-d21e916b.webp\" width=\"425\" height=\"316\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "O oitavo número pentagonal é", "opts": {"A": "59", "B": "83", "C": "86", "D": "89", "E": "92"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f5", "ph": "f", "year": 2022, "num": 152, "title": "Em uma sala de cinema, para garantir que os…", "src": "ENEM 2022 · Questão 152", "rate": null, "body": "<p>Em uma sala de cinema, para garantir que os espectadores vejam toda a imagem projetada na tela, a disposição das poltronas deve obedecer à norma técnica da Associação Brasileira de Normas Técnicas (ABNT), que faz as seguintes indicações:  <br>• Distância mínima (Dmín) entre a tela de projeção e o encosto da poltrona da primeira fileira deve ser de, pelo menos, 60% da largura (L) da tela.  <br>• Distância máxima (Dmáx) entre a tela de projeção e o encosto da poltrona da última fileira deve ser o dobro da largura (L) da tela, sendo aceitável uma distância de até 2,9 vezes a largura (L) da tela.  <br>Para o espaçamento entre as fileiras de poltronas, é considerada a distância de 1 metro entre os encostos de poltronas em duas fileiras consecutivas.</p>\n<p class=\"src-note\">Disponível em: www.ctav.gov.br. Acesso em: 14 nov. 2013.</p>\n<p class=\"src-note\">Disponível em: www.ctav.gov.br. Acesso em: 14 nov. 2013.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-152-f182fb95.webp\" width=\"1083\" height=\"418\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Pretende-se ampliar essa sala, mantendo-se na mesma posição a tela e todas as poltronas já instaladas,  <br>ampliando-se ao máximo a sala para os fundos (área de instalação de novas poltronas), respeitando-se o limite aceitável da norma da ABNT. A intenção é aumentar, ao máximo, a quantidade de poltronas da sala, instalando-se novas unidades, iguais às já instaladas.</p>", "ask": "Quantas fileiras de poltronas a sala comportará após essa ampliação?", "opts": {"A": "26", "B": "27", "C": "28", "D": "29", "E": "35"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f6", "ph": "f", "year": 2021, "num": 136, "title": "Um segmento de reta está dividido em duas partes na…", "src": "ENEM 2021 · Questão 136", "rate": null, "body": "<p>Um segmento de reta está dividido em duas partes  <br>na proporção áurea quando o todo está para uma das  <br>partes na mesma razão em que essa parte está para a  <br>outra. Essa constante de proporcionalidade é comumente  <br>representada pela letra grega ρ, e seu valor é dado pela  <br>solução positiva da equação ρ²=ρ+1</p>\n<p>Assim como a potência ρ², as potências superiores  <br>de ρ podem ser expressas da forma aρ + b, em que a e b  <br>são inteiros positivos, como apresentad0o no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-136-291c6b71.webp\" width=\"357\" height=\"56\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A potência ρ7, escrita na forma aρ+b (a e b são inteiros positivos), é", "opts": {"A": "5ρ+3", "B": "7ρ+2", "C": "9ρ+6", "D": "11ρ+7", "E": "13ρ+8"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f7", "ph": "f", "year": 2021, "num": 141, "title": "Aplicativos que gerenciam serviços de hospedagem…", "src": "ENEM 2021 · Questão 141", "rate": null, "body": "<p>Aplicativos que gerenciam serviços de hospedagem  <br>têm ganhado espaço no Brasil e no mundo por oferecer  <br>opções diferenciadas em termos de localização e valores  <br>de hospedagem. Em um desses aplicativos, o preço P a  <br>ser pago pela hospedagem é calculado considerando um  <br>preço por diária d, acrescido de uma taxa fixa de limpeza L  <br>e de uma taxa de serviço. Essa taxa de serviço é um valor  <br>percentual s calculado sobre o valor pago pelo total das  <br>diárias.</p>", "ask": "Nessa situação, o preço a ser pago ao aplicativo para uma hospedagem de n diárias pode ser obtido pela expressão", "opts": {"A": "P=d.n + L + d.n.s", "B": "P=d.n + L + d.s", "C": "P= d+ L +s", "D": "P= d.n.s + L", "E": "P= d.n + L +s"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f8", "ph": "f", "year": 2021, "num": 164, "title": "Uma pessoa pretende viajar por uma companhia aérea…", "src": "ENEM 2021 · Questão 164", "rate": null, "body": "<p>Uma pessoa pretende viajar por uma companhia aérea que despacha gratuitamente uma mala com até 10kg.</p>\n<p>Em duas viagens que realizou, essa pessoa utilizou a mesma mala e conseguiu 10 kg com as seguintes combinações de itens:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-164-eab2c90e.webp\" width=\"452\" height=\"103\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Para ter certeza de que sua bagagem terá massa de 10 kg, ela decide levar essa mala com duas calças, um sapato e o máximo de camisetas, admitindo que itens do mesmo tipo têm a mesma massa.</p>", "ask": "Qual a quantidade máxima de camisetas que essa pessoa poderá levar?", "opts": {"A": "22", "B": "24", "C": "26", "D": "33", "E": "39"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f9", "ph": "f", "year": 2021, "num": 173, "title": "Um lava-rápido oferece dois tipos de lavagem de…", "src": "ENEM 2021 · Questão 173", "rate": null, "body": "<p>Um lava-rápido oferece dois tipos de lavagem de veículos: lavagem simples, ao preço de R$ 20,00, e lavagem completa, ao preço de R$35,00. Para cobrir as despesas com produtos e funcionários, e não ter prejuízos, o lava-rápido deve ter uma receita diária de, pelo menos, R$300,00.</p>", "ask": "Para não ter prejuízo, o menor número de lavagens diárias que o lava rápido deve efetuar é", "opts": {"A": "6", "B": "8", "C": "9", "D": "15", "E": "20"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f10", "ph": "f", "year": 2021, "num": 180, "title": "Os diretores de uma escola precisam construir um…", "src": "ENEM 2021 · Questão 180", "rate": null, "body": "<p>Os diretores de uma escola precisam construir um laboratório para uso dos alunos. Há duas possibilidades:</p>\n<p>(i) um laboratório do tipo A, com capacidade para 100 usuário, a um custo de 180 mil reais e gastos de 60 mil reais por ano para manutenção;</p>\n<p>(ii) um laboratório do tipo B, com capacidade para 80 usuários, a um custo de 120 mil reais e gastos com manutenção de 16 mil reais por ano.</p>\n<p>Considera-se que, em qualquer caso, o laboratório implantado será utilizado na totalidade de sua capacidade.</p>", "ask": "A economia da escola, na utilização de um laboratório tipo B, em vez de um laboratório tipo A, num período de 4 anos, por usuário, será de", "opts": {"A": "1,31 mil reais", "B": "1,90 mil reais", "C": "2,30 mil reais", "D": "2,36 mil reais", "E": "2,95 mil reais"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f11", "ph": "f", "year": 2020, "num": 146, "title": "Uma casa de dois andares está sendo projetada.", "src": "ENEM 2020 · Questão 146", "rate": null, "body": "<p>Uma casa de dois andares está sendo projetada. É necessário incluir no projeto a construção de uma escada para o acesso ao segundo andar. Para o cálculo das dimensões dos degraus utilizam-se as regras:</p>\n<p>\u00052_h_ + <i>b</i> — 63,5\u0005 ≤ 1,5 e 16 ≤ <i>h</i> ≤ 19,</p>\n<p>nas quais <i>h</i> é a altura do degrau (denominada espelho) e <i>b</i> é a profundidade da pisada, como mostra a figura. Por conveniência, escolheu-se a altura do degrau como sendo <i>h</i> = 16. As unidades de <i>h</i> e <i>b</i> estão em centímetro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-146-7b775aa4.webp\" width=\"291\" height=\"165\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nesse caso, o mais amplo intervalo numérico ao qual a profundidade da pisada (b) deve pertencer, para que as regras sejam satisfeitas é", "opts": {"A": "30 ≤ b", "B": "30 ≤ b ≤ 31,5", "C": "30 ≤ b ≤ 33", "D": "31,5 ≤ b ≤ 33", "E": "B ≤ 33"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f12", "ph": "f", "year": 2020, "num": 155, "title": "O artista gráfico holandês Maurits Cornelius Escher…", "src": "ENEM 2020 · Questão 155", "rate": null, "body": "<p>O artista gráfico holandês Maurits Cornelius Escher criou belíssimas obras nas quais as imagens se repetiam, com diferentes tamanhos, induzindo ao raciocínio de repetição infinita das imagens. Inspirado por ele, um artista fez um rascunho de uma obra na qual propunha a ideia de construção de uma sequência de infinitos quadrados, cada vez menores, uns sob os outros, conforme indicado na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-155-616a68ac.webp\" width=\"288\" height=\"418\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O quadrado <i>PRST</i>, com lado de medida 1, é o ponto de partida. O segundo quadrado é construído sob ele tomando-se o ponto médio da base do quadrado anterior e criando-se um novo quadrado, cujo lado corresponde à metade dessa base. Essa sequência de construção se repete recursivamente.</p>", "ask": "Qual é a medida do lado do centésimo quadrado construído de acordo com esse padrão?", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-155-a5ad527d.webp", 73, 72], "B": ["img/2020-155-e4dc8aff.webp", 72, 72], "C": ["img/2020-155-d93d2235.webp", 73, 72], "D": ["img/2020-155-cc6d3cae.webp", 82, 75], "E": ["img/2020-155-8fbc6313.webp", 83, 68]}}, { hint: PH_HINT.f }),
  Object.assign({"id": "f13", "ph": "f", "year": 2020, "num": 169, "title": "Um grupo sanguíneo, ou tipo sanguíneo, baseia-se na…", "src": "ENEM 2020 · Questão 169", "rate": null, "body": "<p>Um grupo sanguíneo, ou tipo sanguíneo, baseia-se na presença ou ausência de dois antígenos, A e B, na superfície das células vermelhas do sangue. Como dois antígenos estão envolvidos, os quatro tipos sanguíneos distintos são:</p>\n<p>*   Tipo A: apenas o antígeno A está presente;<br>*   Tipo B: apenas o antígeno B está presente;<br>*   Tipo AB: ambos os antígenos estão presentes;<br>*   Tipo O: nenhum dos antígenos está presente.</p>\n<p class=\"src-note\">Disponível em: http://saude.hsw.uol.com.br. Acesso em: 15 abr. 2012 (adaptado).</p>\n<p>Foram coletadas amostras de sangue de 200 pessoas e, após análise laboratorial, foi identificado que em 100 amostras está presente o antígeno A, em 110 amostras há presença do antígeno B e em 20 amostras nenhum dos antígenos está presente.</p>", "ask": "Dessas pessoas que foram submetidas à coleta de sangue, o número das que possuem o tipo sanguíneo A é igual a", "opts": {"A": "30.", "B": "60.", "C": "70.", "D": "90.", "E": "100."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f14", "ph": "f", "year": 2019, "num": 137, "title": "A Hydrangea macrophyila é uma planta com flor azul…", "src": "ENEM 2019 · Questão 137", "rate": null, "body": "<p>A <i>Hydrangea macrophyila</i> é uma planta com flor azul ou cor-de-rosa, dependendo do pH do solo no qual está plantada. Em solo ácido (ou seja, com pH &lt; 7) a flor é azul, enquanto que em solo alcalino (ou seja, com pH &gt; 7) a flor é rosa. Considere que a <i>Hydrangea</i> cor-de-rosa mais valorizada comercialmente numa determinada região seja aquela produzida em solo com pH inferior a 8.</p>\n<p>Sabe-se que pH = – log10x, em que x é a concentração de íon hidrogênio (H+).</p>", "ask": "Para produzir a Hydrangea cor-de-rosa de maior valor comercial, deve-se preparar o solo de modo que x assuma", "opts": {"A": "Qualquer valor acima de 10^{-8}10−8    \t.", "B": "Qualquer valor positivo inferior a 10^{-7}10−7.", "C": "Valores maiores que 7 e menores que 8.", "D": "Valores maiores que 70 e menores que 80.", "E": "Valores maiores que 10^{-8}10−8 e menores que 10^{-7}10−7."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f15", "ph": "f", "year": 2019, "num": 141, "title": "Em um jogo on-line, cada jogador procura subir de…", "src": "ENEM 2019 · Questão 141", "rate": null, "body": "<p>Em um jogo on-line, cada jogador procura subir de nível e aumentar sua experiência, que são dois parâmetros importantes no jogo, dos quais dependem as forças de defesa e de ataque do participante. A força de defesa de cada jogador é diretamente proporcional ao seu nível e ao quadrado de sua experiência, enquanto sua força de ataque é diretamente proporcional à sua experiência e ao quadrado do seu nível. Nenhum jogador sabe o nível ou a experiência dos demais. Os jogadores iniciam o jogo no nível 1 com experiência 1 e possuem força de ataque 2 e de defesa 1. Nesse jogo, cada participante se movimenta em uma cidade em busca de tesouros para aumentar sua experiência. Quando dois deles se encontram, um deles pode desafiar o outro para um confronto, sendo o desafiante considerado o atacante. Compara-se então a força de ataque do desafiante com a força de defesa do desafiado e vence o confronto ao confronto aquele cuja força for maior. O vencedor do desafio aumenta seu nível em uma unidade. Caso haja empate no confronto, ambos os jogadores aumentam seus níveis em uma unidade.</p>\n<p>Durante um jogo, o jogador J1 de nível 4 e experiência 5, irá atacar o jogador J2, de nível 2 e experiência 6.</p>", "ask": "O jogador J1, venceu esse confronto porque a diferença entre sua força de ataque e a força de defesa de seu oponente era", "opts": {"A": "112.", "B": "88.", "C": "60.", "D": "28.", "E": "24."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f16", "ph": "f", "year": 2019, "num": 144, "title": "Um professor aplica, durante os cinco dias úteis de…", "src": "ENEM 2019 · Questão 144", "rate": null, "body": "<p>Um professor aplica, durante os cinco dias úteis de uma semana, testes com quatro questões de múltipla escolha a cinco alunos. Os resultados foram representados na matriz.</p>\n<p>Nessa matriz os elementos das linhas de 1 a 5 representam as quantidades de questões acertadas pelos alunos Ana, Bruno, Carlos, Denis e Érica, respectivamente, enquanto que as colunas de 1 a 5 indicam os dias da semana, de segunda-feira a sexta-feira, respectivamente, em que os testes foram aplicados.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-144-258eca74.webp\" width=\"308\" height=\"236\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "O teste que apresentou maior quantidade de acertos foi o aplicado na", "opts": {"A": "Segunda-feira.", "B": "Terça-feira.", "C": "Quarta-feira.", "D": "Quinta-feira.", "E": "Sexta-feira."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f17", "ph": "f", "year": 2019, "num": 147, "title": "Uma administração municipal encomendou a pintura de…", "src": "ENEM 2019 · Questão 147", "rate": null, "body": "<p>Uma administração municipal encomendou a pintura de dez placas de sinalização para colocar em seu patio de estacionamento.</p>\n<p>O profissional contratado para o serviço inicial pintará o fundo de dez placas e cobrará um valor de acordo com a área total dessas placas. O formato de cada placa é um círculo de diâmetro d = 40 cm, que tangencia lados de um retângulo, sendo que o comprimento total da placa é h = 60 cm, conforme lustrado na figura. Use 3,14 como aproximação para π.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-147-c3302516.webp\" width=\"414\" height=\"438\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual é a soma das medidas das áreas, em centímetros quadrados, das dez placas?", "opts": {"A": "16 628", "B": "22 280", "C": "28 560", "D": "41 120", "E": "66 240"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f18", "ph": "f", "year": 2019, "num": 165, "title": "O álcool é um depressor do sistema nervoso central…", "src": "ENEM 2019 · Questão 165", "rate": null, "body": "<p>O álcool é um depressor do sistema nervoso central e age diretamente em diversos órgãos. A concentração de álcool no sangue pode ser entendida como a razão entre a quantidade <b><i>q</i></b> de álcool ingerido, medida em grama, e o volume de sangue, em litro, presente no organismo do indivíduo. Em geral, considera-se que esse volume corresponda ao valor numérico dado por 8% da massa corporal <b><i>m</i></b> desse indivíduo, medida em quilograma. De acordo com a Associação Médica Americana, uma concentração alcoólica superior a 0,4 grama por litro de sangue é capaz de trazer prejuízos à saúde do indivíduo.</p>\n<p class=\"src-note\"><i>Disponível em: http://cisa.org.br.</i> <i>Acesso em: 1 dez. 2018 (adaptado).</i></p>", "ask": "A expressão relacionando q e m que representa a concentração alcoólica prejudicial à saúde do indivíduo, de acordo com a Associação Médica Americana, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2019-165-ba0a23a6.webp", 109, 60], "B": ["img/2019-165-b0a0c5d2.webp", 113, 62], "C": ["img/2019-165-440296e3.webp", 122, 61], "D": ["img/2019-165-df0a84a8.webp", 123, 70], "E": ["img/2019-165-1a1d1fc2.webp", 126, 59]}}, { hint: PH_HINT.f }),
  Object.assign({"id": "f19", "ph": "f", "year": 2018, "num": 141, "title": "A prefeitura de um pequeno município do interior…", "src": "ENEM 2018 · Questão 141", "rate": null, "body": "<p>A prefeitura de um pequeno município do interior decide colocar postes para  iluminação ao longo de uma estrada retilínea, que inicia em uma praça central e termina numa fazenda na zona rural. Como a praça já possui iluminação, o primeiro poste será colocado a 80 metros da praça, o segundo, a 100 metros, o terceiro, a 120 metros, e assim sucessivamente, mantendo-se sempre uma distância de vinte metros entre os postes, até que o último poste seja colocado a uma distância de 1 380 metros da praça.</p>", "ask": "Se a prefeitura pode pagar, no máximo, R$ 8 000,00 por poste colocado, o maior valor que poderá gastar com a colocação desses postes é", "opts": {"A": "R$512 000,00.", "B": "R$520 000,00.", "C": "R$528 000,00.", "D": "R$552 000,00.", "E": "R$584 000,00."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f20", "ph": "f", "year": 2018, "num": 148, "title": "Uma empresa deseja iniciar uma campanha…", "src": "ENEM 2018 · Questão 148", "rate": null, "body": "<p>Uma empresa deseja iniciar uma campanha publicitária divulgando uma promoção para seus possíveis consumidores. Para esse tipo de campanha, os meios mais viáveis são a distribuição de panfletos na rua e anúncios na rádio local. Considera-se que a população alcançada pela distribuição de panfletos seja igual ã quantidade de panfletos distribuídos, enquanto que a alcançada por um anúncio na rádio seja igual à quantidade de ouvintes desse anúncio. O custo de cada anúncio na rádio é de R$ 120,00, e a estimativa é de que seja ouvido por 1 500 pessoas. Já a produção e a distribuição dos panfletos custam R$ 180,00 cada 1 000 unidades. Considerando que cada pessoa será alcançada por um único desses meios de divulgação, a empresa pretende investir em ambas as mídias.</p>\n<p>Considere X e Y os valores (em real) gastos em anúncios na rádio e com panfletos, respectivamente.</p>", "ask": "O número de pessoas alcançadas pela campanha será dado pela expressão", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2018-148-815e56d4.webp", 83, 38], "B": ["img/2018-148-a81a1d03.webp", 78, 43], "C": ["img/2018-148-3b53ea9e.webp", 65, 45], "D": ["img/2018-148-69efff97.webp", 65, 43], "E": ["img/2018-148-4f37fa96.webp", 70, 43]}}, { hint: PH_HINT.f }),
  Object.assign({"id": "f21", "ph": "f", "year": 2018, "num": 154, "title": "Um designer de jogos planeja um jogo que faz uso de…", "src": "ENEM 2018 · Questão 154", "rate": null, "body": "<p>Um <i>designer</i> de jogos planeja um jogo que faz uso de um tabuleiro de dimensão  n x n, com <img class=\"enem-inline\" src=\"img/2018-154-9362959c.webp\" width=\"40\" height=\"16\" alt=\"\" loading=\"lazy\">no qual cada jogador, na sua vez, coloca uma peça sobre uma das casas vazias do tabuleiro. Quando uma peça é posicionada, a região formada pelas casas que estão na mesma linha ou coluna dessa peça é chamada de zona de combate dessa peça. Na figura está ilustrada a zona de combate de uma peça colocada em uma das casas de um tabuleiro de dimensão 8 x 8.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-154-0068d482.webp\" width=\"289\" height=\"282\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O tabuleiro deve ser dimensionado de forma que a probabilidade de se posicionar a segunda peça aleatoriamente, seguindo a regra do jogo, e esta ficar sobre a zona de combate da primeira, seja inferior a <img class=\"enem-inline\" src=\"img/2018-154-bbc3b943.webp\" width=\"20\" height=\"36\" alt=\"\" loading=\"lazy\"></p>", "ask": "A dimensão mínima que o designer deve adotar para esse tabuleiro é", "opts": {"A": "4 x 4.", "B": "6 x 6.", "C": "9 x 9.", "D": "10 x 10.", "E": "11 x 11."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f22", "ph": "f", "year": 2018, "num": 175, "title": "Uma loja vende automóveis em N parcelas iguais sem…", "src": "ENEM 2018 · Questão 175", "rate": null, "body": "<p>Uma loja vende automóveis em N parcelas iguais sem juros. No momento de contratar o financiamento, caso o cliente queira aumentar o prazo, acrescentando mais 5 parcelas, o valor de cada uma das parcelas diminui R$200,00, ou se ele quiser diminuir o prazo, com 4 parcelas a menos, o valor de cada uma das parcelas sobe R$ 232,00. Considere ainda que, nas três possibilidades de pagamento, o valor do automóvel é o mesmo, todas são sem juros e não ê dado desconto em nenhuma das situações.</p>", "ask": "Nessas condições, qual é a quantidade N de parcelas a serem pagas de acordo com a proposta inicial da loja?", "opts": {"A": "20", "B": "24", "C": "29", "D": "40", "E": "58"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "f23", "ph": "f", "year": 2018, "num": 178, "title": "Durante uma festa de colégio, um grupo de alunos…", "src": "ENEM 2018 · Questão 178", "rate": null, "body": "<p>Durante uma festa de colégio, um grupo de alunos organizou uma rifa. Oitenta alunos faltaram à festa e não participaram da rifa. Entre os que compareceram, alguns compraram três bilhetes, 45 compraram 2 bilhetes, e muitos compraram apenas um. O total de alunos que comprou um único bilhete era 20% do número total de bilhetes vendidos, e o total de bilhetes vendidos excedeu em 33 o número total de alunos do colégio.</p>", "ask": "Quantos alunos compraram somente um bilhete?", "opts": {"A": "34", "B": "42", "C": "47", "D": "48", "E": "79"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.f }),
  Object.assign({"id": "g1", "ph": "g", "year": 2023, "num": 139, "title": "O gerente de uma fábrica pretende comparar a…", "src": "ENEM 2023 · Questão 139", "rate": null, "body": "<p>O gerente de uma fábrica pretende comparar a evolução das vendas de dois produtos similares (I e II). Para isso, passou a verificar o número de unidades vendidas de cada um desses produtos em cada mês. Os resultados dessa verificação, para os meses de abril a junho, são apresentados na tabela.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-139-abba5cb1.webp\" width=\"434\" height=\"154\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O gerente estava decidido a cessar a produção do produto II no mês seguinte àquele em que as vendas do produto I superassem as do produto II.  <br>Suponha que a variação na quantidade de unidades vendidas dos produtos I e II se manteve, mês a mês, como no período representado na tabela.</p>", "ask": "Em qual mês o produto II parou de ser produzido?", "opts": {"A": "Junho.", "B": "Julho.", "C": "Agosto.", "D": "Setembro.", "E": "Outubro."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g2", "ph": "g", "year": 2023, "num": 150, "title": "Dirigir após ingerir bebidas alcoólicas é uma…", "src": "ENEM 2023 · Questão 150", "rate": null, "body": "<p>Dirigir após ingerir bebidas alcoólicas é uma atitude extremamente perigosa, uma vez que, a partir da primeira dose, a pessoa já começa a ter perda de sensibilidade de movimentos e de reflexos. Apesar de a eliminação e absorção do álcool depender de cada pessoa e de como o organismo consegue metabolizar a substância, ao final da primeira hora após a ingestão, a concentração de álcool (C) no sangue corresponde a aproximadamente 90% da quantidade (q) de álcool ingerida, e a eliminação total dessa concentração pode demorar até 12 horas.</p>\n<p class=\"src-note\">Disponível em: http://g1.globo.com. Acesso em: 1 dez. 2018 (adaptado).</p>", "ask": "Nessas condições, ao final da primeira hora após a ingestão da quantidade q de álcool, a concentração C dessa substância no sangue é expressa algebricamente por", "opts": {"A": "C = 0,9q", "B": "C = 0,1q", "C": "C = 1 − 0,1q", "D": "C = 1 − 0,9q", "E": "C = q − 10"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g3", "ph": "g", "year": 2023, "num": 151, "title": "Um investidor iniciante observou o gráfico que…", "src": "ENEM 2023 · Questão 151", "rate": null, "body": "<p>Um investidor iniciante observou o gráfico que apresenta a evolução dos valores de duas criptomoedas A e B em relação ao tempo.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-151-276495a3.webp\" width=\"722\" height=\"597\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Durante horas consecutivas, esses valores foram observados em nove instantes, representados por horas exatas.</p>", "ask": "Em quantos desses instantes a criptomoeda A estava mais valorizada do que a criptomoeda B?", "opts": {"A": "3", "B": "4", "C": "6", "D": "7", "E": "9"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g4", "ph": "g", "year": 2023, "num": 156, "title": "Uma pessoa caminha por 30 minutos e utiliza um…", "src": "ENEM 2023 · Questão 156", "rate": null, "body": "<p>Uma pessoa caminha por 30 minutos e utiliza um aplicativo instalado em seu celular para monitorar a variação da intensidade do sinal de internet recebido pelo aparelho durante o deslocamento. Chegando ao seu destino, o aplicativo forneceu este gráfico:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-156-e9e0b793.webp\" width=\"753\" height=\"460\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Por quantos minutos, durante essa caminhada, o celular dessa pessoa ficou sem receber sinal de internet?", "opts": {"A": "6", "B": "8", "C": "10", "D": "14", "E": "24"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g5", "ph": "g", "year": 2023, "num": 159, "title": "Um agricultor é informado sobre um método de…", "src": "ENEM 2023 · Questão 159", "rate": null, "body": "<p>Um agricultor é informado sobre um método de proteção para sua lavoura que consiste em inserir larvas específicas, de rápida reprodução. A reprodução dessas larvas faz com que sua população multiplique-se por 10 a cada 3 dias e, para evitar eventuais desequilíbrios, é possível cessar essa reprodução aplicando-se um produto X. O agricultor decide iniciar esse método com 100 larvas e dispõe de 5 litros do produto X, cuja aplicação recomendada é de exatamente 1 litro para cada população de 200 000 larvas. A quantidade total do produto X de que ele dispõe deverá ser aplicada de uma única vez.</p>", "ask": "Quantos dias após iniciado esse método o agricultor deverá aplicar o produto X?", "opts": {"A": "2", "B": "4", "C": "6", "D": "12", "E": "18"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g6", "ph": "g", "year": 2023, "num": 162, "title": "Para concretar a laje de sua residência, uma pessoa…", "src": "ENEM 2023 · Questão 162", "rate": null, "body": "<p>Para concretar a laje de sua residência, uma pessoa contratou uma construtora. Tal empresa informa que o preço <i>y</i> do concreto bombeado é composto de duas partes: uma fixa, chamada de taxa de bombeamento, e uma variável, que depende do volume <i>x</i> de concreto utilizado. Sabe-se que a taxa de bombeamento custa R$ 500,00 e que o metro cúbico do concreto bombeado é de R$ 250,00.</p>", "ask": "A expressão que representa o preço y em função do volume x, em metro cúbico, é", "opts": {"A": "Y = 250x", "B": "Y = 500x", "C": "Y = 750x", "D": "Y = 250x + 500", "E": "Y = 500x + 250"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g7", "ph": "g", "year": 2023, "num": 163, "title": "Uma empresa de segurança domiciliar oferece o…", "src": "ENEM 2023 · Questão 163", "rate": null, "body": "<p>Uma empresa de segurança domiciliar oferece o serviço de patrulha noturna, no qual vigilantes em motocicletas fazem o monitoramento periódico de residências. A empresa conta com uma base, de onde acompanha o trajeto realizado pelos vigilantes durante as patrulhas e orienta o deslocamento de equipes de reforço quando necessário. Numa patrulha rotineira, sem ocorrências, um vigilante conduziu sua motocicleta a uma velocidade constante durante todo o itinerário estabelecido, levando 30 minutos para conclusão. De acordo com os registros do GPS alocado na motocicleta, a distância da posição do vigilante à base, ao longo do tempo de realização do trajeto, é descrita pelo gráfico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-163-ff0caefb.webp\" width=\"727\" height=\"461\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A vista superior da trajetória realizada pelo vigilante durante a patrulha registrada no gráfico é descrita pela representação", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-163-71c51165.webp", 170, 196], "B": ["img/2023-163-e04c3016.webp", 209, 198], "C": ["img/2023-163-1706f84a.webp", 202, 168], "D": ["img/2023-163-d49e3db4.webp", 355, 194], "E": ["img/2023-163-7f6e3bbf.webp", 316, 181]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g8", "ph": "g", "year": 2023, "num": 169, "title": "O esquema mostra como a intensidade luminosa…", "src": "ENEM 2023 · Questão 169", "rate": null, "body": "<p>O esquema mostra como a intensidade luminosa decresce com o aumento da profundidade em um rio, sendo <img class=\"enem-inline\" src=\"img/2023-169-76239f15.webp\" width=\"24\" height=\"30\" alt=\"\" loading=\"lazy\"> a intensidade na sua superfície.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-169-3af229c8.webp\" width=\"300\" height=\"241\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Considere que a intensidade luminosa diminui, a cada metro acrescido na profundidade, segundo o mesmo padrão do esquema.</p>", "ask": "A intensidade luminosa correspondente à profundidade de 6 m é igual a", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-169-0ad62fa9.webp", 55, 68], "B": ["img/2023-169-74afb699.webp", 40, 49], "C": ["img/2023-169-23fe5ab4.webp", 60, 54], "D": ["img/2023-169-9394f679.webp", 70, 49], "E": ["img/2023-169-5037e73b.webp", 80, 62]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g9", "ph": "g", "year": 2023, "num": 170, "title": "Analisando as vendas de uma empresa, o gerente…", "src": "ENEM 2023 · Questão 170", "rate": null, "body": "<p>Analisando as vendas de uma empresa, o gerente concluiu que o montante diário arrecadado, em milhar de real, poderia ser calculado pela expressão</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-170-369b24e4.webp\" width=\"267\" height=\"78\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>, em que os valores de x representam os dias do mês, variando de 1 a 30.</p>\n<p>Um dos fatores para avaliar o desempenho mensal da empresa é verificar qual é o menor montante diário <img class=\"enem-inline\" src=\"img/2023-170-b158b079.webp\" width=\"37\" height=\"44\" alt=\"\" loading=\"lazy\"> arrecadado ao longo do mês e classificar o desempenho conforme as categorias apresentadas a seguir, em que as quantidades estão expressas em milhar de real.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-170-e7404490.webp\" width=\"300\" height=\"220\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "No caso analisado, qual seria a classificação do desempenho da empresa?", "opts": {"A": "Ótimo.", "B": "Bom.", "C": "Normal.", "D": "Ruim.", "E": "Péssimo."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g10", "ph": "g", "year": 2023, "num": 177, "title": "A figura ilustra uma roda-gigante no exato instante…", "src": "ENEM 2023 · Questão 177", "rate": null, "body": "<p>A figura ilustra uma roda-gigante no exato instante em que a cadeira onde se encontra a pessoa P está no ponto mais alto dessa roda-gigante.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-177-27c49bd5.webp\" width=\"394\" height=\"313\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Com o passar do tempo, à medida que a roda-gigante gira, com velocidade angular constante e no sentido horário, a altura da cadeira onde se encontra a pessoa P, em relação ao solo, vai se alterando.</p>", "ask": "O gráfico que melhor representa a variação dessa altura, em função do tempo, contado a partir do instante em que a cadeira da pessoa P se encontra na posição mais alta da roda-gigante, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-177-3837d9d0.webp", 378, 146], "B": ["img/2023-177-262c33a1.webp", 413, 154], "C": ["img/2023-177-b9b5c23e.webp", 375, 152], "D": ["img/2023-177-03cd2618.webp", 393, 148], "E": ["img/2023-177-0624eace.webp", 382, 158]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g11", "ph": "g", "year": 2023, "num": 178, "title": "Estudantes trabalhando com robótica criaram uma…", "src": "ENEM 2023 · Questão 178", "rate": null, "body": "<p>Estudantes trabalhando com robótica criaram uma “torneira inteligente” que automatiza sua abertura e seu fechamento durante a limpeza das mãos. A tecnologia funciona da seguinte forma: ao se colocarem as mãos sob a torneira, ela libera água durante 3 segundos para que a pessoa possa molhá-las. Em seguida, interrompe o fornecimento de água por 5 segundos, enquanto a pessoa ensaboa suas mãos, e finaliza o ciclo liberando água para o enxágue por mais 3 segundos. Considere o tempo (<i>t</i>), em segundo, contado a partir do instante em que se inicia o ciclo. A vazão de água nessa torneira é constante.</p>", "ask": "Um esboço de gráfico que descreve o volume de água acumulado, em litro, liberado por essa torneira durante um ciclo de lavagem das mãos, em função do tempo (t), em segundo, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-178-ad5cc202.webp", 609, 328], "B": ["img/2023-178-c3b0946f.webp", 599, 349], "C": ["img/2023-178-f9e8ae9f.webp", 615, 340], "D": ["img/2023-178-46326c50.webp", 611, 329], "E": ["img/2023-178-7ebc0f53.webp", 597, 334]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g12", "ph": "g", "year": 2023, "num": 180, "title": "Um tipo de semente necessita de bastante água nos…", "src": "ENEM 2023 · Questão 180", "rate": null, "body": "<p>Um tipo de semente necessita de bastante água nos dois primeiros meses após o plantio. Um produtor pretende estabelecer o melhor momento para o plantio desse tipo de semente, nos meses de outubro a março. Após consultar a previsão do índice mensal de precipitação de chuva (ImPC) da região onde ocorrerá o plantio, para o período chuvoso de 2020-2021, ele obteve os seguintes dados:  <br>• outubro/2020: ImPC = 250 mm;  <br>• novembro/2020: ImPC = 150 mm;  <br>• dezembro/2020: ImPC = 200 mm;  <br>• janeiro/2021: ImPC = 450 mm;  <br>• fevereiro/2021: ImPC = 100 mm;  <br>• março/2021: ImPC = 200 mm.</p>\n<p>Com base nessas previsões, ele precisa escolher dois meses consecutivos em que a média mensal de precipitação seja a maior possível.</p>", "ask": "No início de qual desses meses o produtor deverá plantar esse tipo de semente?", "opts": {"A": "Outubro.", "B": "Novembro.", "C": "Dezembro.", "D": "Janeiro.", "E": "Fevereiro."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g13", "ph": "g", "year": 2022, "num": 136, "title": "Uma máquina em operação tem sua temperatura T…", "src": "ENEM 2022 · Questão 136", "rate": null, "body": "<p>Uma máquina em operação tem sua temperatura T monitorada por meio de um registro gráfico, ao longo do tempo t. Essa máquina possui um pistão cuja velocidade V varia com a temperatura T da máquina, de acordo com a expressão V=T²−4. Após a máquina funcionar durante o intervalo de tempo de 10 horas, o seu operador analisa o registro gráfico, apresentado na figura, para avaliar a necessidade de eventuais ajustes, sabendo que a máquina apresenta falhas de funcionamento quando a velocidade do pistão se anula.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-136-44fff3b7.webp\" width=\"581\" height=\"304\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Quantas vezes a velocidade do pistão se anulou durante as 10 horas de funcionamento?", "opts": {"A": "1", "B": "2", "C": "3", "D": "4", "E": "5"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g14", "ph": "g", "year": 2022, "num": 150, "title": "Em jogos de voleibol, um saque é invalidado se a…", "src": "ENEM 2022 · Questão 150", "rate": null, "body": "<p>Em jogos de voleibol, um saque é invalidado se a bola atingir o teto do ginásio onde ocorre o jogo. Um jogador de uma equipe tem um saque que atinge uma grande altura. Seu recorde foi quando a batida do saque se iniciou a uma altura de 1,5 m do piso da quadra, e a trajetória da bola foi descrita pela parábola <img class=\"enem-inline\" src=\"img/2022-150-764fcc6a.webp\" width=\"187\" height=\"62\" alt=\"\" loading=\"lazy\"> , em que y representa a altura da bola em relação ao eixo x (das abscissas) que está localizado a 1,5 m do piso da quadra, como representado na figura. Suponha que em todas as partidas algum saque desse jogador atinja a mesma altura do seu recorde.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-150-0964fd1c.webp\" width=\"569\" height=\"380\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A equipe desse jogador participou de um torneio de voleibol no qual jogou cinco partidas, cada uma delas  <br>em um ginásio diferente. As alturas dos tetos desses ginásios, em relação aos pisos das quadras, são:  <br>• ginásio I: 17 m;  <br>• ginásio II: 18 m;  <br>• ginásio III: 19 m;  <br>• ginásio IV: 21 m;  <br>• ginásio V: 40 m.</p>", "ask": "O saque desse atleta foi invalidado", "opts": {"A": "Apenas no ginásio I.", "B": "Apenas nos ginásios I e II.", "C": "Apenas nos ginásios I, II e III.", "D": "Apenas nos ginásios I, II, III e IV.", "E": "Em todos os ginásios."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
  Object.assign({"id": "g15", "ph": "g", "year": 2022, "num": 157, "title": "O funcionário de uma loja tem seu salário mensal…", "src": "ENEM 2022 · Questão 157", "rate": null, "body": "<p>O funcionário de uma loja tem seu salário mensal formado por uma parcela fixa de 675 reais mais uma comissão que depende da quantidade de peças vendidas por ele no mês. O cálculo do valor dessa comissão é feito de acordo com estes critérios:  <br>• até a quinquagésima peça vendida, paga-se 5 reais por peça;  <br>• a partir da quinquagésima primeira peça vendida, o valor pago é de 7 reais por peça.  <br>Represente por q a quantidade de peças vendidas no mês por esse funcionário, e por S(q) o seu salário mensal, em real, nesse mês.</p>", "ask": "A expressão algébrica que descreve S(q) em função de q é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-157-fc471085.webp", 177, 35], "B": ["img/2022-157-e90bf791.webp", 182, 34], "C": ["img/2022-157-693a22d0.webp", 166, 37], "D": ["img/2022-157-62e359c4.webp", 283, 66], "E": ["img/2022-157-af3c085b.webp", 281, 67]}}, { hint: PH_HINT.g }),
  Object.assign({"id": "g16", "ph": "g", "year": 2022, "num": 158, "title": "Ao analisar os dados de uma epidemia em uma cidade,…", "src": "ENEM 2022 · Questão 158", "rate": null, "body": "<p>Ao analisar os dados de uma epidemia em uma cidade, peritos obtiveram um modelo que avalia a quantidade de pessoas infectadas a cada mês, ao longo de um ano. O modelo é dado por <img class=\"enem-inline\" src=\"img/2022-158-94d1c253.webp\" width=\"174\" height=\"21\" alt=\"\" loading=\"lazy\">, sendo t um número natural, variando de 1 a 12, que representa os meses do ano, e p(t) a quantidade de pessoas infectadas no mês t do ano. Para tentar diminuir o número de infectados no próximo ano, a Secretaria Municipal de Saúde decidiu intensificar a propaganda oficial sobre os cuidados com a epidemia. Foram apresentadas cinco propostas (I, II, III, IV e V), com diferentes períodos de intensificação das propagandas:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-158-e0b502d3.webp\" width=\"156\" height=\"132\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A sugestäo dos peritos é que seja escolhida a proposta cujo período de intensificação da propaganda englobe o mês em que, sequndo o modelo, há a maior quantidade de infectados. A sugestão foi aceita.</p>", "ask": "A proposta escolhida foi a", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.g }),
