  Object.assign({"id": "b42", "ph": "b", "year": 2018, "num": 158, "title": "Um produtor de milho utiliza uma área de 160…", "src": "ENEM 2018 · Questão 158", "rate": null, "body": "<p>Um produtor de milho utiliza uma área de 160 hectares para as suas atividades agrícolas. Essa área é dividida em duas partes: uma de 40 hectares, com maior produtividade, e outra, de 120 hectares, com menor produtividade. A produtividade é dada pela razão entre a produção, em tonelada, e a área cultivada. Sabe-se que a área de 40 hectares tem produtividade igual a 2,5 vezes à  <br>da outra. Esse fazendeiro pretende aumentar sua produção total em 15%,  aumentando o tamanho da sua propriedade. Para tanto, pretende comprar uma parte de uma fazenda vizinha, que possui a mesma produtividade da parte de 120 hectares de suas terras.</p>", "ask": "Qual é a área mínima, em hectare, em que o produtor precisará comprar?", "opts": {"A": "36", "B": "33", "C": "27", "D": "24", "E": "21"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b43", "ph": "b", "year": 2018, "num": 169, "title": "Uma empresa de comunicação tem a tarefa de elaborar…", "src": "ENEM 2018 · Questão 169", "rate": null, "body": "<p>Uma empresa de comunicação tem a tarefa de elaborar um material publicitário de um estaleiro para divulgar um novo navio, equipado com um guindaste de 15m de altura e uma esteira de 90 m de comprimento. No desenho desse navio, a representação do guindaste deve ter sua altura entre 0,5 cm e 1 cm, enquanto a esteira deve apresentar comprimento superior a 4 cm. Todo o desenho deverá ser feito em uma escala 1 : X.</p>", "ask": "Os valores possíveis para X são, apenas,", "opts": {"A": "X &gt; 1 500.", "B": "X &lt; 3 000.", "C": "1 500 &lt; X &lt; 2 250.", "D": "1 500 &lt; X &lt; 3 000.", "E": "2 250 &lt; X &lt; 3 000."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "c1", "ph": "c", "year": 2023, "num": 143, "title": "Em janeiro do ano passado, a direção de uma fábrica…", "src": "ENEM 2023 · Questão 143", "rate": null, "body": "<p>Em janeiro do ano passado, a direção de uma fábrica abriu uma creche para os filhos de seus funcionários, com 10 salas, cada uma com capacidade para atender 10 crianças a cada ano. As vagas são sorteadas entre os filhos dos funcionários inscritos, enquanto os não contemplados pelo sorteio formam uma lista de espera. No ano passado, a lista de espera teve 400 nomes e, neste ano, esse número cresceu 10%. A direção da fábrica realizou uma pesquisa e constatou que a lista de espera para o próximo ano terá a mesma quantidade de nomes da lista de espera deste ano. Decidiu, então, construir, ao longo desse ano, novas salas para a creche, também com capacidade de atendimento para 10 crianças cada, de modo que o número de nomes na lista de espera no próximo ano seja 25% menor que o deste ano.</p>", "ask": "O número mínimo de salas que deverão ser construídas é", "opts": {"A": "10", "B": "11", "C": "12", "D": "30", "E": "33"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c2", "ph": "c", "year": 2023, "num": 161, "title": "Uma loja vende seus produtos de duas formas:", "src": "ENEM 2023 · Questão 161", "rate": null, "body": "<p>Uma loja vende seus produtos de duas formas: à vista ou financiado em três parcelas mensais iguais. Para definir o valor dessas parcelas nas vendas financiadas, a loja aumenta em 20% o valor do produto à vista e divide esse novo valor por 3. A primeira parcela deve ser paga no ato da compra, e as duas últimas, em 30 e 60 dias após a compra.</p>\n<p>Um cliente da loja decidiu comprar, de forma financiada, um produto cujo valor à vista é R$ 1 500,00.</p>\n<p>Utilize 5,29 como aproximação para 28.</p>", "ask": "A taxa mensal de juros compostos praticada nesse financiamento é de", "opts": {"A": "6,7%", "B": "10%", "C": "20%", "D": "21,5%", "E": "23,3%"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c3", "ph": "c", "year": 2023, "num": 167, "title": "A cada bimestre, a diretora de uma escola compra…", "src": "ENEM 2023 · Questão 167", "rate": null, "body": "<p>A cada bimestre, a diretora de uma escola compra uma quantidade de folhas de papel ofício proporcional ao número de alunos matriculados. No bimestre passado, ela comprou 6 000 folhas para serem utilizadas pelos 1 200 alunos matriculados. Neste bimestre, alguns alunos cancelaram suas matrículas e a escola tem, agora, 1 150 alunos. A diretora só pode gastar R$ 220,00 nessa compra, e sabe que o fornecedor da escola vende as folhas de papel ofício em embalagens de 100 unidades a R$ 4,00 a embalagem. Assim, será preciso convencer o fornecedor a dar um desconto à escola, de modo que seja possível comprar a quantidade total de papel ofício necessária para o bimestre.</p>", "ask": "O desconto necessário no preço final da compra, em porcentagem, pertence ao intervalo", "opts": {"A": "(5,0 ; 5,5).", "B": "(8,0 ; 8,5).", "C": "(11,5 ; 12,5).", "D": "(19,5 ; 20,5).", "E": "(3,5 ; 4,0)."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c4", "ph": "c", "year": 2022, "num": 147, "title": "Uma equipe de marketing digital foi contratada para…", "src": "ENEM 2022 · Questão 147", "rate": null, "body": "<p>Uma equipe de marketing digital foi contratada para aumentar as vendas de um produto ofertado em um site de comércio eletrônico. Para isso, elaborou um anúncio que, quando o cliente clica sobre ele, é direcionado  <br>para a página de vendas do produto. Esse anúncio foi divulgado em duas redes sociais, A e B, e foram obtidos os seguintes resultados:</p>\n<p>• rede social A: o anúncio foi visualizado por 3 000 pessoas; 10% delas clicaram sobre o anúncio e foram redirecionadas para o site; 3% das que clicaram sobre o anúncio compraram o produto. O investimento feito para a publicação do anúncio nessa rede foi de R$ 100,00;</p>\n<p>• rede social B: o anúncio foi visualizado por 1 000 pessoas; 30% delas clicaram sobre o anúncio e foram redirecionadas para o site; 2% das que  <br>clicaram sobre o anúncio compraram o produto. O investimento feito para a publicação do anúncio nessa rede foi de R$ 200,00.</p>\n<p>Por experiência, o pessoal da equipe de marketing considera que a quantidade de novas pessoas que verão o anúncio é diretamente proporcional ao investimento realizado, e que a quantidade de pessoas que comprarão o produto também se manterá proporcional à quantidade de pessoas que clicarão sobre o anúncio.  <br>O responsável pelo produto decidiu, então, investir mais R$ 300,00 em cada uma das duas redes sociais para a divulgação desse anúncio e obteve, de fato, o aumento proporcional esperado na quantidade de clientes que compraram esse produto. Para classificar o aumento obtido na quantidade (Q) de compradores desse produto, em consequência dessa segunda divulgação, em relação aos resultados observados na primeira divulgação, o  <br>responsável pelo produto adotou o seguinte critério:</p>\n<p>• Q ≤ 60%: não satisfatório;  <br>• 60% &lt; Q ≤ 100%: regular;  <br>• 100% &lt; Q ≤ 150%: bom;  <br>• 150% &lt; Q ≤ 190%: muito bom;  <br>• 190% &lt; Q ≤ 200%: excelente</p>", "ask": "O aumento na quantidade de compradores, em consequência dessa segunda divulgação, em relação<br>ao que foi registrado com a primeira divulgação, foi classificado como", "opts": {"A": "Não satisfatório.", "B": "Regular.", "C": "Bom.", "D": "Muito bom.", "E": "Excelente."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c5", "ph": "c", "year": 2022, "num": 154, "title": "Em janeiro de 2013, foram declaradas 1 794 272…", "src": "ENEM 2022 · Questão 154", "rate": null, "body": "<p>Em janeiro de 2013, foram declaradas 1 794 272 admissões e 1 765 372 desligamentos no Brasil, ou seja,  <br>foram criadas 28 900 vagas de emprego, segundo dados do Cadastro Geral de Empregados e Desempregados (Caged), divulgados pelo Ministério do Trabalho e Emprego (MTE). Segundo o Caged, o número de vagas criadas em janeiro de 2013 sofreu uma queda de 75%, quando comparado com o mesmo período de 2012.</p>\n<p class=\"src-note\">Disponível em: http://portal.mte.gov.br. Acesso em: 23 fev. 2013 (adaptado).</p>", "ask": "De acordo com as informações dadas, o número de vagas criadas em janeiro de 2012 foi", "opts": {"A": "16 514.", "B": "86 700.", "C": "115 600.", "D": "441 343.", "E": "448 568."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c6", "ph": "c", "year": 2022, "num": 163, "title": "Em uma universidade, atuam professores que estão…", "src": "ENEM 2022 · Questão 163", "rate": null, "body": "<p>Em uma universidade, atuam professores que estão enquadrados funcionalmente pela sua maior titulação: mestre ou doutor. Nela há, atualmente, 60 mestres e 40 doutores. Os salários mensais dos professores mestres e dos doutores são, respectivamente, R$ 8 000,00 e  <br>R$ 12 000,00.  <br>A diretoria da instituição pretende proporcionar um aumento salarial diferenciado para o ano seguinte, de tal forma que o salário médio mensal dos professores dessa instituição não ultrapasse R$ 12 240,00. A universidade já estabeleceu que o aumento salarial será de 25% para os mestres e precisa ainda definir o percentual de reajuste para os doutores.</p>", "ask": "Mantido o número atual de professores com suas atuais titulações, o aumento salarial, em porcentagem, a ser concedido aos doutores deverá ser de, no máximo,", "opts": {"A": "14,4.", "B": "20,7.", "C": "22,0.", "D": "30,0.", "E": "37,5"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c7", "ph": "c", "year": 2022, "num": 167, "title": "Em uma loja, o preço promocional de uma geladeira é…", "src": "ENEM 2022 · Questão 167", "rate": null, "body": "<p>Em uma loja, o preço promocional de uma geladeira é de R$ 1 000,00 para pagamento somente em dinheiro. Seu preço normal, fora da promoção, é 10% maior. Para pagamento feito com o cartão de crédito da loja, é dado um desconto de 2% sobre o preço normal.  <br>Uma cliente decidiu comprar essa geladeira, optando pelo pagamento com o cartão de crédito da loja. Ela calculou que o valor a ser pago seria o preço promocional acrescido de 8%. Ao ser informada pela loja do valor a  <br>pagar, segundo sua opção, percebeu uma diferença entre seu cálculo e o valor que lhe foi apresentado</p>", "ask": "O valor apresentado pela loja, comparado ao valor calculado pela cliente, foi", "opts": {"A": "R$ 2,00 menor.", "B": "R$ 100,00 menor.", "C": "R$ 200,00 menor.", "D": "R$ 42,00 maior.", "E": "R$ 80,00 maior."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c8", "ph": "c", "year": 2022, "num": 179, "title": "A esperança de vida ao nascer é o número médio de…", "src": "ENEM 2022 · Questão 179", "rate": null, "body": "<p>A esperança de vida ao nascer é o número médio de anos que um indivíduo tende a viver a partir de seu nascimento, considerando dados da população. No Brasil, esse número vem aumentando consideravelmente, como mostra o gráfico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-179-08b6ac03.webp\" width=\"433\" height=\"358\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p class=\"src-note\">Disponível em: http://cod.ibge.gov.br. Acesso em: 6 mar. 2014 (adaptado).</p>\n<p>Pode-se observar que a esperança de vida ao nascer em 2012 foi exatamente a média das registradas nos anos de 2011 e 2013. Suponha que esse fato também ocorreu com a esperança de vida ao nascer em 2013, em relação às esperanças de vida de 2012 e de 2014.</p>", "ask": "Caso a suposição feita tenha sido confirmada, a esperança de vida ao nascer no Brasil no ano de 2014 terá sido, em ano, igual a", "opts": {"A": "74,23.", "B": "74,51.", "C": "75,07.", "D": "75,23.", "E": "78,49."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c9", "ph": "c", "year": 2021, "num": 145, "title": "Em um estudo realizado pelo IBGE em quatro estados…", "src": "ENEM 2021 · Questão 145", "rate": null, "body": "<p>Em um estudo realizado pelo IBGE em quatro estados e no Distrito Federal, com mais de 5 mil pessoas com 10 anos ou mais, observou-se que a leitura ocupa, em média, apenas seis minutos do dia de cada pessoa.  <br>Na faixa de idade de 10 a 24 anos, a média diária é de três minutos. No entanto, no grupo de idades entre 24 e 60 anos, o tempo médio diário dedicado à leitura é de 5 minutos. Entre os mais velhos, com 60 anos ou mais, a média é de 12 minutos.  <br>A quantidade de pessoas entrevistadas de cada faixa de idade seguiu a distribuição percentual descrita no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-145-9fa287d2.webp\" width=\"500\" height=\"147\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Os valores de x e y do quadro são, respectivamente, iguais a", "opts": {"A": "10 e 80.", "B": "10 e 90.", "C": "20 e 60.", "D": "20 e 80.", "E": "25 e 5"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c10", "ph": "c", "year": 2021, "num": 150, "title": "A depressão caracteriza-se por um desequilíbrio na…", "src": "ENEM 2021 · Questão 150", "rate": null, "body": "<p>A depressão caracteriza-se por um desequilíbrio na química cerebral. Os neurônios de um deprimido não respondem bem as estímulos dos neurotransmissores.  <br>Os remédios que combatem a depressão têm o objetivo de restabelecer a química cerebral. Com o aumento gradativo de casos de depressão, a venda desses medicamentos está em crescente evolução, conforme ilustra o gráfico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-150-76a52739.webp\" width=\"365\" height=\"247\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "No período de 2005 a 2009, o aumento percentual no volume de vendas foi de", "opts": {"A": "45,4.", "B": "54,5.", "C": "120.", "D": "220.", "E": "283,2."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c11", "ph": "c", "year": 2021, "num": 155, "title": "Um atleta produz sua própria refeição com custo…", "src": "ENEM 2021 · Questão 155", "rate": null, "body": "<p>Um atleta produz sua própria refeição com custo fixo de R$ 10,00. Ela é composta por 400g de frango, 600g de batata-doce e uma hortaliça. Atualmente, os preços dos produtos para essa refeição são:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-155-0eb41d8c.webp\" width=\"1014\" height=\"78\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Em relação a esses preços, haverá um aumento de 50% no preço do quilograma de batata-doce, e os outros preços não serão alterados. O atleta deseja manter o custo da refeição, a quantidade de batata-doce e a hortaliça. Portanto, terá que reduzir a quantidade de frango.</p>", "ask": "Qual deve ser a redução percentual da quantidade de frango para que o atleta alcance seu objetivo?", "opts": {"A": "12,5", "B": "28,0", "C": "30,0", "D": "50,0", "E": "70,0"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c12", "ph": "c", "year": 2021, "num": 172, "title": "Um ciclista amador de 61 anos de idade utilizou um…", "src": "ENEM 2021 · Questão 172", "rate": null, "body": "<p>Um ciclista amador de 61 anos de idade utilizou um monitor cardíaco para medir suas frequências cardíacas em quatro diferentes tipos de trechos do percurso. Os resultados das frequências cardíacas máximas alcançadas nesses trechos foram:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-172-604532ed.webp\" width=\"406\" height=\"151\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Sabe-se que a faixa aeróbica ideal para o ganho de condicionamento físico é entre 65% e 85% da frequência cardíaca máxima (Fc máx), que, por sua vez, é determinada pela fórmula:</p>\n<p>Fc máx. = 220 – idades,</p>\n<p>em que a idade é dada em ano e Fc máx. é dada em bpm (batimento por minuto).</p>", "ask": "Os trechos do percurso nos quais esse ciclista se mantém dentro de sua faixa aeróbica ideal, para o ganho de condicionamento físico, são:", "opts": {"A": "Leve no plano, forte no plano, subida moderada e subida forte.", "B": "Leve no plano, forte no plano e subida moderada.", "C": "Forte no plano, subida moderada e subida forte.", "D": "Forte no plano e subida moderada.", "E": "Leve no plano e subida forte."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c13", "ph": "c", "year": 2020, "num": 148, "title": "A Pesquisa Nacional por Amostra de Domicílios…", "src": "ENEM 2020 · Questão 148", "rate": null, "body": "<p>A Pesquisa Nacional por Amostra de Domicílios (Pnad) é uma pesquisa feita anualmente pelo IBGE, exceto nos anos em que há Censo. Em um ano, foram entrevistados 363 mil jovens para fazer um levantamento sobre suas atividades profissionais e/ou acadêmicas. Os resultados da pesquisa estão indicados no gráfico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-148-c9d3a77b.webp\" width=\"369\" height=\"175\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p class=\"src-note\">Disponível em: http://noticias.uol.com.br. Acesso em 20 ago. 2014.</p>", "ask": "De acordo com as informações dadas, o número de jovens entrevistados que trabalha é", "opts": {"A": "114 708.", "B": "164 076.", "C": "213 444.", "D": "284 592.", "E": "291 582."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c14", "ph": "c", "year": 2020, "num": 167, "title": "O quadro representa os gastos mensais, em real, de…", "src": "ENEM 2020 · Questão 167", "rate": null, "body": "<p>O quadro representa os gastos mensais, em real, de uma família com internet, mensalidade escolar e mesada do filho.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-167-b97cd861.webp\" width=\"522\" height=\"81\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>No início do ano, a internet e a mensalidade escolar tiveram acréscimos, respectivamente, de 20% e 10%. Necessitando manter o valor da despesa mensal total com os itens citados, a família reduzirá a mesada do filho.</p>", "ask": "Qual será a porcentagem da redução da mesada?", "opts": {"A": "15,0", "B": "23,5", "C": "30,0", "D": "70,0", "E": "76,5"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c15", "ph": "c", "year": 2019, "num": 138, "title": "Uma pessoa, que perdeu um objeto pessoal quando…", "src": "ENEM 2019 · Questão 138", "rate": null, "body": "<p>Uma pessoa, que perdeu um objeto pessoal quando visitou uma cidade, pretende divulgar nos meios de comunicação informações a respeito da perda desse objeto e de seu contato para eventual devolução. No entanto, ela lembra que, de acordo com o Art. 1 234 do Código Civil, poderá ter que pagar pelas despesas do transporte desse objeto até sua cidade e poderá ter que recompensar a pessoa que lhe restituir o objeto em, pelo menos, 5% do valor do objeto.</p>\n<p>Ela sabe que o custo com transporte será de um quinto do valor atual do objeto e, como ela tem muito interesse em reavê-lo, pretende ofertar o maior percentual possível de recompensa, desde que o gasto total com as despesas não ultrapasse o valor atual do objeto.</p>", "ask": "Nessas condições, o percentual sobre o valor do objeto, dado como recompensa, que ela deverá ofertar é igual a", "opts": {"A": "20%", "B": "25%", "C": "40%", "D": "60%", "E": "80%"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c16", "ph": "c", "year": 2019, "num": 149, "title": "O slogan “Se beber não dirija”, muito utilizado em…", "src": "ENEM 2019 · Questão 149", "rate": null, "body": "<p>O <i>slogan</i> “Se beber não dirija”, muito utilizado em campanhas publicitárias no Brasil, chama a atenção para o grave problema da ingestão de bebida alcoólica por motoristas e suas consequências para o trânsito. A gravidade desse problema pode ser percebida observando como o assunto é tratado pelo Código de Trânsito Brasileiro. Em 2013, a quantidade máxima de álcool permitida no sangue do condutor de um veículo, que já era pequena, foi reduzida, e o valor da multa para motoristas alcoolizados foi aumentado. Em consequência dessas mudanças, observou-se queda no número de acidentes registrados em uma suposta rodovia nos anos que se seguiram às mudanças implantadas em 2013, conforme dados no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-149-a18bc8fd.webp\" width=\"428\" height=\"128\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Suponha que a tendência de redução no número de acidentes nessa rodovia para os anos subsequentes seja igual à redução absoluta observada de 2014 para 2015.</p>", "ask": "Com base na situação apresentada, o número de acidentes esperados nessa rodovia em 2018 foi de", "opts": {"A": "150", "B": "450", "C": "550", "D": "700", "E": "800"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c17", "ph": "c", "year": 2019, "num": 150, "title": "Uma pessoa se interessou em adquirir um produto…", "src": "ENEM 2019 · Questão 150", "rate": null, "body": "<p>Uma pessoa se interessou em adquirir um produto anunciado em uma loja. Negociou com o gerente e conseguiu comprá-lo a uma taxa de juros compostos de 1% ao mês.  <br>O primeiro pagamento será um mês após a aquisição do produto, e no valor de R$ 202,00. O segundo pagamento será efetuado um mês após o primeiro, e terá o valor de R$ 204,02.  <br>Para concretizar a compra, o gerente emitirá uma nota fiscal com o valor do produto à vista negociado com o cliente, correspondendo ao financiamento aprovado.</p>", "ask": "O valor à vista, em real, que deverá constar na nota fiscal é de", "opts": {"A": "398,02", "B": "400,00", "C": "401,94", "D": "404,00", "E": "406,02"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c18", "ph": "c", "year": 2019, "num": 151, "title": "Três sócios resolveram fundar uma fábrica.", "src": "ENEM 2019 · Questão 151", "rate": null, "body": "<p>Três sócios resolveram fundar uma fábrica. O investimento inicial foi de R$ 1 000 000,00. E, independentemente do valor que cada um investiu nesse primeiro momento, resolveram considerar que cada um deles contribuiu com um terço do investimento inicial.</p>\n<p>Algum tempo depois, um quarto sócio entrou para a sociedade, e os quatro, juntos, investiram mais R$ 800 000,00 na fábrica. Cada um deles contribuiu com um quarto desse valor. Quando venderam a fábrica, nenhum outro investimento havia sido feito. Os sócios decidiram então dividir o montante de R$ 1 800 000,00 obtido com a venda, de modo proporcional à quantia total investida por cada sócio.</p>", "ask": "Quais os valores mais próximos, em porcentagens, correspondentes às parcelas financeiras que cada um dos més sócios iniciais e o quarto sócio, respectivamente, receberam?", "opts": {"A": "29,60 e 11,11.", "B": "28,70 e 13,89.", "C": "25,00 e 25,00.", "D": "18,52 e 11,11.", "E": "12,96 e 13,89."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c19", "ph": "c", "year": 2019, "num": 153, "title": "Segundo o Instituto Brasileiro de Geografia e…", "src": "ENEM 2019 · Questão 153", "rate": null, "body": "<p>Segundo o Instituto Brasileiro de Geografia e Estatística (IBGE), o rendimento médio mensal dos trabalhadores brasileiros, no ano 2000, era de R$ 1.250,00. Já o Censo 2010 mostrou que, em 2010, esse valor teve um aumento de 7,2% em relação a 2000. Esse mesmo instituto projeta que, em 2020, o rendimento médio mensal dos trabalhadores brasileiros poderá ser 10% maior do que foi em 2010.</p>\n<p class=\"src-note\"><i>IBGE. Censo 2010</i>. <b>Disponível em:</b> www.ibge.gov.br. Acesso em: 13 ago. 2012 (adaptado).</p>", "ask": "Supondo que as projeções do IBGE se realizem, o rendimento médio mensal dos brasileiros em 2020 será de", "opts": {"A": "R$ 1.340,00.", "B": "R$ 1.349,00", "C": "R$ 1.375,00", "D": "R$ 1.465,00", "E": "R$ 1.474,00."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c20", "ph": "c", "year": 2019, "num": 176, "title": "Para construir uma piscina, cuja área total da…", "src": "ENEM 2019 · Questão 176", "rate": null, "body": "<p>Para construir uma piscina, cuja área total da superfície interna é igual a 40 m², uma construtora apresentou o seguinte orçamento:</p>\n<p>• R$ 10 000,00 pela elaboração do projeto;</p>\n<p>• R$ 40 000,00 pelos custos fixos;</p>\n<p>• R$ 2 500,00 por metro quadrado para construção da área interna da piscina.</p>\n<p>Após a apresentação do orçamento, essa empresa decidiu reduzir o valor de elaboração do projeto em 50%, mas recalculou o valor do metro quadrado para a construção da área interna da piscina, concluindo haver a necessidade de aumentá-lo em 25%. Além disso, a construtora pretende dar um desconto nos custos fixos, de maneira que o novo valor do orçamento seja reduzido em 10% em relação ao total inicial.</p>", "ask": "O percentual de desconto que a construtora deverá conceder nos custos fixos é de", "opts": {"A": "23,3%.", "B": "25,0%.", "C": "50,0%.", "D": "87,5%.", "E": "100,0%."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "c21", "ph": "c", "year": 2018, "num": 177, "title": "Devido ao não cumprimento das metas definidas para…", "src": "ENEM 2018 · Questão 177", "rate": null, "body": "<p>Devido ao não cumprimento das metas definidas para a campanha de vacinação contra a gripe comum e o vírus H1N1 em um ano, o Ministério da Saúde anunciou a prorrogação da campanha por mais uma semana. A tabela apresenta as quantidades de pessoas vacinadas dentre os cinco grupos de risco até a data de início da prorrogação da campanha</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-177-386a9f9b.webp\" width=\"333\" height=\"294\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual é a porcentagem do total de pessoas desses grupos de risco já vacinadas?", "opts": {"A": "12", "B": "18", "C": "30", "D": "40", "E": "50"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.c }),
  Object.assign({"id": "d1", "ph": "d", "year": 2023, "num": 137, "title": "Os 100 funcionários de uma empresa estão…", "src": "ENEM 2023 · Questão 137", "rate": null, "body": "<p>Os 100 funcionários de uma empresa estão distribuídos em dois setores: Produção e Administração.</p>\n<p>Os funcionários de um mesmo setor recebem salários com valores iguais. O quadro apresenta a quantidade de funcionários por setor e seus respectivos salários.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-137-fc161c5c.webp\" width=\"687\" height=\"199\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A média dos salários dos 100 funcionários dessa empresa, em real, é", "opts": {"A": "2.000,00.", "B": "2.500,00.", "C": "3.250,00.", "D": "4.500,00.", "E": "9.000,00."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d2", "ph": "d", "year": 2023, "num": 140, "title": "Uma empresa de transporte faz regularmente um…", "src": "ENEM 2023 · Questão 140", "rate": null, "body": "<p>Uma empresa de transporte faz regularmente um levantamento do número de viagens realizadas durante o dia por todos os 160 motoristas cadastrados em seu aplicativo. Em um certo dia, foi gerado um relatório, por meio de um gráfico de barras, no qual se relacionaram a quantidade de motoristas com a quantidade de viagens realizadas até aquele instante do dia.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-140-846c1155.webp\" width=\"497\" height=\"270\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Comparando os valores da média, da mediana e da moda da distribuição das quantidades de viagens realizadas pelos motoristas cadastrados nessa empresa, obtém-se", "opts": {"A": "Mediana = média &lt; moda.", "B": "Mediana = moda &lt; média.", "C": "Mediana &lt; média &lt; moda.", "D": "Moda &lt; média &lt; mediana.", "E": "Moda &lt; mediana &lt; média."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d3", "ph": "d", "year": 2023, "num": 152, "title": "A exposição a alguns níveis sonoros pode causar…", "src": "ENEM 2023 · Questão 152", "rate": null, "body": "<p>A exposição a alguns níveis sonoros pode causar lesões auditivas. Por isso, em uma indústria, são adotadas medidas preventivas de acordo com a máquina que o funcionário opera e o nível <i>N</i> de intensidade do som, medido em decibel (dB), a que o operário é exposto, sendo</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-152-30b0ee85.webp\" width=\"300\" height=\"42\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>, <i>I</i> a intensidade do som e <img class=\"enem-inline\" src=\"img/2023-152-40f43a4f.webp\" width=\"232\" height=\"47\" alt=\"\" loading=\"lazy\">.</p>\n<p class=\"src-note\">Disponível em: www.sofisica.com.br. Acesso em: 8 jul. 2015 (adaptado).</p>\n<p>Quando o som é considerado baixo, ou seja, <i>N</i> = 48 dB ou menos, deve ser utilizada a medida preventiva I. No caso de o som ser moderado, quando <i>N</i> está no intervalo (48 dB, 55 dB), deve ser utilizada a medida preventiva II. Quando o som é moderado alto, que equivale a <i>N</i> no intervalo (55 dB, 80 dB), a medida preventiva a ser usada é a III. Se <i>N</i> estiver no intervalo (80 dB, 115 dB), quando o som é considerado alto, deve ser utilizada a medida preventiva IV. E se o som é considerado muito alto, com <i>N</i> maior que 115 dB, deve-se utilizar a medida preventiva V.  <br>Uma nova máquina, com <img class=\"enem-inline\" src=\"img/2023-152-13f26008.webp\" width=\"241\" height=\"37\" alt=\"\" loading=\"lazy\">, foi adquirida e será classificada de acordo com o nível de ruído que produz.  <br>Considere 0,3 como aproximação para <img class=\"enem-inline\" src=\"img/2023-152-717fdd2f.webp\" width=\"93\" height=\"44\" alt=\"\" loading=\"lazy\">.</p>", "ask": "O funcionário que operará a nova máquina deverá adotar a medida preventiva", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d4", "ph": "d", "year": 2023, "num": 153, "title": "Um supermercado conta com cinco caixas disponíveis…", "src": "ENEM 2023 · Questão 153", "rate": null, "body": "<p>Um supermercado conta com cinco caixas disponíveis para pagamento. Foram instaladas telas que apresentam o tempo médio gasto por cada caixa para iniciar e finalizar o atendimento de cada cliente, e o número de pessoas presentes na fila de cada caixa em tempo real. Um cliente, na hora de passar sua compra, sabendo que cada um dos cinco caixas iniciará um novo atendimento naquele momento, pretende gastar o menor tempo possível de espera na fila. Ele observa que as telas apresentavam as informações a seguir.  <br>• Caixa I: atendimento 12 minutos, 5 pessoas na fila.  <br>• Caixa II: atendimento 6 minutos, 9 pessoas na fila.  <br>• Caixa III: atendimento 5 minutos, 6 pessoas na fila.  <br>• Caixa IV: atendimento 15 minutos, 2 pessoas na fila.  <br>• Caixa V: atendimento 9 minutos, 3 pessoas na fila.</p>", "ask": "Para alcançar seu objetivo, o cliente deverá escolher o caixa", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d5", "ph": "d", "year": 2023, "num": 157, "title": "Um professor, para promover a aprendizagem dos…", "src": "ENEM 2023 · Questão 157", "rate": null, "body": "<p>Um professor, para promover a aprendizagem dos estudantes em estatística, propôs uma atividade. O objetivo era verificar o percentual de estudantes com massa corporal abaixo da média e altura acima da média de um grupo de estudantes. Para isso, usando uma balança e uma fita métrica, avaliou uma amostra de dez estudantes, anotando as medidas observadas. O gráfico apresenta a massa corporal, em quilograma, e a altura, em metro, obtidas na atividade</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-157-13cfbc97.webp\" width=\"420\" height=\"230\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Após a coleta dos dados, os estudantes calcularam a média dos valores obtidos, referentes à massa corporal e à altura, obtendo, respectivamente, 80 kg e 1,65 m.</p>", "ask": "Qual é o percentual de estudantes dessa amostra com massa corporal abaixo da média e altura acima da média?", "opts": {"A": "10", "B": "20", "C": "30", "D": "50", "E": "70"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d6", "ph": "d", "year": 2023, "num": 164, "title": "O gráfico expõe alguns números da gripe A-H1N1.", "src": "ENEM 2023 · Questão 164", "rate": null, "body": "<p>O gráfico expõe alguns números da gripe A-H1N1. Entre as categorias que estão em processo de imunização, uma já está completamente imunizada, a dos trabalhadores da saúde.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-164-194cf28a.webp\" width=\"1100\" height=\"397\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Época, 26 abr. 2010 (adaptado).</p>", "ask": "De acordo com o gráfico, entre as demais categorias, a que está mais exposta ao vírus da gripe A-H1N1 é a categoria de", "opts": {"A": "Indígenas.", "B": "Gestantes.", "C": "Doentes crônicos.", "D": "Adultos entre 20 e 29 anos.", "E": "Crianças de 6 meses a 2 anos."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d7", "ph": "d", "year": 2022, "num": 138, "title": "O gráfico apresenta os totais de receitas e…", "src": "ENEM 2022 · Questão 138", "rate": null, "body": "<p>O gráfico apresenta os totais de receitas e despesas de uma empresa, expressos em milhão de reais, no  <br>decorrer dos meses de um determinado ano. A empresa obtém lucro quando a diferença entre receita e despesa é positiva e tem prejuízo quando essa diferença é negativa.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-138-d738a15a.webp\" width=\"581\" height=\"446\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual é a mediana, em milhão de reais, dos valores dos lucros apurados pela empresa nesse ano?", "opts": {"A": "1,5", "B": "2,0", "C": "2,9", "D": "3,0", "E": "5,5"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d8", "ph": "d", "year": 2022, "num": 149, "title": "Uma das informações que pode auxiliar no…", "src": "ENEM 2022 · Questão 149", "rate": null, "body": "<p>Uma das informações que pode auxiliar no dimensionamento do número de pediatras que devem atender em uma Unidade Básica de Saúde (UBS) é o número que representa a mediana da quantidade de crianças por família existente na região sob sua responsabilidade. O quadro mostra a distribuição das frequências do número de crianças por família na região de responsabilidade de uma UBS.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-149-d92eba46.webp\" width=\"510\" height=\"258\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "O número que representa a mediana da quantidade de crianças por família nessa região é", "opts": {"A": "1,0.", "B": "1,5.", "C": "1,9.", "D": "2,1.", "E": "2,5."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d9", "ph": "d", "year": 2022, "num": 162, "title": "Uma loja de roupas fixou uma meta de vendas de 77…", "src": "ENEM 2022 · Questão 162", "rate": null, "body": "<p>Uma loja de roupas fixou uma meta de vendas de 77 000 reais para um determinado mês de 30 dias. O gráfico mostra o volume de vendas dessa loja, em real, nos dez primeiros dias do mês e entre o dia dez e o dia vinte desse mês, nos seus dois únicos setores (infantil e adulto). Suponha que a variação no volume de vendas, para o período registrado, tenha se dado de forma linear, como mostrado no gráfico, e que essa tendência se mantenha a mesma para os próximos dez dias.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-162-0942383a.webp\" width=\"304\" height=\"157\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Ao final do trigésimo dia, quanto faltará no volume de vendas, em real, para que a meta fixada para o mês seja alcançada?", "opts": {"A": "5 000", "B": "7 000", "C": "11 000", "D": "18 000", "E": "29 000"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d10", "ph": "d", "year": 2022, "num": 171, "title": "Nos cinco jogos finais da última temporada, com uma…", "src": "ENEM 2022 · Questão 171", "rate": null, "body": "<p>Nos cinco jogos finais da última temporada, com uma média de 18 pontos por jogo, um jogador foi eleito o melhor do campeonato de basquete. Na atual temporada, cinco jogadores têm a chance de igualar ou melhorar essa média. No quadro estão registradas as pontuações desses cinco jogadores nos quatro primeiros jogos das finais deste ano.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-171-45b098d3.webp\" width=\"510\" height=\"202\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O quinto e último jogo será realizado para decidir a equipe campeã e qual o melhor jogador da temporada.</p>", "ask": "O jogador que precisa fazer a menor quantidade de pontos no quinto jogo, para igualar a média de pontos do melhor jogador da temporada passada, é o", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d11", "ph": "d", "year": 2021, "num": 139, "title": "Uma rede de hamburgueria tem três franquias em…", "src": "ENEM 2021 · Questão 139", "rate": null, "body": "<p>Uma rede de hamburgueria tem três franquias em  <br>cidades distintas. Visando incluir um novo tipo de lanche  <br>no cardápio, o gerente de marketing da rede sugeriu que  <br>fossem colocados à venda cinco novos tipos de lanche,  <br>em edições especiais. Os lanches foram oferecidos pelo  <br>mesmo período de tempo em todos os franqueados,  <br>O tipo que apresentasse a maior média por franquia  <br>seria incluído definitivamente no cardápio. Terminado o  <br>período de experiência, a gerência recebeu um relatório  <br>descrevendo as quantidades vendidas, em unidade, de  <br>cada um dos cinco tipos de lanche nas três franquias</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-139-0c2cb7d1.webp\" width=\"337\" height=\"115\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Com base nessas informações, a gerência decidiu incluir no cardápio o lanche de tipo", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d12", "ph": "d", "year": 2021, "num": 140, "title": "Uma grande rede de supermercados adota um sistema…", "src": "ENEM 2021 · Questão 140", "rate": null, "body": "<p>Uma grande rede de supermercados adota um sistema de avaliação dos faturamentos de suas filiais, considerando a média de faturamento mensal em milhão. A matriz da rede paga uma comissão para os representantes dos supermercados que atingirem uma média de faturamento mensal (<i>M</i>), conforme apresentado no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-140-cbdf6628.webp\" width=\"621\" height=\"261\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Um supermercado da rede obteve os faturamentos num dado ano, conforme apresentado no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-140-8211832d.webp\" width=\"616\" height=\"293\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nas condições apresentadas, os representantes desse supermercado avaliam que receberão, no ano seguinte a comissão de tipo", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d13", "ph": "d", "year": 2021, "num": 144, "title": "Uma pessoa realizou uma pesquisa com alguns alunos…", "src": "ENEM 2021 · Questão 144", "rate": null, "body": "<p>Uma pessoa realizou uma pesquisa com alguns alunos de uma escola, coletando suas idades, e organizou esses dados no gráfico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-144-0f754876.webp\" width=\"303\" height=\"304\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual é a média das idades, em ano, desses alunos?", "opts": {"A": "9", "B": "12", "C": "18", "D": "19", "E": "27"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d14", "ph": "d", "year": 2021, "num": 146, "title": "Um zootecnista pretende testar se uma nova ração…", "src": "ENEM 2021 · Questão 146", "rate": null, "body": "<p>Um zootecnista pretende testar se uma nova ração  <br>para coelhos é mais eficiente do que a que ele vem  <br>utilizando atualmente. A ração atual proporciona uma  <br>massa média de 10 kg por coelho, com um desvio padrão  <br>de 1 kg, alimentado com essa ração durante um período  <br>de três meses.  <br>O zootecnista selecionou uma amostra de coelhos e  <br>os alimentou com a nova ração pelo mesmo período de  <br>tempo. Ao final, anotou a massa de cada coelho, obtendo  <br>um desvio padrão de 1,5 kg para a distribuição das  <br>massas dos coelhos dessa amostra.  <br>Para avaliar a eficiência dessa ração, ele utilizará  <br>o coeficiente de variação (CV) que é uma medida de  <br>dispersão definida por CV =S/X, em que s representa o  <br>desvio padrão X, a média das massas dos coelhos que  <br>foram alimentados com uma determinada ração.  <br>O zootecnista substituirá a ração que vinha utilizando  <br>pela nova, caso o coeficiente de variação da distribuição  <br>das massas dos coelhos que foram alimentados com a  <br>nova ração for menor do que o coeficiente de variação  <br>da distribuição das massas dos coelhos que foram  <br>alimentados com a ração atual.</p>", "ask": "A substituição da ração ocorrerá se a média da distribuição das massas dos coelhos da amostra, em quilograma, for superior", "opts": {"A": "5,0.", "B": "9,5.", "C": "10,0.", "D": "10,5.", "E": "15,0."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d15", "ph": "d", "year": 2021, "num": 147, "title": "A Cifra de César é um exemplo de um método de…", "src": "ENEM 2021 · Questão 147", "rate": null, "body": "<p>A Cifra de César é um exemplo de um método de codificação de mensagens usado por Júlio César para se comunicar com seus generais.  <br>No método, cada letra era trocada por uma letra que aparecia no alfabeto um número fixo de casas adiante (ou atrás) de forma cíclica. A seguir temos um exemplo em que cada letra é substituída pela que vem três posições à frente.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-147-114ddf31.webp\" width=\"893\" height=\"62\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Para quebrar um código como esse, a análise de frequências das letras de um texto é uma ferramenta importante.  <br>Uma análise do texto do romance O guarani, de José de Alencar, que é composto por 491 631 letras, gerou o seguinte gráfico de frequências:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-147-a5256e30.webp\" width=\"847\" height=\"417\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Após codificar esse texto com a regra do exemplo fornecido, faz-se nova analise de frequência no texto codificado.<br>As quatro letras mais frequentes, em ordem decrescente de frequência, do texto codificado são", "opts": {"A": "A,E,O e S.", "B": "D, E, F e G.", "C": "D, E, F e G.", "D": "D,H,R e V.", "E": "X, B L e P."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d16", "ph": "d", "year": 2021, "num": 148, "title": "O quadro apresenta o número de terremotos de…", "src": "ENEM 2021 · Questão 148", "rate": null, "body": "<p>O quadro apresenta o número de terremotos de magnitude maior ou igual a 7, na escala de Richter, ocorridos em nosso planeta nos anos 2000 e 2011.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-148-4e954c86.webp\" width=\"851\" height=\"81\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Um pesquisador acredita que a mediana representa bem o número anual típico de terremotos em um período. Segundo esse pesquisador, o número anual típico de terremotos de magnitude maior ou igual a 7 é", "opts": {"A": "11.", "B": "15.", "C": "15,5.", "D": "15,7.", "E": "17,5."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d17", "ph": "d", "year": 2021, "num": 151, "title": "Um casal está planejando comprar um apartamento de…", "src": "ENEM 2021 · Questão 151", "rate": null, "body": "<p>Um casal está planejando comprar um apartamento  <br>de dois quartos num bairro de uma cidade e consultou  <br>a página de uma corretora de imóveis, encontrando  <br>105 apartamentos de dois quartos à venda no bairro  <br>desejado. Eles usaram um aplicativo da corretora para  <br>gerar a distribuição dos preços do conjunto de imóveis  <br>selecionados.  <br>O gráfico ilustra a distribuição de frequências dos  <br>preços de venda dos apartamentos dessa lista (em  <br>mil reais), no qual as faixas de preço são dadas por  <br>\\]300, 400\\], \\]400, 5001, \\]500, 600\\], \\]00, 700\\], \\]700, 800\\],  <br>\\]800, 900\\], \\]900, 1 000\\], \\]1 000, 1 100\\], \\]1 100, 1 200\\] e  <br>\\]1 200, 1 300\\].  <br>A mesma corretora anuncia que cerca de 50% dos  <br>apartamentos de dois quartos nesse bairro, publicados  <br>em sua página, têm preço de venda inferior a 550 mil reais.  <br>No entanto, o casal achou que essa última informação  <br>não era compatível com o gráfico obtido.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-151-53a174a0.webp\" width=\"431\" height=\"334\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Com base no gráfico obtido, o menor preço, p (em mil reais), para o qual pelo menos 50% dos apartamentos apresenta preço inferior a p", "opts": {"A": "600.", "B": "700.", "C": "800.", "D": "900.", "E": "1000."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d18", "ph": "d", "year": 2021, "num": 157, "title": "Uma construtora, pretendendo investir na construção…", "src": "ENEM 2021 · Questão 157", "rate": null, "body": "<p>Uma construtora, pretendendo investir na construção de imóveis em uma metrópole com cinco grandes regiões, fez uma pesquisa sobre a quantidade de famílias que mudaram de uma região para outra, de modo a determinar qual região foi o destino do maior fluxo de famílias, sem levar em consideração o número de famílias que deixaram a região. Os valores da pesquisa estão dispostos em uma matriz A = <img class=\"enem-inline\" src=\"img/2021-157-8c6e4e74.webp\" width=\"66\" height=\"61\" alt=\"\" loading=\"lazy\">, i, j <img class=\"enem-inline\" src=\"img/2021-157-be8d14c5.webp\" width=\"27\" height=\"46\" alt=\"\" loading=\"lazy\"> {1, 2, 3, 4, 5}, em que o elemento <img class=\"enem-inline\" src=\"img/2021-157-d9158cca.webp\" width=\"66\" height=\"61\" alt=\"\" loading=\"lazy\"> corresponde ao total de famílias (em dezena) que se mudaram da região i para a região j durante um certo período, e o elemento <img class=\"enem-inline\" src=\"img/2021-157-9e0b26da.webp\" width=\"48\" height=\"51\" alt=\"\" loading=\"lazy\"> é considerado nulo, uma vez que somente são consideradas mudanças entre regiões distintas. A seguir, está apresentada a matriz com os dados da pesquisa.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-157-7d732410.webp\" width=\"466\" height=\"334\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual região foi selecionada para o investimento da construtora?", "opts": {"A": "1", "B": "2", "C": "3", "D": "4", "E": "5"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d19", "ph": "d", "year": 2020, "num": 156, "title": "O gerente de uma loja de cosméticos colocou à venda…", "src": "ENEM 2020 · Questão 156", "rate": null, "body": "<p>O gerente de uma loja de cosméticos colocou à venda cinco diferentes tipos de perfume, tendo em estoque na loja as mesmas quantidades de cada um deles. O setor de controle de estoque encaminhou ao gerente registros gráficos descrevendo os preços unitários de cada perfume, em real, e a quantidade vendida de cada um deles, em percentual, ocorrida no mês de novembro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-156-8a18ed35.webp\" width=\"580\" height=\"415\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-156-0628f04c.webp\" width=\"403\" height=\"297\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Dados a chegada do final de ano e o aumento das vendas, a gerência pretende aumentar a quantidade estocada do perfume do tipo que gerou a maior arrecadação em espécie, em real, no mês de novembro.</p>", "ask": "Nessas condições, qual o tipo de perfume que deverá ter maior reposição no estoque?", "opts": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d20", "ph": "d", "year": 2020, "num": 165, "title": "O técnico de um time de basquete pretende aumentar…", "src": "ENEM 2020 · Questão 165", "rate": null, "body": "<p>O técnico de um time de basquete pretende aumentar a estatura média de sua equipe de 1,93 m para, no mínimo, 1,99 m. Para tanto, dentre os 15 jogadores que fazem parte de sua equipe, irá substituir os quatro mais baixos, de estaturas: 1,78 m, 1,82 m, 1,84 m e 1,86 m. Para isso, o técnico contratou um novo jogador de 2,02 m. Os outros três jogadores que ele ainda precisa contratar devem satisfazer à sua necessidade de aumentar a média das estaturas da equipe. Ele fixará a média das estaturas para os três jogadores que ainda precisa contratar dentro do critério inicialmente estabelecido.</p>", "ask": "Qual deverá ser a média mínima das estaturas, em metro, que ele deverá fixar para o grupo de três novos jogadores que ainda irá contratar?", "opts": {"A": "1,96", "B": "1,98", "C": "2,05", "D": "2,06", "E": "2,08"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d21", "ph": "d", "year": 2020, "num": 178, "title": "Suponha que uma equipe de corrida de automóveis…", "src": "ENEM 2020 · Questão 178", "rate": null, "body": "<p>Suponha que uma equipe de corrida de automóveis disponha de cinco tipos de pneu (I, II, III, IV, V), em que o fator de eficiência climática EC (índice que fornece o comportamento do pneu em uso, dependendo do clima) é apresentado:</p>\n<p>*   EC do pneu I: com chuva 6, sem chuva 3;<br>*   EC do pneu II: com chuva 7, sem chuva –4;<br>*   EC do pneu III: com chuva –2, sem chuva 10;<br>*   EC do pneu IV: com chuva 2, sem chuva 8;<br>*   EC do pneu V: com chuva –6, sem chuva 7.</p>\n<p>O coeficiente de rendimento climático (CRC) de um pneu é calculado como a soma dos produtos dos fatores de EC, com ou sem chuva, pelas correspondentes probabilidades de se ter tais condições climáticas: ele é utilizado para determinar qual pneu deve ser selecionado para uma dada corrida, escolhendo-se o pneu que apresentar o maior CRC naquele dia. No dia de certa corrida, a probabilidade de chover era de 70% e o chefe da equipe calculou o CRC de cada um dos cinco tipos de pneu.</p>", "ask": "O pneu escolhido foi", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d22", "ph": "d", "year": 2020, "num": 180, "title": "Com o objetivo de contratar uma empresa responsável…", "src": "ENEM 2020 · Questão 180", "rate": null, "body": "<p>Com o objetivo de contratar uma empresa responsável pelo serviço de atendimento ao público, os executivos de uma agência bancária realizaram uma pesquisa de satisfação envolvendo cinco empresas especializadas nesse segmento. Os procedimentos analisados (com pesos que medem sua importância para a agência) e as respectivas notas que cada empresa recebeu estão organizados no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-180-8948b408.webp\" width=\"438\" height=\"252\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A agência bancária contratará a empresa com a maior média ponderada das notas obtidas nos procedimentos analisados.</p>", "ask": "Após a análise dos resultados da pesquisa de satisfação, os executivos da agência bancária contrataram a empresa", "opts": {"A": "X.", "B": "Y.", "C": "Z.", "D": "W.", "E": "T."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d23", "ph": "d", "year": 2019, "num": 160, "title": "O preparador físico de um time de basquete dispõe…", "src": "ENEM 2019 · Questão 160", "rate": null, "body": "<p>O preparador físico de um time de basquete dispõe de um plantel de 20 jogadores, com média de altura igual a 1,80 m.  <br>No último treino antes da estreia em um campeonato, um dos jogadores desfalcou o time em razão de uma séria contusão, forçando o técnico a contratar outro jogador para recompor o grupo.</p>", "ask": "Se o novo jogador é 0,20 m mais baixo que o anterior, qual é a média de altura, em metro, do novo grupo?", "opts": {"A": "1,60.", "B": "1,78.", "C": "1,79.", "D": "1,81.", "E": "1,82."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d24", "ph": "d", "year": 2019, "num": 161, "title": "Em uma fábrica de refrigerantes, é necessário que…", "src": "ENEM 2019 · Questão 161", "rate": null, "body": "<p>Em uma fábrica de refrigerantes, é necessário que se faça periodicamente o controle no processo de engarrafamento para evitar que sejam envasadas garrafas fora da especificação do volume escrito no rótulo.</p>\n<p>Diariamente, durante 60 dias, foram anotadas as quantidades de garrafas fora dessas especificações. O resultado está apresentado no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-161-c315e1f9.webp\" width=\"543\" height=\"163\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A média diária de garrafas fora das especificações no período considerado é", "opts": {"A": "0,1", "B": "0,2", "C": "1,5", "D": "2,0", "E": "3,0"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d25", "ph": "d", "year": 2019, "num": 163, "title": "O Índice de Desenvolvimento Humano (IDH) é uma…", "src": "ENEM 2019 · Questão 163", "rate": null, "body": "<p>O Índice de Desenvolvimento Humano (IDH) é uma medida usada para classificar os países pelo seu grau de desenvolvimento.  <br>Para seu cálculo, são levados em consideração a expectativa de vida ao nascer, tempo de escolaridade e renda per capita, entre outros.</p>\n<p>O menor valor deste índice é zero e o maior é um. Cinco países foram avaliados e obtiveram os seguintes índices de desenvolvimento humano: o primeiro país recebeu um valor X, o segundo <img class=\"enem-inline\" src=\"img/2019-163-5bbf1fd4.webp\" width=\"34\" height=\"25\" alt=\"\" loading=\"lazy\">, o terceiro <img class=\"enem-inline\" src=\"img/2019-163-a47ac92d.webp\" width=\"32\" height=\"30\" alt=\"\" loading=\"lazy\">, o quarto X² e o último X³. Nenhum desses países zerou ou atingiu o índice máximo.</p>", "ask": "Qual desses países obteve o maior IDH?", "opts": {"A": "O primeiro.", "B": "O segundo.", "C": "O terceiro.", "D": "O quarto.", "E": "O quinto."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d26", "ph": "d", "year": 2019, "num": 169, "title": "Um aplicativo de relacionamentos funciona da…", "src": "ENEM 2019 · Questão 169", "rate": null, "body": "<p>Um aplicativo de relacionamentos funciona da seguinte forma: o usuário cria um perfil com foto e informações pessoais, indica as características dos usuários com quem deseja estabelecer contato e determina um raio de abrangência a partir da sua localização. O aplicativo identifica as pessoas que se encaixam no perfil desejado e que estão a uma distância do usuário menor ou igual ao raio de abrangência. Caso dois usuários tenham perfis compatíveis e estejam numa região de abrangência comum a ambos, o aplicativo promove o contato entre os usuários, o que é chamado de <i>match</i>.</p>\n<p>O usuário P define um raio de abrangência com medida de 3 km e busca ampliar a possibilidade de obter um <i>match</i> se deslocando para a região central da cidade, que concentra um maior número de usuários. O gráfico ilustra alguns bares que o usuário P costuma frequentar para ativar o aplicativo, indicados por I, II, III, IV e V.</p>\n<p>Sabe-se que os usuários Q, R e S, cujas posições estão descritas pelo gráfico, são compatíveis com o usuário P, e que estes definiram raios de abrangência respectivamente iguais a 3 km, 2 km e 5 km.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-169-ff47c4f5.webp\" width=\"571\" height=\"482\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Com base no gráfico e nas afirmações anteriores, em qual bar o usuário P teria a possibilidade de um match com os usuários R, R e S, simultaneamente?", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d27", "ph": "d", "year": 2019, "num": 174, "title": "A taxa de urbanização de um município é dada pela…", "src": "ENEM 2019 · Questão 174", "rate": null, "body": "<p>A taxa de urbanização de um município é dada pela razão entre a população urbana e a população total do município (isto é, a soma das populações rural e urbana).</p>\n<p>Os gráficos apresentam, respectivamente, a população urbana e a população rural de cinco municípios (I, II, III, IV, V) de uma mesma região estadual. Em reunião entre o governo do estado e os prefeitos desses municípios, ficou acordado que o município com maior taxa de urbanização receberá um investimento extra em infraestrutura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-174-0daf8f71.webp\" width=\"690\" height=\"189\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Segundo o acordo, qual município receberá o investimento extra?", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d28", "ph": "d", "year": 2018, "num": 136, "title": "A Transferência Eletrônica Disponível (TED) é uma…", "src": "ENEM 2018 · Questão 136", "rate": null, "body": "<p>A Transferência Eletrônica Disponível (TED) é uma transação financeira de valores entre diferentes bancos. Um economista decide analisar os valores enviados por meio de TEDs entre cinco bancos (1, 2, 3, 4 e 5) durante um mês. Para isso, ele dispõe esses  valores em uma matriz A = \\[aij\\], em que <img class=\"enem-inline\" src=\"img/2018-136-23c2a29c.webp\" width=\"67\" height=\"14\" alt=\"\" loading=\"lazy\"> e <img class=\"enem-inline\" src=\"img/2018-136-c8fdaeee.webp\" width=\"67\" height=\"16\" alt=\"\" loading=\"lazy\">, e o elemento aij corresponde ao total proveniente das operações feitas via TED, em milhão de real, transferidos do banco <i>i</i> para o banco <i>j</i> durante o mês. Observe que os elementos a_ij_ \\= 0, uma vez que TED é uma transferência entre bancos distintos. Esta é a matriz obtida para essa análise:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-136-d3c26019.webp\" width=\"142\" height=\"106\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Com base nessas informações, o banco que transferiu a maior quantia via TED é o banco", "opts": {"A": "1.", "B": "2.", "C": "3.", "D": "4.", "E": "5."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d29", "ph": "d", "year": 2018, "num": 145, "title": "A Comissão Interna de Prevenção de Acidentes (CIPA)…", "src": "ENEM 2018 · Questão 145", "rate": null, "body": "<p>A Comissão Interna de Prevenção de Acidentes (CIPA) de uma empresa,  observando os altos custos com os frequentes acidentes de trabalho ocorridos, fez, a pedido da diretoria, uma pesquisa do número de acidentes sofridos por funcionários. Essa pesquisa, realizada com uma amostra de 100 funcionários, norteará as ações da empresa na política de segurança no trabalho.  <br>Os resultados obtidos estão no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-145-bc57dd00.webp\" width=\"338\" height=\"172\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A média do número de acidentes por funcionário na amostra que a CIPA apresentará à diretoria da empresa é", "opts": {"A": "0,15.", "B": "0,30.", "C": "0,50.", "D": "1,11.", "E": "2,22."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d30", "ph": "d", "year": 2018, "num": 160, "title": "De acordo com um relatório recente da Agência…", "src": "ENEM 2018 · Questão 160", "rate": null, "body": "<p>De acordo com um relatório recente da Agência Internacional de Energia (AIE), o mercado de veículos elétricos atingiu um novo marco em 2016, quando foram vendidos mais de 750 mil automóveis da categoria. Com isso, o total de carros elétricos vendidos no mundo alcançou a marca de 2 milhões de unidades desde que os primeiros modelos começaram a ser comercializados em 2011. No Brasil, a expansão das vendas também se verifica. A marca A, por exemplo, expandiu suas vendas no ano de 2016, superando em 360 unidades as vendas de 2015, conforme representado no gráfico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-160-f5d1ad10.webp\" width=\"339\" height=\"186\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A média anual do número de carros vendidos pela marca A, nos anos representados no gráfico, foi de", "opts": {"A": "192.", "B": "240.", "C": "252.", "D": "320.", "E": "420."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d31", "ph": "d", "year": 2018, "num": 166, "title": "Os alunos da disciplina de estatística, em um curso…", "src": "ENEM 2018 · Questão 166", "rate": null, "body": "<p>Os alunos da disciplina de estatística, em um curso universitário, realizam quatro avaliações por semestre com os pesos de 20%, 10%, 30% e 40%, respectivamente.  <br>No final do semestre, precisam obter uma média nas quatro avaliações de, no mínimo, 60 pontos para serem aprovados. Um estudante dessa disciplina obteve os seguintes pontos nas três primeiras avaliações: 46, 60 e 50, respectivamente.</p>", "ask": "O mínimo de pontos que esse estudante precisa obter na quarta avaliação para ser aprovado é", "opts": {"A": "29,8.", "B": "71,0.", "C": "74,5.", "D": "75,5.", "E": "84,0."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d32", "ph": "d", "year": 2018, "num": 168, "title": "A raiva é uma doença viral e infecciosa,…", "src": "ENEM 2018 · Questão 168", "rate": null, "body": "<p>A raiva é uma doença viral e infecciosa, transmitida por mamíferos. A campanha nacional de vacinação antirrábica tem o objetivo de controlar a circulação do vírus da raiva canina e felina, prevenindo a raiva humana. O gráfico mostra a cobertura (porcentagem de vacinados) da campanha, em cães, nos anos de 2013, 2015 e 2017, no município de Belo Horizonte, em Minas Gerais. Os valores das coberturas dos anos de 2014 e 2016 não estão informados no gráfico e deseja-se estimá-los. Para tal, levou-se em consideração que a variação na cobertura de vacinação da campanha antirrábica, nos períodos de 2013 a 2015 e de 2015 a 2017, deu-se de forma linear.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-168-cc2d3b70.webp\" width=\"335\" height=\"145\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual teria sido a cobertura dessa campanha no ano de 2014?", "opts": {"A": "62,3%", "B": "63,0%", "C": "63,5%", "D": "64,0%", "E": "65,5%"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "d33", "ph": "d", "year": 2018, "num": 172, "title": "Na teoria das eleições, o Método de Borda sugere…", "src": "ENEM 2018 · Questão 172", "rate": null, "body": "<p>Na teoria das eleições, o Método de Borda sugere que, em vez de escolher um candidato, cada juiz deve criar um <i>ranking</i> de sua preferência para os concorrentes (isto é, criar uma lista com a ordem de classificação dos concorrentes). A este ranking é associada uma pontuação: um ponto para o último colocado no <i>ranking</i>, dois pontos para o penúltimo, três para o antepenúltimo, e assim sucessivamente. Ao final, soma-se a pontuação atribuída a cada concorrente por cada um dos juízes.</p>\n<p>Em uma escola houve um concurso de poesia no qual cinco alunos concorreram a um prêmio, sendo julgados por 25 juízes. Para a escolha da poesia vencedora foi utilizado o Método de Borda. Nos quadros, estão apresentados os <i>rankings</i> dos juízes e a frequência de cada <i>ranking</i>.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-172-36a8ea01.webp\" width=\"340\" height=\"274\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A poesia vencedora foi a de", "opts": {"A": "Edu.", "B": "Dani.", "C": "Caio.", "D": "Bia.", "E": "Ana."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.d }),
  Object.assign({"id": "e1", "ph": "e", "year": 2023, "num": 138, "title": "Visando atrair mais clientes, o gerente de uma loja…", "src": "ENEM 2023 · Questão 138", "rate": null, "body": "<p>Visando atrair mais clientes, o gerente de uma loja anunciou uma promoção em que cada cliente que realizar uma compra pode ganhar um voucher para ser usado em sua próxima compra. Para ganhar seu voucher, o cliente precisa retirar, ao acaso, uma bolinha de dentro de cada uma das duas urnas A e B disponibilizadas pelo gerente, nas quais há apenas bolinhas pretas e brancas. Atualmente, a probabilidade de se escolher, ao acaso, uma bolinha preta na urna A é igual a 20% e a probabilidade de se escolher uma bolinha preta na urna B é 25%. Ganha o voucher o cliente que retirar duas bolinhas pretas, uma de cada urna.</p>\n<p>Com o passar dos dias, o gerente percebeu que, para a promoção ser viável aos negócios, era preciso alterar a probabilidade de acerto do cliente sem alterar a regra da promoção. Para isso, resolveu alterar a quantidade de bolinhas brancas na urna B de forma que a probabilidade de um cliente ganhar o voucher passasse a ser menor ou igual a 1%. Sabe-se que a urna B tem 4 bolinhas pretas e que, em ambas as urnas, todas as bolinhas têm a mesma probabilidade de serem retiradas.</p>", "ask": "Qual é o número mínimo de bolinhas brancas que o gerente deve adicionar à urna B?", "opts": {"A": "20", "B": "60", "C": "64", "D": "68", "E": "80"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e2", "ph": "e", "year": 2023, "num": 160, "title": "Ao realizar o cadastro em um aplicativo de…", "src": "ENEM 2023 · Questão 160", "rate": null, "body": "<p>Ao realizar o cadastro em um aplicativo de investimentos, foi solicitado ao usuário que criasse uma senha, sendo permitido o uso somente dos seguintes caracteres:</p>\n<p>• algarismos de 0 a 9;</p>\n<p>• 26 letras minúsculas do alfabeto;</p>\n<p>• 26 letras maiúsculas do alfabeto;</p>\n<p>• 6 caracteres especiais !, @, #, $, \\*, &amp;.</p>\n<p>Três tipos de estruturas para senha foram apresentadas ao usuário:</p>\n<p>• tipo I: formada por quaisquer quatro caracteres distintos, escolhidos dentre os permitidos;</p>\n<p>• tipo II: formada por cinco caracteres distintos, iniciando por três letras, seguidas por um algarismo e, ao final, um caractere especial;</p>\n<p>• tipo III: formada por seis caracteres distintos, iniciando por duas letras, seguidas por dois algarismos e, ao final, dois caracteres especiais.</p>\n<p>Considere <img class=\"enem-inline\" src=\"img/2023-160-a2d565c2.webp\" width=\"113\" height=\"26\" alt=\"\" loading=\"lazy\"> as probabilidades de se descobrirem ao acaso, na primeira tentativa, as senhas dos tipos I, II e III, respectivamente.</p>", "ask": "Nessas condições, o tipo de senha que apresenta a menor probabilidade de ser descoberta ao acaso, na primeira tentativa, é o", "opts": {"A": "Tipo I, pois p1 &lt; p2 &lt; p3.", "B": "Tipo I, pois tem menor quantidade de caracteres.", "C": "Tipo II, pois tem maior quantidade de letras.", "D": "Tipo III, pois p3 &lt; p2 &lt; p1", "E": "Tipo III, pois tem maior quantidade de caracteres."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.e }),
  Object.assign({"id": "e3", "ph": "e", "year": 2023, "num": 168, "title": "Em um colégio público, a admissão no primeiro ano…", "src": "ENEM 2023 · Questão 168", "rate": null, "body": "<p>Em um colégio público, a admissão no primeiro ano se dá por sorteio. Neste ano há 55 candidatos, cujas inscrições são numeradas de 01 a 55. O sorteio de cada número de inscrição será realizado em etapas, utilizando-se duas urnas. Da primeira urna será sorteada uma bola, dentre bolas numeradas de 0 a 9, que representará o algarismo das unidades do número de inscrição a ser sorteado e, em seguida, da segunda urna, será sorteada uma bola para representar o algarismo das dezenas desse número. Depois do primeiro sorteio, e antes de se sortear o algarismo das dezenas, as bolas que estarão presentes na segunda urna serão apenas aquelas cujos números formam, com o algarismo já sorteado, um número de 01 a 55.</p>", "ask": "As probabilidades de os candidatos de inscrição número 50 e 02 serem sorteados são, respectivamente,", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-168-a5689a77.webp", 100, 58], "B": ["img/2023-168-67248715.webp", 119, 65], "C": ["img/2023-168-4d9a67e0.webp", 101, 57], "D": ["img/2023-168-24184847.webp", 135, 65], "E": ["img/2023-168-adeb932f.webp", 135, 63]}}, { hint: PH_HINT.e }),
