  Object.assign({"id": "a11", "ph": "a", "year": 2021, "num": 152, "title": "Para a comunicação entre dois navios é utilizado um…", "src": "ENEM 2021 · Questão 152", "rate": null, "body": "<p>Para a comunicação entre dois navios é utilizado um sistema de codificação com base em valores numéricos. Para isso, são consideradas as operações triângulo <img class=\"enem-inline\" src=\"img/2021-152-566c5d72.webp\" width=\"19\" height=\"25\" alt=\"\" loading=\"lazy\"> e estrela \\*, definidas sobre o conjunto dos números reais por x<img class=\"enem-inline\" src=\"img/2021-152-60957aae.webp\" width=\"19\" height=\"25\" alt=\"\" loading=\"lazy\">y = x² + xy – y² e x \\* y = xy + x.</p>\n<p>O navio que deseja enviar uma mensagem deve fornecer um valor de entrada b, que irá gerar um valor de saída, a ser enviado ao navio receptor, dado pela soma da duas maiores soluções da equação (a<img class=\"enem-inline\" src=\"img/2021-152-b78eb0e6.webp\" width=\"19\" height=\"25\" alt=\"\" loading=\"lazy\">b)\\*(b<img class=\"enem-inline\" src=\"img/2021-152-54a56c94.webp\" width=\"19\" height=\"25\" alt=\"\" loading=\"lazy\">a) = 0. Cada valor possível de entrada e saída representa uma mensagem diferente já conhecida pelos dois navios.</p>\n<p>Um navio deseja enviar ao outro a mensagem “ATENÇÃO!”. Para isso, deve utilizar o valor de entrada b=1.</p>", "ask": "Dessa forma, o valor recebido pelo navio receptor será", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2021-152-c1747ad2.webp", 37, 42], "B": ["img/2021-152-e3a76aed.webp", 46, 52], "C": ["img/2021-152-2340c837.webp", 37, 40], "D": ["img/2021-152-fc88fa35.webp", 90, 61], "E": ["img/2021-152-51026f4e.webp", 75, 67]}}, { hint: PH_HINT.a }),
  Object.assign({"id": "a12", "ph": "a", "year": 2021, "num": 160, "title": "Um nutricionista verificou, na dieta diária do seu…", "src": "ENEM 2021 · Questão 160", "rate": null, "body": "<p>Um  nutricionista verificou, na dieta diária do seu cliente, a falta de 800mg do mineral A, de 1 000 mg do mineral B e de 1 200 mg do mineral C. Por isso, recomendou a compra de suplementos alimentares que forneçam os minerais faltantes e informou que não haveria problema se consumisse mais desses minerais do que o recomendado.</p>\n<p>O cliente encontrou cinco suplementos, vendidos em sachês unitários, cujos preços e as quantidades dos minerais estão apresentados a seguir:</p>\n<p>*   Suplemento I: contém 50mg do mineral A, 100mg do mineral B e 200 mg do mineral C e custa R$2,00;<br>*   Suplemento II: contém 800mg do mineral A, 250mg do mineral B e 200 mg do mineral C e custa R$3,00;<br>*   Suplemento III: contém 250mg do mineral A, 1 000mg do mineral B e 300 mg do mineral C e custa R$5,00;<br>*   Suplemento IV: contém 600mg do mineral A, 500mg do mineral B e 1 000 mg do mineral C e custa R$6,00;<br>*   Suplemento V: contém 400mg do mineral A, 800mg do mineral B e 1 200 mg do mineral C e custa R$8,00;</p>\n<p>O cliente decidiu comprar sachês de um único suplemento no qual gastasse menos dinheiro e ainda suprisse a falta de minerais indicada pelo nutricionista, mesmo que consumisse alguns deles além de sua necessidade.</p>", "ask": "Nessas condições, o cliente deverá comprar sachês do suplemento", "opts": {"A": "I", "B": "II", "C": "III", "D": "IV", "E": "V"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a13", "ph": "a", "year": 2021, "num": 174, "title": "Após a consulta médica, um paciente deve seguir um…", "src": "ENEM 2021 · Questão 174", "rate": null, "body": "<p>Após a consulta médica, um paciente deve seguir um tratamento composto por três medicamentos: X, Y e Z. O paciente, para adquirir os três medicamentos, faz um orçamento em três farmácias diferentes, conforme o quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-174-a9b99537.webp\" width=\"416\" height=\"118\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Dessas farmácias, algumas oferecem descontos:</p>\n<p>*   na compra dos medicamentos X e Y na Farmácia 2, recebe-se um desconto de 20% em ambos os produtos, independentemente da compra do medicamento Z, e não há desconto para o medicamento Z;<br>*   na compra dos 3 medicamentos na Farmácia 3, recebe-se 20% de desconto no valor total da compra.</p>\n<p>O paciente deseja efetuar a compra de modo a minimizar duas despesa com os medicamentos.</p>", "ask": "De acordo com as informações fornecidas, o paciente deve comprar os medicamentos da seguinte forma:", "opts": {"A": "X, Y e Z na Farmácia 1.", "B": "X e Y na Farmácia 1, e Z na Farmácia 3.", "C": "X e Y na Farmácia 2, e Z na Farmácia 3.", "D": "X na Farmácia 2, e Y e Z na Farmácia 3.", "E": "X, Y e Z na Farmácia 3."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a14", "ph": "a", "year": 2021, "num": 176, "title": "O sistema de numeração romano ainda é utilizado na…", "src": "ENEM 2021 · Questão 176", "rate": null, "body": "<p>O sistema de numeração romano ainda é utilizado na indicação de capítulos e volumes de livros, na designação de séculos e, em ordem cronológica, de papas e reis de mesmo nome. São utilizadas sete letras do alfabeto:  <br>Quatro fundamentais: I (vale 1); X (vale 10); C (vale 100) e M (vale 1 000).  <br>Três secundárias: V (vale 5); L (vale 50); e D (vale 500).</p>\n<p>As regras para escrever números romanos são:  <br>1\\. Não existe símbolo correspondente ao zero;  <br>2\\. Os símbolos fundamentais podem ser repetidos até três vezes e seus valores são adicionados. Exemplo: XXX = 30;  <br>3\\. Uma letra posta à esquerda de outra de maior valor indica subtração dos respectivos valores. Exemplo: IX = 10 – 1 = 9;  <br>4\\. Uma letra posta à direita de outra de maior valor indica adição dos respectivos valores. Exemplo: XI = 10 + 1 = 11</p>\n<p>Em uma cidade europeia há uma placa indicando o ano de sua fundação: MCDLXIX.</p>", "ask": "Quantos anos de fundação essa cidade comemorará em 2050?", "opts": {"A": "379", "B": "381", "C": "579", "D": "581", "E": "601"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a15", "ph": "a", "year": 2021, "num": 177, "title": "Uma das bases mais utilizadas para representar um…", "src": "ENEM 2021 · Questão 177", "rate": null, "body": "<p>Uma das bases mais utilizadas para representar um número é a base decimal. Entretanto, os computadores trabalham com números na base binária. Nessa base, qualquer número natural é representado usando apenas os algarismos 0 e 1. Por exemplo, as representações dos números 9 e 12, na base binárias, são 1001 e 1100, respectivamente. A operação de adição, na base binária, segue um algoritmo similar ao utilizado na base decimal, como detalhado no quadro:</p>\n<p>Por exemplo, na base binária, a soma dos números 10 e 10 é 100, como apresentado:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-177-e82478b8.webp\" width=\"69\" height=\"84\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Considerando as informações do texto, o resultado da adição 9 + 12 será representado, na base binária, por", "opts": {"A": "101", "B": "1101", "C": "1111", "D": "10101", "E": "11001"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a16", "ph": "a", "year": 2020, "num": 141, "title": "Um hotel de 3 andares está sendo construído.", "src": "ENEM 2020 · Questão 141", "rate": null, "body": "<p>Um hotel de 3 andares está sendo construído. Cada andar terá 100 quartos. Os quartos serão numerados de 100 a 399 e cada um terá seu número afixado à porta. Cada número será composto por peças individuais, cada uma simbolizando um único algarismo.</p>", "ask": "Qual a quantidade mínima de peças, simbolizando o algarismo 2, necessárias para identificar o número de todos os quartos?", "opts": {"A": "160", "B": "157", "C": "130", "D": "120", "E": "60"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a17", "ph": "a", "year": 2020, "num": 154, "title": "Pesquisadores da Universidade de Tecnologia de…", "src": "ENEM 2020 · Questão 154", "rate": null, "body": "<p>Pesquisadores da Universidade de Tecnologia de Viena, na Áustria, produziram miniaturas de objetos em impressoras 3D de alta precisão. Ao serem ativadas, tais impressoras lançam feixes de laser sobre um tipo de resina, esculpindo o objeto desejado. O produto final da impressão é uma escultura microscópica de três dimensões, como visto na imagem ampliada.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-154-6dd0ecd2.webp\" width=\"348\" height=\"215\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A escultura apresentada é uma miniatura de um carro de Fórmula 1, com 100 micrômetros de comprimento. Um micrômetro é a milionésima parte de um metro.</p>", "ask": "Usando notação científica, qual é a representação do comprimento dessa miniatura, em metro?", "opts": {"A": "1,0 x 10-1", "B": "1,0 x 10-3", "C": "1,0 x 10-4", "D": "1,0 x 10-6", "E": "1,0 x 10-7"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a18", "ph": "a", "year": 2020, "num": 159, "title": "Uma pessoa precisa comprar 15 sacos de cimento para…", "src": "ENEM 2020 · Questão 159", "rate": null, "body": "<p>Uma pessoa precisa comprar 15 sacos de cimento para uma reforma em sua casa. Faz pesquisa de preço em cinco depósitos que vendem o cimento de sua preferência e cobram frete para entrega do material, conforme a distância do depósito à sua casa. As informações sobre preço do cimento, valor do frete e distância do depósito até a casa dessa pessoa estão apresentadas no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-159-e08bbc57.webp\" width=\"546\" height=\"282\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A pessoa escolherá um desses depósitos para realizar sua compra, considerando os preços do cimento e do frete oferecidos em cada opção.</p>", "ask": "Se a pessoa decidir pela opção mais econômica, o depósito escolhido para a realização dessa compra será o", "opts": {"A": "A.", "B": "B.", "C": "C.", "D": "D.", "E": "E."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a19", "ph": "a", "year": 2020, "num": 173, "title": "Pergolado é o nome que se dá a um tipo de cobertura…", "src": "ENEM 2020 · Questão 173", "rate": null, "body": "<p>Pergolado é o nome que se dá a um tipo de cobertura projetada por arquitetos, comumente em praças e jardins, para criar um ambiente para pessoas ou plantas, no qual há uma quebra da quantidade de luz, dependendo da posição do sol. É feito como um estrado de vigas iguais, postas paralelas e perfeitamente em fila, como ilustra a figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-173-b1116282.webp\" width=\"420\" height=\"331\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Um arquiteto projeta um pergolado com vãos de 30 cm de distância entre suas vigas, de modo que, no solstício de verão, a trajetória do sol durante o dia seja realizada num plano perpendicular à direção das vigas, e que o sol da tarde, no momento em que seus raios fizerem 30° com a posição a pino, gere a metade da luz que passa no pergolado ao meio-dia.</p>", "ask": "Para atender à proposta do projeto elaborado pelo arquiteto, as vigas do pergolado devem ser construídas de maneira que a altura, em centímetro, seja a mais próxima possível de", "opts": {"A": "9.", "B": "15.", "C": "26.", "D": "52.", "E": "60."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a20", "ph": "a", "year": 2019, "num": 140, "title": "A gripe é uma infecção respiratória aguda de…", "src": "ENEM 2019 · Questão 140", "rate": null, "body": "<p>A gripe é uma infecção respiratória aguda de curtaduração causada pelo vírus influenza. Ao entrar no nosso organismo pelo nariz, esse vírus multiplica-se, disseminando-se para a garganta e demais partes das vias respiratórias, incluindo os pulmões. O vírus influenza é uma partícula esférica que tem um diâmetro interno de 0,00011 mm.</p>\n<p class=\"src-note\"><i>Disponível em: www.gripenet.pt.</i></p>\n<p><i>Acesso em: 2 nov. 2013 (adaptado).</i></p>", "ask": "Em notação científica, o diâmetro interno do vírus influenza, em mm, é", "opts": {"A": "1,1x10−1", "B": "1,1x10−2", "C": "1,1x10−3", "D": "1,1x10−4", "E": "1,1x10−5"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a21", "ph": "a", "year": 2019, "num": 146, "title": "O serviço de meteorologia de uma cidade emite…", "src": "ENEM 2019 · Questão 146", "rate": null, "body": "<p>O serviço de meteorologia de uma cidade emite relatórios diários com a previsão do tempo. De posse dessas informações, a prefeitura emite três tipos de alertas para a população:</p>\n<p>• Alerta cinza: deverá ser emitido sempre que a previsão do tempo estimar que a temperatura será</p>\n<p>inferior a 10 °C, e a umidade relativa do ar for inferior a 40%;</p>\n<p>• Alerta laranja: deverá ser emitido sempre que a previsão do tempo estimar que a temperatura deve</p>\n<p>variar entre 35 °C e 40 °C, e a umidade relativa do ar deve ficar abaixo de 30%;</p>\n<p>• Alerta vermelho: deverá ser emitido sempre que a previsão do tempo estimar que a temperatura será superior a 40 ºC, e a umidade relativa do ar for inferior a 25%.</p>\n<p>Um resumo da previsão do tempo nessa cidade, para um período de 15 dias, foi apresentado no gráfico.</p>\n<p>Decorridos os 15 dias de validade desse relatório, um funcionário percebeu que, no período a que se refere o gráfico, foram emitidos os seguintes alertas:</p>\n<p>• Dia 1: alerta cinza;</p>\n<p>• Dia 12: alerta laranja;</p>\n<p>• Dia 13: alerta vermelho.</p>", "ask": "Em qual(is) desses dias o(s) aviso(s) foi(ram) emitido(s) corretamente?", "opts": {"A": "1.", "B": "12.", "C": "1 e 12.", "D": "1 e 13.", "E": "1, 12 e 13."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a22", "ph": "a", "year": 2019, "num": 155, "title": "Após o Fórum Nacional Contra a Pirataria (FNCP)…", "src": "ENEM 2019 · Questão 155", "rate": null, "body": "<p>Após o Fórum Nacional Contra a Pirataria (FNCP) incluir a linha de autopeças em campanha veiculada</p>\n<p>contra a falsificação, as agências fiscalizadoras divulgaram que os cinco principais produtos de autopeças falsificados são: rolamento, pastilha de freio, caixa de direção, catalisador e amortecedor.</p>\n<p><b>Disponível em:</b> www.oficinabrasil.com.br. Acesso em: 25 ago. 2014 (adaptado).</p>\n<p>Após uma grande apreensão, as peças falsas foram cadastradas utilizando-se a codificação</p>\n<p>1: rolamento, 2: pastilha de freio, 3: caixa de direção, 4: catalisador e 5: amortecedor.</p>\n<p>Ao final obteve-se a sequência; 5, 4, 3, 2, 1, 2, 3, 4, 5, 4, 3, 2, 1, 2, 3, 4, 5, 4, 3, 2, 1, 2, 3, 4,… que apresenta um padrão de formação que consiste na repetição de um bloco de números.</p>\n<p>Essa sequência descreve a ordem em que os produtos apreendidos foram cadastrados.</p>", "ask": "O 2.015º. item cadastrado foi um(a)", "opts": {"A": "Rolamento.", "B": "Catalisador.", "C": "Amortecedor.", "D": "Pastilha de freio.", "E": "Caixa de direção."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a23", "ph": "a", "year": 2019, "num": 159, "title": "O dono de um restaurante situado às margens de uma…", "src": "ENEM 2019 · Questão 159", "rate": null, "body": "<p>O dono de um restaurante situado às margens de uma rodovia percebeu que, ao colocar uma placa de propaganda de seu restaurante ao longo da rodovia, as vendas aumentaram. Pesquisou junto aos seus clientes e concluiu que a probabilidade de um motorista perceber uma placa de anúncio é 1/2.</p>\n<p>Com isso, após autorização do órgão competente, decidiu instalar novas placas com anúncios de seu restaurante ao longo dessa rodovia, de maneira que a probabilidade de um motorista perceber pelo menos uma das placas instaladas fosse superior a 99/100.</p>", "ask": "A quantidade mínima de novas placas de propaganda a serem instaladas é", "opts": {"A": "99", "B": "51", "C": "50", "D": "6", "E": "1"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a24", "ph": "a", "year": 2019, "num": 167, "title": "Os alunos de uma turma escolar foram divididos em…", "src": "ENEM 2019 · Questão 167", "rate": null, "body": "<p>Os alunos de uma turma escolar foram divididos em dois grupos. Um grupo jogaria basquete, enquanto o outro jogaria futebol.</p>\n<p>Sabe-se que o grupo de basquete é formado pelos alunos mais altos da classe e tem uma pessoa a mais do que o grupo de futebol.</p>\n<p>A tabela seguinte apresenta informações sobre as alturas dos alunos da turma.</p>\n<p>Os alunos P, J, F e M medem, respectivamente, 1,65m, 1,66m, 1,67m e 1,68m, e as suas alturas não são iguais a de nenhum outro colega da sala.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-167-8df2118f.webp\" width=\"251\" height=\"51\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Segundo essas informações, argumenta-se que os alunos P, J, F e M jogaram, respectivamente,", "opts": {"A": "Basquete, basquete, basquete, basquete.", "B": "Futebol, basquete, basquete, basquete.", "C": "Futebol, futebol, basquete, basquete.", "D": "Futebol, futebol, futebol, basquete.", "E": "Futebol, futebol, futebol, futebol."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a25", "ph": "a", "year": 2018, "num": 137, "title": "Um contrato de empréstimo prevê que quando uma…", "src": "ENEM 2018 · Questão 137", "rate": null, "body": "<p>Um contrato de empréstimo prevê que quando uma parcela é paga de forma antecipada, conceder-se-á uma redução de juros de acordo com o período de antecipação. Nesse caso, paga-se o valor presente, que é o valor, naquele momento, de uma quantia que deveria ser paga em uma data futura. Um valor presente <i>P</i> submetido a juros compostos com taxa <i>i</i>, por um período de tempo <i>n</i>, produz um valor futuro <i>V</i> determinado pela fórmula:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-137-477c2dff.webp\" width=\"97\" height=\"24\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Em um contrato de empréstimo com sessenta parcelas fixas mensais, de R$820,00, a uma taxa de juros de 1,32% ao mês, junto com a trigésima parcela será paga antecipadamente uma outra parcela, desde que o desconto seja superior a 25% do valor da parcela.</p>\n<p>Utilize 0,2877 como aproximação para In <img class=\"enem-inline\" src=\"img/2018-137-2061f394.webp\" width=\"30\" height=\"36\" alt=\"\" loading=\"lazy\"> e 0,0131 como aproximação para In (1,0132).</p>", "ask": "A primeira das parcelas que poderá ser antecipada junto com a 30ª é a", "opts": {"A": "56ª", "B": "55ª", "C": "52ª", "D": "51ª", "E": "45ª"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a26", "ph": "a", "year": 2018, "num": 144, "title": "Em um aeroporto, os passageiros devem submeter suas…", "src": "ENEM 2018 · Questão 144", "rate": null, "body": "<p>Em um aeroporto, os passageiros devem submeter suas bagagens a uma das cinco máquinas de raio-X disponíveis ao adentrarem a sala de embarque. Num dado instante, o tempo gasto por essas máquinas para escanear a bagagem de cada passageiro e o número de pessoas presentes em cada fila estão apresentados em um painel, como mostrado na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-144-c95def0f.webp\" width=\"336\" height=\"68\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Um passageiro, ao chegar à sala de embarque desse aeroporto no instante indicado, visando esperar o menor tempo possível, deverá se dirigir à máquina", "opts": {"A": "1.", "B": "2.", "C": "3.", "D": "4.", "E": "5."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a27", "ph": "a", "year": 2018, "num": 147, "title": "O colesterol total de uma pessoa é obtido pela soma…", "src": "ENEM 2018 · Questão 147", "rate": null, "body": "<p>O colesterol total de uma pessoa é obtido pela soma da taxa do seu “colesterol bom” com a taxa do seu “colesterol ruim”. Os exames periódicos, realizados em um paciente adulto, apresentaram taxa normal de “colesterol bom”, porém, taxa do “colesterol ruim” (também chamado LDL) de 280 mg/dL. O quadro apresenta uma classificação de acordo com as taxas de LDL em adultos.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-147-38704883.webp\" width=\"344\" height=\"159\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O paciente, seguindo as recomendações médicas sobre estilo de vida e alimentação, realizou o exame logo após o primeiro mês, e a taxa de LDL reduziu 25%. No mês seguinte, realizou novo exame e constatou uma redução de mais 20% na taxa de LDL.</p>", "ask": "De acordo com o resultado do segundo exame, a classificação da taxa de LDL do paciente é", "opts": {"A": "Ótima.", "B": "Próxima de ótima.", "C": "Limite", "D": "Alta.", "E": "Muito alta."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a28", "ph": "a", "year": 2018, "num": 162, "title": "Torneios de tênis, em geral, são disputados em…", "src": "ENEM 2018 · Questão 162", "rate": null, "body": "<p>Torneios de tênis, em geral, são disputados em sistema de eliminatória simples. Nesse sistema, são disputadas partidas entre dois competidores, com a eliminação do perdedor e promoção do vencedor para a fase seguinte. Dessa forma, se na 1ª fase o torneio conta com 2_n_ competidores, então na 2ª fase restarão <i>n</i> competidores, e assim sucessivamente até a partida final.  <br>Em um torneio de tênis, disputado nesse sistema, participam 128 tenistas.</p>", "ask": "Para se definir o campeão desse torneio, o número de partidas necessárias é dado por", "opts": {"A": "2 X 128", "B": "64 + 32 + 16 + 8 + 4 + 2", "C": "128 + 64 + 32 + 16 + 8 + 4 + 2 + 1", "D": "128 + 64 + 32 + 16 + 8 + 4 + 2", "E": "64 + 32 + 16 + 8+ 4 + 2+ 1"}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a29", "ph": "a", "year": 2018, "num": 163, "title": "O artigo 33 da lei brasileira sobre drogas prevê a…", "src": "ENEM 2018 · Questão 163", "rate": null, "body": "<p>O artigo 33 da lei brasileira sobre drogas prevê a pena de reclusão de 5 a 15 anos para qualquer pessoa que seja condenada por tráfico ilícito ou produção não autorizada de drogas. Entretanto, caso o condenado seja réu primário, com bons antecedentes criminais, essa pena pode sofrer uma redução de um sexto a dois terços.</p>\n<p>Suponha que um réu primário, com bons antecedentes criminais, foi condenado pelo artigo 33 da lei brasileira sobre drogas.</p>", "ask": "Após o benefício da redução de pena, sua pena poderá variar de", "opts": {"A": "1 ano e 8 meses a 12 anos e 6 meses.", "B": "1 ano e 8 meses a 5 anos.", "C": "3 anos e 4 meses a 10 anos.", "D": "4 anos e 2 meses a 5 anos.", "E": "4 anos e 2 meses a 12 anos e 6 meses."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "a30", "ph": "a", "year": 2018, "num": 164, "title": "Um edifício tem a numeração dos andares iniciando…", "src": "ENEM 2018 · Questão 164", "rate": null, "body": "<p>Um edifício tem a numeração dos andares iniciando no térreo (T), e continuando com primeiro, segundo, terceiro, …, até o último andar. Uma criança entrou no elevador e, tocando no painel, seguiu uma sequência de andares, parando, abrindo e fechando a porta em diversos andares. A partir de onde entrou a criança, o elevador subiu sete andares, em seguida desceu dez, desceu mais treze, subiu nove, desceu quatro e parou no quinto andar, finalizando a sequência. Considere que, no trajeto seguido pela criança, o elevador parou uma vez no último andar do edifício.</p>", "ask": "De acordo com as informações dadas, o último andar do edifício é o", "opts": {"A": "16º", "B": "22º", "C": "23º", "D": "25º", "E": "32º"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.a }),
  Object.assign({"id": "b1", "ph": "b", "year": 2023, "num": 147, "title": "Alguns estudos comprovam que os carboidratos…", "src": "ENEM 2023 · Questão 147", "rate": null, "body": "", "ask": "Alguns estudos comprovam que os carboidratos fornecem energia ao corpo, preservam as proteínas estruturais dos músculos durante a prática de atividade física e ainda dão força para o cérebro coordenar os movimentos, o que de fato tem impacto positivo no desenvolvimento do praticante. O ideal é consumir 1 grama de carboidrato para cada minuto de caminhada.<br>CIRINO, C. Boa pergunta: consumir carboidratos antes dos exercícios melhora o desempenho do atleta? Revista Saúde! É Vital, n. 330, nov. 2010 (adaptado).<br>Um casal realizará diariamente 30 minutos de caminhada, ingerindo, antes dessa atividade, a quantidade ideal de carboidratos recomendada. Para ter o consumo ideal apenas por meio do consumo de pão de fôrma integral, o casal planeja garantir o suprimento de pães para um período de 30 dias ininterruptos. Sabe-se que cada pacote desse pão vem com 18 fatias, e que cada uma delas tem 15 gramas de carboidratos.<br>A quantidade mínima de pacotes de pão de fôrma necessários para prover o suprimento a esse casal é", "opts": {"A": "1", "B": "4", "C": "6", "D": "7", "E": "8"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b2", "ph": "b", "year": 2023, "num": 149, "title": "Um controlador de voo dispõe de um instrumento que…", "src": "ENEM 2023 · Questão 149", "rate": null, "body": "<p>Um controlador de voo dispõe de um instrumento que descreve a altitude de uma aeronave em voo, em função da distância em solo. Essa distância em solo é a medida na horizontal entre o ponto de origem do voo até o ponto que representa a projeção ortogonal da posição da aeronave, em voo, no solo. Essas duas grandezas são dadas numa mesma unidade de medida.</p>\n<p>A tela do instrumento representa proporcionalmente as dimensões reais das distâncias associadas ao voo. A figura apresenta a tela do instrumento depois de concluída a viagem de um avião, sendo a medida do lado de cada quadradinho da malha igual a 1 cm.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2023-149-a88a534d.webp\" width=\"579\" height=\"220\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Essa tela apresenta os dados de um voo cuja maior altitude alcançada foi de 5 km.<br>A escala em que essa tela representa as medidas reais é", "opts": {"A": "1 : 5.", "B": "1 : 11.", "C": "1 : 55.", "D": "1 : 5000.", "E": "1 : 500 000."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b3", "ph": "b", "year": 2023, "num": 173, "title": "Entre maratonistas, um parâmetro utilizado é o de…", "src": "ENEM 2023 · Questão 173", "rate": null, "body": "<p>Entre maratonistas, um parâmetro utilizado é o de economia de corrida (EC). O valor desse parâmetro é calculado pela razão entre o consumo de oxigênio, em mililitro (mL) por minuto (min), e a massa, em quilograma (kg), do atleta correndo a uma velocidade constante.</p>\n<p class=\"src-note\">Disponível em: www.treinamentoonline.com.br. Acesso em: 23 out. 2019 (adaptado).</p>", "ask": "Um maratonista, visando melhorar sua performance, auxiliado por um médico, mensura o seu consumo de oxigênio por minuto a velocidade constante. Com base nesse consumo e na massa do atleta, o médico calcula o EC do atleta.<br>A unidade de medida da grandeza descrita pelo parâmetro EC é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2023-173-58763f45.webp", 72, 56], "B": ["img/2023-173-81adc538.webp", 74, 58], "C": ["img/2023-173-5d5d774d.webp", 74, 51], "D": ["img/2023-173-3464da35.webp", 81, 55], "E": ["img/2023-173-146d0f23.webp", 66, 60]}}, { hint: PH_HINT.b }),
  Object.assign({"id": "b4", "ph": "b", "year": 2022, "num": 139, "title": "Um casal está reformando a cozinha de casa e…", "src": "ENEM 2022 · Questão 139", "rate": null, "body": "<p>Um casal está reformando a cozinha de casa e decidiu comprar um refrigerador novo. Observando a planta da nova cozinha, desenhada na escala de 1: 50, notaram que o espaço destinado ao refrigerador tinha 3,8 cm de altura e 1,6 cm de largura. Eles sabem que os fabricantes de refrigeradores indicam que, para um bom funcionamento e fácil manejo na limpeza, esses eletrodomésticos devem ser colocados em espaços que permitam uma distância de, pelo menos, 10 cm de outros móveis ou paredes, tanto na parte superior quanto nas laterais. O casal comprou um refrigerador que caberia no local a ele destinado na nova cozinha, seguindo as instruções do fabricante.</p>", "ask": "Esse refrigerador tem altura e largura máximas, em metro, respectivamente, iguais a", "opts": {"A": "1,80 e 0,60.", "B": "1,80 e 0,70.", "C": "1,90 e 0,80.", "D": "2,00 e 0,90.", "E": "2,00 e 1,00."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b5", "ph": "b", "year": 2022, "num": 145, "title": "O pacote básico de um jogo para smartphone, que é…", "src": "ENEM 2022 · Questão 145", "rate": null, "body": "<p>O pacote básico de um jogo para smartphone, que é vendido a R$ 50,00, contém 2 000 gemas e 100 000 moedas de ouro, que são itens utilizáveis nesse jogo.  <br>A empresa que comercializa esse jogo decidiu criar um pacote especial que será vendido a R$ 100,00 e que se diferenciará do pacote básico por apresentar maiores quantidades de gemas e moedas de ouro. Para estimular as vendas desse novo pacote, a empresa decidiu inserir nele 6 000 gemas a mais, em relação ao que o cliente teria caso optasse por comprar, com a mesma quantia, dois pacotes básicos.</p>", "ask": "A quantidade de moedas de ouro que a empresa deverá inserir ao pacote especial, para que seja mantida a mesma proporção existente entre as quantidades de gemas e de moedas de ouro contidas no pacote básico, é", "opts": {"A": "50 000.", "B": "100 000.", "C": "200 000.", "D": "300 000.", "E": "400 000."}, "ans": "E", "sol": "<p>Gabarito oficial do INEP: <b>E</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b6", "ph": "b", "year": 2022, "num": 148, "title": "A luminosidade L de uma estrela está relacionada…", "src": "ENEM 2022 · Questão 148", "rate": null, "body": "<p>A luminosidade <i>L</i> de uma estrela está relacionada com o raio <i>R</i> e com a temperatura <i>T</i> dessa estrela segundo a Lei de Stefan-Boltzmann: <img class=\"enem-inline\" src=\"img/2022-148-00e98ef8.webp\" width=\"127\" height=\"30\" alt=\"\" loading=\"lazy\"> em que c é uma constante igual para todas as estrelas.</p>\n<p class=\"src-note\">Disponível em: http://ciencia.hsw.uol.com.br. Acesso em: 22 nov. 2013 (adaptado)</p>\n<p>Considere duas estrelas <i>E</i> e <i>F</i>, sendo que a estrela <i>E</i> tem metade do raio da estrela <i>F</i> e o dobro da temperatura de <i>F</i>.</p>", "ask": "Indique por LE  e LF suas respectivas luminosidades.<br>A relação entre as luminosidades dessas duas estrelas é dada por", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2022-148-623219f3.webp", 78, 56], "B": ["img/2022-148-ac0ff64f.webp", 78, 61], "C": ["img/2022-148-282300db.webp", 76, 42], "D": ["img/2022-148-2e2fa9f3.webp", 83, 37], "E": ["img/2022-148-c37d4dda.webp", 85, 41]}}, { hint: PH_HINT.b }),
  Object.assign({"id": "b7", "ph": "b", "year": 2022, "num": 151, "title": "Um médico faz o acompanhamento clínico de um grupo…", "src": "ENEM 2022 · Questão 151", "rate": null, "body": "<p>Um médico faz o acompanhamento clínico de um grupo de pessoas que realizam atividades físicas diariamente. Ele observou que a perda média de massa dessas pessoas para cada hora de atividade física era de 1,5 kg. Sabendo que a massa de 1 L de água é de 1 kg, ele recomendou que ingerissem, ao longo das 3 horas seguintes ao final da atividade, uma quantidade total de água correspondente a 40% a mais do que a massa perdida na atividade física, para evitar desidratação.</p>\n<p>Seguindo a recomendação médica, uma dessas pessoas ingeriu, certo dia, um total de 1,7 L de água após  <br>terminar seus exercícios físicos.</p>", "ask": "Para que a recomendação médica tenha efetivamente sido respeitada, a atividade física dessa pessoa, nesse dia, durou", "opts": {"A": "30 minutos ou menos.", "B": "Mais de 35 e menos de 45 minutos.", "C": "Mais de 45 e menos de 55 minutos.", "D": "Mais de 60 e menos de 70 minutos.", "E": "70 minutos ou mais."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b8", "ph": "b", "year": 2022, "num": 161, "title": "Uma empresa de engenharia projetou uma casa com a…", "src": "ENEM 2022 · Questão 161", "rate": null, "body": "<p>Uma empresa de engenharia projetou uma casa com a forma de um retângulo para um de seus clientes. Esse cliente solicitou a inclusão de uma varanda em forma de L. A figura apresenta a planta baixa desenhada pela empresa, já com a varanda incluída, cujas medidas, indicadas em centímetro, representam os valores das dimensões da varanda na escala de 1 : 50.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-161-e1e86e81.webp\" width=\"351\" height=\"249\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A medida real da área da varanda, em metro quadrado, é", "opts": {"A": "33,40", "B": "66,80", "C": "89,24", "D": "133,60", "E": "534,40"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b9", "ph": "b", "year": 2022, "num": 164, "title": "Um borrifador de atuação automática libera, a cada…", "src": "ENEM 2022 · Questão 164", "rate": null, "body": "<p>Um borrifador de atuação automática libera, a cada acionamento, uma mesma quantidade de inseticida. O recipiente desse produto, quando cheio, contém 360 mL de inseticida, que duram 60 dias se o borrifador permanecer ligado ininterruptamente e for acionado a cada 48 minutos.</p>", "ask": "A quantidade de inseticida que é liberada a cada acionamento do borrifador, em mililitro, é", "opts": {"A": "0,125.", "B": "0,200.", "C": "4,800.", "D": "6,000.", "E": "12,000."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b10", "ph": "b", "year": 2022, "num": 165, "title": "Definem-se o dia e o ano de um planeta de um…", "src": "ENEM 2022 · Questão 165", "rate": null, "body": "<p>Definem-se o dia e o ano de um planeta de um sistema solar como sendo, respectivamente, o tempo que o planeta leva para dar 1 volta completa em torno de seu próprio eixo de rotação e o tempo para dar 1 volta completa em torno de seu Sol.  <br>Suponha que exista um planeta Z, em algum sistema solar, onde um dia corresponda a 73 dias terrestres e que 2 de seus anos correspondam a 1 ano terrestre. Considere que 1 ano terrestre tem 365 de seus dias.</p>", "ask": "No planeta Z, seu ano corresponderia a quantos de seus dias?", "opts": {"A": "2,5", "B": "10,0", "C": "730,0", "D": "13 322,5", "E": "53 290,0"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b11", "ph": "b", "year": 2022, "num": 170, "title": "No período de 2005 a 2013, o valor de venda dos…", "src": "ENEM 2022 · Questão 170", "rate": null, "body": "<p>No período de 2005 a 2013, o valor de venda dos imóveis em uma cidade apresentou alta, o que resultou no aumento dos aluguéis. Os gráficos apresentam a evolução desses valores, para um mesmo imóvel, no  <br>mercado imobiliário dessa cidade.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-170-be397d74.webp\" width=\"268\" height=\"311\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A rentabilidade do aluguel de um imóvel é calculada pela razão entre o valor mensal de aluguel e o valor de mercado desse imóvel.</p>", "ask": "Com base nos dados fornecidos, em que ano a rentabilidade do aluguel foi maior?", "opts": {"A": "2005", "B": "2007", "C": "2009", "D": "2011", "E": "2013"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b12", "ph": "b", "year": 2022, "num": 173, "title": "Uma instituição de ensino superior ofereceu vagas…", "src": "ENEM 2022 · Questão 173", "rate": null, "body": "<p>Uma instituição de ensino superior ofereceu vagas em um processo seletivo de acesso a seus cursos. Finalizadas as inscrições, foi divulgada a relação do número de candidatos por vaga em cada um dos cursos oferecidos. Esses dados são apresentados no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2022-173-0e6a9a19.webp\" width=\"507\" height=\"442\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Qual foi o número total de candidatos inscritos nesse processo seletivo?", "opts": {"A": "200", "B": "400", "C": "1200", "D": "1235", "E": "7200"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b13", "ph": "b", "year": 2021, "num": 143, "title": "O gráfico apresenta o nível de ocupação dos cinco…", "src": "ENEM 2021 · Questão 143", "rate": null, "body": "<p>O gráfico apresenta o nível de ocupação dos cinco reservatórios de água que abasteciam uma cidade em 2 de Fevereiro de 2015.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-143-6658b31a.webp\" width=\"349\" height=\"308\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nessa data, o reservatório com o maior volume de água era o", "opts": {"A": "I.", "B": "II.", "C": "III.", "D": "IV.", "E": "V."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b14", "ph": "b", "year": 2021, "num": 153, "title": "Um parque temático brasileiro construiu uma réplica…", "src": "ENEM 2021 · Questão 153", "rate": null, "body": "<p>Um parque temático brasileiro construiu uma réplica em miniatura do castelo de Liechtenstein. O castelo original, representado na imagem, está situado na Alemanha e foi reconstruído entre os anos de 1840 e 1842, após duas destruições causadas por guerras.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-153-6826c1c9.webp\" width=\"702\" height=\"583\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O castelo possui uma ponte de 38,4m de comprimento e 1,68m de largura. O artesão que trabalhou para o parque produziu a réplica do castelo, em escala. Nessa obra, as medidas do comprimento e da largura da ponte eram, respectivamente, 160cm e 7 cm.</p>", "ask": "A escala utilizada para fazer a réplica é", "opts": {"A": "1 : 576", "B": "1 : 240", "C": "1 : 24", "D": "1 : 4,2", "E": "1 : 2,4"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b15", "ph": "b", "year": 2021, "num": 154, "title": "A demografia médica é o estudo da população de…", "src": "ENEM 2021 · Questão 154", "rate": null, "body": "<p>A demografia médica é o estudo da população de médicos no Brasil nos aspectos quantitativo e qualitativo, sendo um dos seus objetivos fazer projeções sobre a necessidade da formação de novos médicos. Um desses estudos gerou um conjunto de dados que aborda a evolução do número de médicos e da população brasileira por várias décadas. O quadro apresenta parte desses dados.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2021-154-06fed6e4.webp\" width=\"715\" height=\"243\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Segundo uma projeção estatística, a variação do número de médicos e o da população brasileira de 2010 para 2020 será a média entre a variação de 1990 para 2000 e a de 2000 para 2010. Com o resultado dessa projeção, determina-se o número de médicos por mil habitantes no ano de 2020.</p>\n<p class=\"src-note\">Disponível em: www.cremesp.org.br. Acesso em: 24 jun. 2015 (adaptado)</p>", "ask": "O número, com duas casas na parte decimal, mais próximo do número de médicos por mil habitantes no ano de 2020 seria de", "opts": {"A": "0,17", "B": "0,49", "C": "1,71", "D": "2,06", "E": "3,32"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b16", "ph": "b", "year": 2021, "num": 158, "title": "Para realizar um voo entre duas cidades que distam…", "src": "ENEM 2021 · Questão 158", "rate": null, "body": "<p>Para realizar um voo entre duas cidades que distam 2 000 km uma da outra, uma companhia aérea utilizava um modelo de aeronave A, capaz de transportar até 200 passageiros. Quando uma dessas aeronaves está lotada de passageiros, o consumo de combustível é de 0,02 litro por quilômetro e por passageiro. Essa companhia resolveu trocar o modelo de aeronave A pelo modelo de aeronave B, que é capaz de transportar 10% de passageiros a mais do que o modelo A, mas consumindo 10% menos combustível por quilômetro e por passageiro.</p>", "ask": "A quantidade de combustível consumida pelo modelo de aeronave B, em relação à do modelo de aeronave B, em relação à do modelo de aeronave A, em um voo lotado entre as duas cidades, é", "opts": {"A": "10% menor", "B": "1% menor", "C": "Igual", "D": "1% maior", "E": "11% maior"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b17", "ph": "b", "year": 2021, "num": 159, "title": "Em uma corrida automobilística, os carros podem…", "src": "ENEM 2021 · Questão 159", "rate": null, "body": "<p>Em uma corrida automobilística, os carros podem fazer paradas nos boxes para efetuar trocar de pneus. Nessas trocas, o trabalho é feito por um grupo de três pessoas em cada pneu. Considere que os grupos iniciam o trabalho no mesmo instante, trabalham à mesma velocidade e cada grupo trabalha em um único pneu. Com os quatro grupos completos, são necessários 4 segundos para que a troca seja efetuada. O tempo gasto por um grupo para trocar um pneu é inversamente proporcional ao número de pessoas trabalhando nele. Em uma dessas paradas, um dos trabalhadores passou mal, não pôde participar da troca e nem foi substituído, de forma que um dos quatro grupos de troca ficou reduzido.</p>", "ask": "Nessa parada específica, com um dos grupos reduzido, qual foi o tempo gasto, em segundo, para trocar os quatro pneus?", "opts": {"A": "6,0", "B": "5,7", "C": "5,0", "D": "4,5", "E": "4,4"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b18", "ph": "b", "year": 2021, "num": 163, "title": "A relação de Newton-Laplace estabelece que o módulo…", "src": "ENEM 2021 · Questão 163", "rate": null, "body": "<p>A relação de Newton-Laplace estabelece que o módulo volumétrico de um fluído é diretamente proporcional ao quadrado da velocidade do som (em metro por segundo) no fluido e à sua densidade (em quilograma por meto cúbico), com uma constante de proporcionalidade adimensional.</p>", "ask": "Nessa relação, a unidade de medida adequada para o módulo volumétrico é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2021-163-b08497a6.webp", 164, 48], "B": ["img/2021-163-e8929184.webp", 160, 45], "C": ["img/2021-163-381b63e2.webp", 143, 45], "D": ["img/2021-163-ef0b4b69.webp", 160, 45], "E": ["img/2021-163-2770886b.webp", 170, 53]}}, { hint: PH_HINT.b }),
  Object.assign({"id": "b19", "ph": "b", "year": 2021, "num": 165, "title": "Um automóvel apresenta um desempenho médio de 16…", "src": "ENEM 2021 · Questão 165", "rate": null, "body": "<p>Um automóvel apresenta um desempenho médio de 16 km/L. Um engenheiro desenvolveu um novo motor a combustão que economiza, em relação ao consumo do motor anterior, 0,1 L de combustível a cada 10 km percorridos.</p>", "ask": "O valor do desempenho médio do automóvel com o novo motor, em quilômetro por litro, expresso com uma casa decimal, é", "opts": {"A": "15,9", "B": "16,1", "C": "16,4", "D": "17,4", "E": "18,0"}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b20", "ph": "b", "year": 2021, "num": 178, "title": "Uma unidade de medida comum usada para a expressar…", "src": "ENEM 2021 · Questão 178", "rate": null, "body": "<p>Uma unidade de medida comum usada para a expressar áreas de terrenos de grandes dimensões é o hectare, que equivale a 10 000 m². Um fazendeiro decide fazer um loteamento utilizando 3 hectares de sua fazenda, dos quais 0,9 hectare será usado para a construção de ruas e calçadas e o restante será dividido em terrenos com área de 300 m² cada um. Os 20 primeiros terrenos vendidos terão preços promocionais de R$ 20 000,00 cada, e os demais, R$ 30 000,00 cada.</p>", "ask": "Nas condições estabelecidas, o valor total, em real, obtido, pelo fazendeiro com a venda de todos os terrenos será igual a", "opts": {"A": "700 000", "B": "1 600 000", "C": "1 900 000", "D": "2 200 000", "E": "2 800 000"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b21", "ph": "b", "year": 2020, "num": 137, "title": "Uma empresa de ônibus utiliza um sistema de vendas…", "src": "ENEM 2020 · Questão 137", "rate": null, "body": "<p>Uma empresa de ônibus utiliza um sistema de vendas de passagens que fornece a imagem de todos os assentos do ônibus, diferenciando os assentos já vendidos, por uma cor mais escura, dos assentos ainda disponíveis. A empresa monitora, permanentemente, o número de assentos já vendidos e compara-o com o número total de assentos do ônibus para avaliar a necessidade de alocação de veículos extras.</p>\n<p>Na imagem tem-se a informação dos assentos já vendidos e dos assentos ainda disponíveis em um determinado instante.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-137-ff9b404e.webp\" width=\"464\" height=\"187\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A razão entre o número de assentos já vendidos e o total de assentos desse ônibus, no instante considerado na image, é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-137-17b0e46c.webp", 51, 59], "B": ["img/2020-137-231c1dc0.webp", 35, 49], "C": ["img/2020-137-08971458.webp", 41, 45], "D": ["img/2020-137-6387c790.webp", 40, 51], "E": ["img/2020-137-1e9528c7.webp", 40, 53]}}, { hint: PH_HINT.b }),
  Object.assign({"id": "b22", "ph": "b", "year": 2020, "num": 138, "title": "A caixa-d’água de um edifício terá a forma de um…", "src": "ENEM 2020 · Questão 138", "rate": null, "body": "<p>A caixa-d’água de um edifício terá a forma de um paralelepípedo retângulo reto com volume igual a 28 080 litros. Em uma maquete que representa o edifício, a caixa d’água tem dimensões 2 cm x 3,51 cm x 4 cm.</p>\n<p>Dado: 1 dm3 = 1 L</p>", "ask": "A escala usada pelo arquiteto foi", "opts": {"A": "1 : 10", "B": "1 : 100", "C": "1 : 1 000", "D": "1 : 10 000", "E": "1 : 100 000"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b23", "ph": "b", "year": 2020, "num": 139, "title": "Os gráficos representam a produção de peças em uma…", "src": "ENEM 2020 · Questão 139", "rate": null, "body": "<p>Os gráficos representam a produção de peças em uma indústria e as horas trabalhadas dos funcionários no período de cinco dias. Em cada dia, o gerente de produção aplica uma metodologia diferente de trabalho. Seu objetivo é avaliar a metodologia mais eficiente para utilizá-la como modelo nos próximos períodos. Sabe-se que, neste caso, quanto maior for a razão entre o número de peças produzidas e o número de horas trabalhadas, maior será a eficiência da metodologia.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-139-21679558.webp\" width=\"464\" height=\"235\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-139-f2008e36.webp\" width=\"310\" height=\"128\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Em qual dia foi aplicada a metodologia mais eficiente?", "opts": {"A": "1", "B": "2", "C": "3", "D": "4", "E": "5"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b24", "ph": "b", "year": 2020, "num": 147, "title": "Muitos modelos atuais de veículos possuem…", "src": "ENEM 2020 · Questão 147", "rate": null, "body": "<p>Muitos modelos atuais de veículos possuem computador de bordo. Os computadores informam em uma tela diversas variações de grandezas associadas ao desempenho do carro, dentre elas o consumo médio de combustível. Um veículo, de um determinado modelo, pode vir munido de um dos dois tipos de computadores de bordo:</p>\n<p>*   Tipo A: informa a quantidade X de litro de combustível gasto para percorrer 100 quilômetros<br>*   Tipo B: informa a quantidade de quilômetro que o veículo é capaz de percorrer com um litro de combustível.</p>\n<p>Um veículo utiliza o computador do Tipo A, e ao final de uma viagem o condutor viu apresentada na tela a informação “X/100”.</p>", "ask": "Caso o seu veículo utilizasse o computador do Tipo B, o valor informado na tela seria obtido pela operação", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-147-69c7e5f8.webp", 104, 43], "B": ["img/2020-147-f0b8be29.webp", 72, 69], "C": ["img/2020-147-f0df66d2.webp", 79, 55], "D": ["img/2020-147-12128e5e.webp", 60, 53], "E": ["img/2020-147-0f541af7.webp", 99, 47]}}, { hint: PH_HINT.b }),
  Object.assign({"id": "b25", "ph": "b", "year": 2020, "num": 152, "title": "Um processo de aeração, que consiste na introdução…", "src": "ENEM 2020 · Questão 152", "rate": null, "body": "<p>Um processo de aeração, que consiste na introdução de ar num líquido, acontece do seguinte modo: uma bomba B retira o líquido de um tanque T1 e o faz passar pelo aerador A1, que aumenta o volume do líquido em 15%, e em seguida pelo aerador A2, ganhando novo aumento de volume de 10%. Ao final, ele fica armazenado num tanque T2, de acordo com a figura</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-152-b470d661.webp\" width=\"458\" height=\"205\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Os tanques T1 e T2 são prismas retos de bases retangulares, sendo que a base de T1 tem comprimento c e largura L, e a base de T2 tem comprimento <img class=\"enem-inline\" src=\"img/2020-152-5547d80f.webp\" width=\"47\" height=\"56\" alt=\"\" loading=\"lazy\"> e largura 2L.</p>\n<p>Para finalizar o processo de aeração sem derramamento do líquido em T2, o responsável deve saber a relação entre a altura da coluna de líquido que já saiu de T1, denotada por x, e a altura da coluna de líquido que chegou a T2, denotada por y.</p>\n<p class=\"src-note\">Disponível em: www.dec.ufcg.edu.br. Acesso em: 21 abr. 2015.</p>", "ask": "A equação que relaciona as medidas das alturas y e x é dada por", "opts": {"A": "Y = 1,265x", "B": "Y = 1,250x", "C": "Y = 1,150x", "D": "Y = 1,125x", "E": "Y = x"}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b26", "ph": "b", "year": 2020, "num": 153, "title": "Para chegar à universidade, um estudante utiliza um…", "src": "ENEM 2020 · Questão 153", "rate": null, "body": "<p>Para chegar à universidade, um estudante utiliza um metrô e, depois, tem duas opções:</p>\n<p>*   seguir num ônibus, percorrendo 2,0 km;<br>*   alugar uma bicicleta, ao lado da estação do metrô, seguindo 3,0 km pela ciclovia.</p>\n<p>O quadro fornece as velocidades médias do ônibus e da bicicleta, em km/h, no trajeto metrô-universidade.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-153-e577551e.webp\" width=\"635\" height=\"315\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "A fim de poupar tempo no deslocamento para a universidade, em quais dias o aluno deve seguir pela ciclovia?", "opts": {"A": "Às segundas, quintas e sextas-feiras.", "B": "Às terças e quintas-feiras e aos sábados.", "C": "Às segundas, quartas e sextas-feiras.", "D": "Às terças, quartas e sextas-feiras.", "E": "Às terças e quartas-feiras e aos sábados."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b27", "ph": "b", "year": 2020, "num": 160, "title": "Um motociclista planeja realizar uma viagem cujo…", "src": "ENEM 2020 · Questão 160", "rate": null, "body": "<p>Um motociclista planeja realizar uma viagem cujo destino fica a 500 km de sua casa. Sua moto consome 5 litros de gasolina para cada 100 km rodados, e o tanque da moto tem capacidade para 22 litros. Pelo mapa, observou que no trajeto da viagem o último posto disponível para reabastecimento, chamado Estrela, fica a 80 km do seu destino. Ele pretende partir com o tanque da moto cheio e planeja fazer somente duas paradas para reabastecimento, uma na ida e outra na volta, ambas no posto Estrela. No reabastecimento para a viagem de ida, deve considerar também combustível suficiente para se deslocar por 200 km no seu destino.</p>", "ask": "A quantidade mínima de combustível, em litro, que esse motociclista deve reabastecer no posto Estrela na viagem de ida, que seja suficiente para fazer o segundo reabastecimento, é", "opts": {"A": "13.", "B": "14.", "C": "17.", "D": "18.", "E": "21."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b28", "ph": "b", "year": 2020, "num": 170, "title": "Antônio, Joaquim e José são sócios de uma empresa…", "src": "ENEM 2020 · Questão 170", "rate": null, "body": "<p>Antônio, Joaquim e José são sócios de uma empresa cujo capital é dividido, entre os três, em partes proporcionais a: 4, 6 e 6, respectivamente. Com a intenção de igualar a participação dos três sócios no capital da empresa, Antônio pretende adquirir uma fração do capital de cada um dos outros dois sócios.</p>", "ask": "A fração do capital de cada sócio que Antônio deverá adquirir é", "opts": {"A": "Figura A", "B": "Figura B", "C": "Figura C", "D": "Figura D", "E": "Figura E"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": "", "imgOpts": {"A": ["img/2020-170-80262705.webp", 44, 67], "B": ["img/2020-170-1cb92205.webp", 37, 64], "C": ["img/2020-170-86d7f914.webp", 45, 66], "D": ["img/2020-170-d0486bb1.webp", 36, 72], "E": ["img/2020-170-ffbeb7f2.webp", 38, 73]}}, { hint: PH_HINT.b }),
  Object.assign({"id": "b29", "ph": "b", "year": 2020, "num": 174, "title": "O fenômeno das manifestações populares de massa…", "src": "ENEM 2020 · Questão 174", "rate": null, "body": "<p>O fenômeno das manifestações populares de massa traz à discussão como estimar o número de pessoas presentes nesse tipo de evento. Uma metodologia usada é: no momento do ápice do evento, é feita uma foto aérea da via pública principal na área ocupada, bem como das vias afluentes que apresentem aglomerações de pessoas que acessam a via principal. A foto é sobreposta por um mapa virtual das vias, ambos na mesma escala, fazendo-se um esboço geométrico da situação. Em seguida, subdividese o espaço total em trechos, quantificando a densidade, da seguinte forma:</p>\n<p>• 4 pessoas por metro quadrado, se elas estiverem andando em uma mesma direção;</p>\n<p>• 5 pessoas por metro quadrado, se elas estiverem se movimentando sem deixar o local;</p>\n<p>• 6 pessoas por metro quadrado, se elas estiverem paradas.</p>\n<p>É feito, então, o cálculo do total de pessoas, considerando os diversos trechos, e desconta-se daí 1.000 pessoas para cada carro de som fotografado.</p>\n<p>Com essa metodologia, procederam-se aos cálculos para estimar o número de participantes na manifestação cujo esboço geométrico é dado na figura. Há três trechos na via principal: MN, NO e OP, e um trecho numa via afluente da principal: <i>QR</i>.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2020-174-ad3422ff.webp\" width=\"872\" height=\"276\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p><b>Obs.:</b> a figura não está em escala (considere as medidas dadas).</p>", "ask": "Segundo a metodologia descrita, o número estimado de pessoas presentes a essa manifestação foi igual a", "opts": {"A": "110.000", "B": "104.000", "C": "93.000", "D": "92.000", "E": "87.000"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b30", "ph": "b", "year": 2019, "num": 145, "title": "Um ciclista quer montar um sistema de marchas…", "src": "ENEM 2019 · Questão 145", "rate": null, "body": "<p>Um ciclista quer montar um sistema de marchas usando dois discos dentados na parte traseira de sua bicicleta, chamados catracas. A coroa é o disco dentado que é movimentado pelos pedais da bicicleta, sendo que a corrente transmite esse movimento às catracas, que ficam posicionadas na roda traseira da bicicleta.</p>\n<p>As diferentes marchas ficam definidas pelos diferentes diâmetros das catracas, que são medidos conforme indicação na figura.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-145-a77a3c83.webp\" width=\"458\" height=\"250\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>O ciclista já dispõe de uma catraca com 7 cm de diâmetro e pretende incluir uma segunda catraca, de modo que, à medida em que a corrente passe por ela, a bicicleta avance 50% a mais do que avançaria se a corrente passasse pela primeira catraca, a cada volta completa dos pedais.</p>", "ask": "O valor mais próximo da medida do diâmetro da segunda catraca, em centímetro e com uma casa decimal, é", "opts": {"A": "2,3.", "B": "3,5.", "C": "4,7.", "D": "5,3.", "E": "10,5."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b31", "ph": "b", "year": 2019, "num": 148, "title": "O rótulo da embalagem de um cosmético informa que a…", "src": "ENEM 2019 · Questão 148", "rate": null, "body": "<p>O rótulo da embalagem de um cosmético informa que a dissolução de seu conteúdo, de acordo com suas especificações, rende 2,7 litros desse produto pronto para o uso. Uma pessoa será submetida a um tratamento estético em que deverá tomar um banho de imersão com esse produto numa banheira com capacidade de 0,3 m³.</p>\n<p>Para evitar o transbordamento, essa banheira será preenchida em 80% de sua capacidade.</p>", "ask": "Para esse banho, o número mínimo de embalagens desse cosmético é", "opts": {"A": "9.", "B": "12.", "C": "89.", "D": "112.", "E": "134."}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b32", "ph": "b", "year": 2019, "num": 152, "title": "Para contratar três máquinas que farão o reparo de…", "src": "ENEM 2019 · Questão 152", "rate": null, "body": "<p>Para contratar três máquinas que farão o reparo de vias rurais de um município, a prefeitura elaborou um edital que, entre outras cláusulas, previa:</p>\n<p>• Cada empresa interessada só pode cadastrar uma única máquina para concorrer ao edital;</p>\n<p>• O total de recursos destinados para contratar o conjunto das três máquinas é de R$ 31 000,00;</p>\n<p>• O valor a ser pago a cada empresa será inversamente proporcional à idade de uso da máquina cadastrada pela empresa para o presente edital.</p>\n<p>As três empresas vencedoras do edital cadastraram máquinas com 2, 3 e 5 anos de idade de uso.</p>", "ask": "Quanto receberá a empresa que cadastrou a máquina com maior idade de uso?", "opts": {"A": "R$ 3.100,00", "B": "R$ 6.000,00", "C": "R$ 6.200,00", "D": "R$ 15.000,00", "E": "R$ 15.500,00"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b33", "ph": "b", "year": 2019, "num": 158, "title": "Comum em lançamentos de empreendimentos…", "src": "ENEM 2019 · Questão 158", "rate": null, "body": "<p>Comum em lançamentos de empreendimentos imobiliários, as maquetes de condomínios funcionam como uma ótima ferramenta de marketing para as construtoras, pois, além de encantar clientes, auxiliam de maneira significativa os corretores na negociação e venda de imóveis.</p>\n<p>Um condomínio está sendo lançado em um novo bairro de uma cidade. Na maquete projetada pela construtora, em escala de 1 : 200, existe um reservatório de água com capacidade de 45 cm³.</p>\n<p>Quando todas as famílias estiverem residindo no condomínio, a estimativa é que, por dia, sejam consumidos 30.000 litros de água.</p>", "ask": "Em uma eventual falta de água, o reservatório cheio será suficiente para abastecer o condomínio por quantos dias?", "opts": {"A": "30", "B": "15", "C": "12", "D": "6", "E": "3"}, "ans": "C", "sol": "<p>Gabarito oficial do INEP: <b>C</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b34", "ph": "b", "year": 2019, "num": 162, "title": "O Sistema Métrico Decimal é o mais utilizado…", "src": "ENEM 2019 · Questão 162", "rate": null, "body": "<p>O Sistema Métrico Decimal é o mais utilizado atualmente para medir comprimentos e distâncias. Em algumas atividades, porém, é possível observar a utilização de diferentes unidades de medida.  <br>Um exemplo disso pode ser observado no quadro.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-162-7c72d0de.webp\" width=\"287\" height=\"104\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Assim, um pé, em polegada, equivale a", "opts": {"A": "0,1200.", "B": "0,3048.", "C": "1,0800.", "D": "12,0000.", "E": "36,0000."}, "ans": "D", "sol": "<p>Gabarito oficial do INEP: <b>D</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b35", "ph": "b", "year": 2019, "num": 170, "title": "A bula de um antibiótico infantil, fabricado na…", "src": "ENEM 2019 · Questão 170", "rate": null, "body": "<p>A bula de um antibiótico infantil, fabricado na forma de xarope, recomenda que sejam ministrados, diariamente, no máximo 500 mg desse medicamento para cada quilograma de massa do paciente. Um pediatra prescreveu a dosagem máxima desse antibiótico para ser ministrada diariamente a uma criança de 20 kg pelo período de 5 dias.</p>\n<p>Esse medicamento pode ser comprado em frascos de 10 mL, 50 mL, 100 mL, 250 mL e 500 mL. Os pais dessa criança decidiram comprar a quantidade exata de medicamento que precisará ser ministrada no tratamento, evitando a sobra de medicamento.</p>\n<p>Considere que 1 g desse medicamento ocupe um volume de 1 cm³.</p>", "ask": "A capacidade do frasco, em mililitro, que esses pais deverão comprar é", "opts": {"A": "10", "B": "50", "C": "100", "D": "250", "E": "500"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b36", "ph": "b", "year": 2019, "num": 178, "title": "Um comerciante, que vende somente pastel,…", "src": "ENEM 2019 · Questão 178", "rate": null, "body": "<p>Um comerciante, que vende somente pastel, refrigerante em lata e caldo de cana em copos, fez um levantamento das vendas realizadas durante a semana. O resultado desse levantamento está apresentado no gráfico.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-178-91a4ab56.webp\" width=\"651\" height=\"423\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Ele estima que venderá, em cada dia da próxima semana, uma quantidade de refrigerante em lata igual à soma das quantidades de refrigerante em lata e caldo de cana em copos vendidas no respectivo dia da ultima semana.</p>\n<p>Quanto aos pastéis, estima vender, a cada dia da próxima semana, uma quantidade igual à quantidade de refrigerante em lata que prevê vender em tal dia. Já para o número de caldo de cana em copos, estima que as vendas diárias serão iguais às da ultima semana.</p>", "ask": "Segundo essas estimativas, a quantidade a mais de pastéis que esse comerciante deve vender na próxima semana é", "opts": {"A": "20.", "B": "27.", "C": "44.", "D": "55.", "E": "71."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b37", "ph": "b", "year": 2019, "num": 180, "title": "Um casal planejou uma viagem e definiu como teto…", "src": "ENEM 2019 · Questão 180", "rate": null, "body": "<p>Um casal planejou uma viagem e definiu como teto para o gasto diário um valor de até R$ 1 000,00. Antes de decidir o destino da viagem, fizeram uma pesquisa sobre a taxa de câmbio vigente para as moedas de cinco países que desejavam visitar e também sobre as estimativas de gasto diário em cada um, com o objetivo de escolher o destino que apresentasse o menor custo diário em real.</p>\n<p>O quadro mostra os resultados obtidos com a pesquisa realizada.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2019-180-8813c78d.webp\" width=\"618\" height=\"124\" alt=\"Figura da questão\" loading=\"lazy\"></figure>", "ask": "Nessas condições, qual será o destino escolhido para a viagem?", "opts": {"A": "Austrália.", "B": "Canadá.", "C": "EUA.", "D": "França.", "E": "Reino Unido."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b38", "ph": "b", "year": 2018, "num": 143, "title": "Os tipos de prata normalmente vendidos são 975, 950…", "src": "ENEM 2018 · Questão 143", "rate": null, "body": "<p>Os tipos de prata normalmente vendidos são 975, 950 e 925. Essa classificação é feita de acordo com a sua pureza. Por exemplo, a prata 975 é a substância constituída de 975 partes de prata pura e 25 partes de cobre em 1 000 partes da substância. Já a prata 950 é constituída de 950 partes de prata pura e 50 de cobre em 1 000; e a prata 925 é constituída de 925 partes de prata pura e 75 partes de cobre em 1 000. Um ourives possui 10 gramas de prata 925 e deseja obter 40 gramas de prata 950 para produção de uma joia.</p>", "ask": "Nessas condições, quantos gramas de prata e de cobre, respectivamente, devem ser fundidos com os 10 gramas de prata 925?", "opts": {"A": "29,25 e 0,75", "B": "28,75 e 1,25", "C": "28,50 e 1,50", "D": "27,75 e 2,25", "E": "25,00 e 5,00"}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b39", "ph": "b", "year": 2018, "num": 149, "title": "A inclinação de uma rampa é calculada da seguinte…", "src": "ENEM 2018 · Questão 149", "rate": null, "body": "<p>A inclinação de uma rampa é calculada da seguinte maneira: para cada metro medido na horizontal, mede-se x centímetros na vertical. Diz-se, nesse caso, que a rampa tem inclinação de x%, como no exemplo da figura:</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-149-7cd35de7.webp\" width=\"345\" height=\"81\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>A figura apresenta um projeto de uma rampa de acesso a uma garagem residencial cuja base, situada 2 metros abaixo do nível da rua, tem 8 metros de comprimento.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-149-f33abdb8.webp\" width=\"718\" height=\"235\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Depois de projetada a rampa, o responsável pela obra foi informado de que as normas técnicas do município onde ela está localizada exigem que a inclinação máxima de uma rampa de acesso a uma garagem residencial seja de 20%.  <br>Se a rampa projetada tiver inclinação superior a 20%, o nível da garagem deverá ser alterado para diminuir o percentual de inclinação, mantendo o comprimento da base da rampa.</p>", "ask": "Para atender às normas técnicas do município, o nível da garagem deverá ser", "opts": {"A": "Elevado em 40 cm.", "B": "Elevado em 50 cm.", "C": "Mantido no mesmo nível.", "D": "Rebaixado em 40 cm.", "E": "Rebaixado em 50 cm."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b40", "ph": "b", "year": 2018, "num": 151, "title": "A Ecofont possui design baseado na velha fonte Vera…", "src": "ENEM 2018 · Questão 151", "rate": null, "body": "<p>A Ecofont possui <i>design</i> baseado na velha fonte Vera Sans. Porém, ela tem um diferencial: pequenos buraquinhos circulares congruentes, e em todo o seu corpo, presentes em cada símbolo. Esses furos proporcionam um gasto de tinta menor na hora da impressão.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-151-e405bd59.webp\" width=\"321\" height=\"233\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Suponha que a palavra ECO esteja escrita nessa fonte, com tamanho 192, e que seja composta por letras formadas por quadrados de lados x com furos circulares de raio <img class=\"enem-inline\" src=\"img/2018-151-57de2d97.webp\" width=\"41\" height=\"33\" alt=\"\" loading=\"lazy\"> Para que a área a ser pintada seja reduzida a <img class=\"enem-inline\" src=\"img/2018-151-54cbb144.webp\" width=\"20\" height=\"36\" alt=\"\" loading=\"lazy\"> da área inicial, pretende-se reduzir o tamanho da fonte. Sabe-se que, ao alterar o tamanho da fonte, o tamanho da letra é alterado na mesma proporção.</p>", "ask": "Nessas condições, o tamanho adequado da fonte será", "opts": {"A": "64.", "B": "48.", "C": "24.", "D": "21.", "E": "12."}, "ans": "B", "sol": "<p>Gabarito oficial do INEP: <b>B</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
  Object.assign({"id": "b41", "ph": "b", "year": 2018, "num": 157, "title": "Um mapa é a representação reduzida e simplificada…", "src": "ENEM 2018 · Questão 157", "rate": null, "body": "<p>Um mapa é a representação reduzida e simplificada de uma localidade. Essa redução, que é feita com o uso de uma escala, mantém a proporção do espaço representado em relação ao espaço real.  <br>Certo mapa tem escala 1 : 58 000 000.</p>\n<figure class=\"paper fig-img enem-fig\" data-zoom><img src=\"img/2018-157-4eb455e0.webp\" width=\"340\" height=\"266\" alt=\"Figura da questão\" loading=\"lazy\"></figure>\n<p>Considere que, nesse mapa, o segmento de reta que liga o navio à marca do tesouro meça 7,6 cm.</p>", "ask": "A medida real, em quilômetro, desse segmento de reta é", "opts": {"A": "4 408.", "B": "7 632.", "C": "44 080.", "D": "76 316.", "E": "440 800."}, "ans": "A", "sol": "<p>Gabarito oficial do INEP: <b>A</b>.</p><p class=\"sol-soon\">A resolução comentada desta questão está sendo preparada e será publicada em breve.</p>", "trap": ""}, { hint: PH_HINT.b }),
